<style>
  :root {
    color-scheme: light dark;
    --bg: #F8FAFC;
    --surface: #FFFFFF;
    --ink: #0F172A;
    --muted: #64748B;
    --line: #E2E8F0;
    --brand: #EA580C;
    --brand-hover: #C2410C;
    --brand-soft: #FFF7ED;
    --brand-border: #FDBA74;
    --brand-ink: #FFFFFF;
    --warn: #B45309;
    --danger: #DC2626;
    --ok: #15803D;
    --ok-bg: #F0FDF4;
    --bad-bg: #FEF2F2;
    --warn-bg: #FFFBEB;
    --shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B0F17;
      --surface: #131A26;
      --ink: #F1F5F9;
      --muted: #94A3B8;
      --line: #1E293B;
      --brand: #F97316;
      --brand-hover: #FB923C;
      --brand-soft: #271509;
      --brand-border: #7C2D12;
      --brand-ink: #FFFFFF;
      --warn: #FBBF24;
      --danger: #F87171;
      --ok: #4ADE80;
      --ok-bg: #0B2616;
      --bad-bg: #2C1215;
      --warn-bg: #291E09;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    font-size: 16px;
    line-height: 1.65;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 16px 16px 48px; }
  .wrap.wide { max-width: 820px; }
  .muted { color: var(--muted); }

  .ico { width: 19px; height: 19px; flex: none; vertical-align: middle; }
  .ico.sm { width: 16px; height: 16px; }

  /* Login */
  .login { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
  .mark { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .mark .logo-badge {
    width: 54px; height: 54px; border-radius: 16px;
    background: linear-gradient(135deg, #EA580C, #F97316);
    color: #fff; display: grid; place-items: center;
    box-shadow: 0 8px 20px rgba(234, 88, 12, 0.28);
  }
  .mark svg { width: 32px; height: auto; }
  .mark b { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; line-height: 1; }
  .mark b span { color: var(--brand); }
  .login p.lead { margin: 0 0 18px; color: var(--muted); }

  .panel {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 18px; box-shadow: var(--shadow);
  }

  label { display: block; font-weight: 600; font-size: 14px; margin: 0 0 6px; }
  .field { margin-bottom: 14px; }
  input, select, textarea {
    width: 100%; min-height: 46px; padding: 10px 14px;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px;
    font: inherit; font-size: 15px; transition: border-color .15s;
  }
  textarea { min-height: 110px; resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: var(--brand); }
  input[dir="ltr"] { text-align: left; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible {
    outline: 3px solid var(--brand); outline-offset: 2px;
  }
  .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }

  button { font: inherit; cursor: pointer; transition: all .15s; }
  .btn {
    width: 100%; min-height: 48px; border: 0; border-radius: 12px;
    background: var(--brand); color: var(--brand-ink);
    font-weight: 700; font-size: 15px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 12px rgba(234, 88, 12, 0.2);
  }
  .btn:hover:not([disabled]) { background: var(--brand-hover); }
  .btn[disabled] { opacity: .6; cursor: wait; box-shadow: none; }
  .btn.ghost {
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); font-weight: 600; font-size: 14px;
    min-height: 40px; width: auto; padding: 0 13px; box-shadow: none;
  }
  .btn.ghost:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
  .btn.soft {
    background: var(--brand-soft); color: var(--brand);
    border: 1px solid var(--brand-border); font-weight: 600; font-size: 14px;
    min-height: 40px; width: auto; padding: 0 13px; box-shadow: none;
  }
  .btn.sm { min-height: 35px; font-size: 13px; padding: 0 11px; width: auto; border-radius: 10px; }
  .btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; box-shadow: none; }
  .btn.danger:hover { background: var(--bad-bg); }
  .linkbtn { background: none; border: 0; color: var(--brand); font-weight: 600; padding: 10px 0; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }

  .msg { margin: 0 0 16px; padding: 12px 14px; border-radius: 12px; font-size: 14px; border: 1px solid var(--line); background: var(--bg); display: flex; align-items: center; gap: 8px; }
  .msg.err { color: var(--danger); border-color: var(--danger); background: var(--bad-bg); }
  .msg.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .top .who { min-width: 0; }
  .top h1 { margin: 0; font-size: 21px; line-height: 1.3; }
  .top .sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }

  h2 { font-size: 16.5px; margin: 22px 0 11px; display: flex; align-items: center; gap: 8px; color: var(--ink); }
  h2 svg { color: var(--brand); }
  h2:first-child { margin-top: 0; }
  .grid2 { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } }
  .two { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }

  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .kpi.accent {
    background: linear-gradient(135deg, #EA580C, #F97316);
    color: #fff; border: 0;
  }
  .kpi.accent .kl { color: rgba(255,255,255,0.9); }
  .kpi .kl { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .kpi .kv { font-size: 21px; font-weight: 700; line-height: 1.2; }

  .rows { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
  .row { padding: 13px 16px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .name { font-weight: 700; font-size: 15.5px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .row .meta { color: var(--muted); font-size: 13px; margin-top: 3px; overflow-wrap: anywhere; }
  .row .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .tag.active { color: var(--ok); background: var(--ok-bg); }
  .tag.suspended, .tag.expired { color: var(--danger); background: var(--bad-bg); }
  .tag.soon { color: var(--warn); background: var(--warn-bg); }
  .tag.none { color: var(--muted); }
  .tag.cat { color: var(--brand); background: var(--brand-soft); border-color: var(--brand-border); }
  .empty { padding: 24px 16px; color: var(--muted); text-align: center; font-size: 14px; }

  .stat { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .stat:last-child { border-bottom: 0; }
  .stat span:first-child { color: var(--muted); display: inline-flex; align-items: center; gap: 7px; font-size: 14.5px; }
  .stat b { font-weight: 700; }
  .stat.big b { font-size: 20px; color: var(--brand); }

  .loading { min-height: 100vh; display: grid; place-items: center; color: var(--muted); }

  /* Shell & Nav */
  .shell { min-height: 100vh; padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
  .oh {
    background: var(--surface); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 9;
  }
  .oh .in { max-width: 620px; margin: 0 auto; padding: 11px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .oh .brand-box { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .oh .mini-logo {
    width: 36px; height: 36px; border-radius: 11px;
    background: var(--brand); color: #fff; display: grid; place-items: center; flex: none;
  }
  .oh .gname { font-weight: 700; font-size: 16.5px; line-height: 1.25; }
  .oh .gsub { color: var(--muted); font-size: 12px; }
  .oh .sub-pill {
    background: var(--brand-soft); color: var(--brand); border: 1px solid var(--brand-border);
    padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
  }

  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
    box-shadow: 0 -2px 12px rgba(0,0,0,0.04);
  }
  .tabs button {
    flex: 1; background: none; border: 0; padding: 6px 2px; min-height: 60px;
    color: var(--muted); font-size: 11px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    position: relative;
  }
  .tabs button svg { width: 19px; height: 19px; }
  .tabs button[aria-current="page"] { color: var(--brand); }
  .tabs button[aria-current="page"]::before {
    content: ""; position: absolute; top: 0; width: 28px; height: 3px;
    background: var(--brand); border-radius: 0 0 4px 4px;
  }

  .seg {
    display: flex; gap: 6px; background: var(--surface); padding: 5px;
    border-radius: 14px; border: 1px solid var(--line); margin-bottom: 16px;
  }
  .seg button {
    flex: 1; border: 0; background: transparent; color: var(--muted);
    padding: 9px 10px; border-radius: 10px; font-weight: 600; font-size: 13.5px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .seg button.active { background: var(--brand); color: #fff; box-shadow: 0 2px 8px rgba(234, 88, 12, 0.25); }

  .prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .prod-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 13px; text-align: start; display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: var(--shadow);
  }
  .prod-card:hover:not([disabled]) { border-color: var(--brand); transform: translateY(-1px); }
  .prod-card[disabled] { opacity: 0.5; cursor: not-allowed; }
  .prod-card .pname { font-weight: 700; font-size: 15px; margin: 6px 0 4px; }
  .prod-card .pprice { font-weight: 700; color: var(--brand); font-size: 15.5px; }
  .prod-card .pstock { font-size: 12px; color: var(--muted); }
  .cart-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .cart-item:last-child { border-bottom: 0; }
  .qty-ctrl { display: inline-flex; align-items: center; gap: 8px; background: var(--bg); padding: 3px 8px; border-radius: 10px; border: 1px solid var(--line); }
  .qty-ctrl button { background: none; border: 0; color: var(--brand); font-weight: 700; width: 24px; height: 24px; display: grid; place-items: center; }

  .chart-wrap { position: relative; height: 220px; width: 100%; margin-top: 8px; }
  .chart-wrap.sm { height: 185px; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar input { flex: 1; min-width: 180px; }
  .toolbar select { width: auto; max-width: 100%; }
  .mrow { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
  .mrow:last-child { border-bottom: 0; }
  .mmain { flex: 1; min-width: 0; text-align: start; background: none; border: 0; color: inherit; padding: 12px 16px; }
  .mmain .name { font-weight: 700; font-size: 15.5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .mmain .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .mrow .side { padding-inline-end: 12px; display: flex; gap: 6px; align-items: center; }
  .due { color: var(--danger); font-weight: 600; }

  .result { border-radius: 16px; padding: 18px; margin: 16px 0; border: 1px solid currentColor; }
  .result.ok { background: var(--ok-bg); color: var(--ok); }
  .result.bad { background: var(--bad-bg); color: var(--danger); }
  .result.warn { background: var(--warn-bg); color: var(--warn); }
  .result .rn { font-size: 20px; font-weight: 700; color: var(--ink); margin: 4px 0; }
  .result .rt { font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .result .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

  #reader { width: 100%; max-width: 360px; margin: 12px auto; border-radius: 14px; overflow: hidden; }
  .qrbox { text-align: center; }
  .qrbox img { width: 210px; height: 210px; background: #fff; border-radius: 12px; padding: 8px; border: 1px solid var(--line); }
  .bigcode { font-size: 32px; font-weight: 700; letter-spacing: 3px; direction: ltr; color: var(--brand); }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(82px + env(safe-area-inset-bottom));
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px; z-index: 50;
    font-size: 14px; font-weight: 600; max-width: 90vw; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  .back { margin-bottom: 14px; }
</style>
</head>

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const monthStart = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-01`; };
const monthEnd = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-31`; };
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const endOfDay = s => { const d = parseYmd(s); d.setHours(23, 59, 59, 0); return d; };
const plusDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const fmtDate = d => d ? d.toLocaleDateString("ar-EG-u-nu-latn", { year: "numeric", month: "long", day: "numeric" }) : "—";
const fmtTime = d => d ? d.toLocaleTimeString("ar-EG-u-nu-latn", { hour: "2-digit", minute: "2-digit" }) : "";
const toDate = t => (t && typeof t.toDate === "function") ? t.toDate() : null;
const money = n => (Number(n) || 0).toLocaleString("en-US") + " ج";
const sum = (arr, k = "amount") => arr.reduce((a, x) => a + (Number(x[k]) || 0), 0);
const num = v => { const n = parseFloat(String(v).replace(/[^\d.]/g, "")); return isNaN(n) ? 0 : n; };
const isValidEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e || "").trim());

const withTimeout = (p, ms = 15000) => Promise.race([
  p, new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), ms))
]);

    "auth/unauthorized-domain": "هذا الرابط غير مضاف في Firebase. أضفه من Authentication ← Settings ← Authorized domains.",

function waPhone(p) {
  let d = String(p || "").replace(/\D/g, "");
  if (d.startsWith("00")) d = d.slice(2);
  if (d.startsWith("0")) d = "20" + d.slice(1);
  return d;
}
function waRawLink(phone, text) {
  return `https://wa.me/${waPhone(phone)}?text=${encodeURIComponent(text)}`;
}
const normPhone = p => String(p || "").replace(/\D/g, "").slice(-10);

function calcMemberState(m) {
  const end = toDate(m.endDate);
  if (!end) return { key: "none", label: "بدون اشتراك", left: null, end: null };
  const left = Math.ceil((end.getTime() - Date.now()) / DAY);
  if (end.getTime() < Date.now()) return { key: "expired", label: "منتهي", left: 0, end };
  if (left <= 7) return { key: "soon", label: "ينتهي قريبًا", left, end };
  return { key: "active", label: "نشط", left, end };
}
const fmtLeftText = st => st.end
  ? (st.key === "expired" ? `انتهى ${fmtDate(st.end)}` : (st.left <= 1 ? "ينتهي اليوم" : `متبقي ${st.left} يوم`))
  : "لم يشترك بعد";

function exportRevenueExcel(rows, filename) {
  const headers = ["التاريخ", "النوع", "العضو / المصدر", "البيان / الملاحظات", "المبلغ (جنيه)"];
  const lines = [headers.join(",")];
  let total = 0;
  for (const r of rows) {
    const amt = Number(r.amount) || 0;
    total += amt;
    const typeLabel = r.type === "store" ? "ستور وكافتيريا" : (r.type === "balance" ? "سداد متبقي" : "اشتراك");
    const cells = [r.date || "", typeLabel, r.memberName || "", r.note || "", amt]
      .map(v => `"${String(v ?? "").replace(/"/g, '""')}"`);
    lines.push(cells.join(","));
  }
  lines.push(`"","","","الإجمالي","${total}"`);
  const csv = "\uFEFF" + lines.join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

      <form class="panel" id="memberLoginForm" novalidate>

        </div>
        <div class="field">
          <label for="mId">رقم الهاتف أو الاسم</label>
          <input id="mId" autocomplete="username" required placeholder="010xxxxxxxx أو الاسم">
        </div>
        <div class="field">
          <label for="mPass">كلمة المرور</label>
          <input id="mPass" type="password" dir="ltr" autocomplete="current-password" required>
        </div>
        <button class="btn" type="submit" id="mLoginBtn">${ico("user")} دخول العضو</button>
      </form>
    `}
  </div>`;

  $("#modeStaff").addEventListener("click", () => { loginMode = "staff"; viewLogin(); });
  $("#modeMember").addEventListener("click", () => { loginMode = "member"; viewLogin(); });

  if (loginMode === "staff") {
    $("#loginForm").addEventListener("submit", async ev => {
      ev.preventDefault();
      const email = $("#email").value.trim().toLowerCase();
      const pass = $("#pass").value;
      if (!email || !pass) return viewLogin("اكتب الإيميل وكلمة المرور.");
      if (!isValidEmail(email)) return viewLogin("صيغة الإيميل غير صحيحة.");
      const btn = $("#loginBtn");
      btn.disabled = true; btn.textContent = "جاري الدخول…";
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (e) {
        viewLogin(errText(e));
        if ($("#email")) $("#email").value = email;
      }
    });

    $("#resetBtn").addEventListener("click", async () => {
      const email = $("#email").value.trim().toLowerCase();
      if (!email || !isValidEmail(email)) return viewLogin("اكتب إيميلًا صحيحًا أولًا ثم اضغط «نسيت كلمة المرور».");
      try {
        await sendPasswordResetEmail(auth, email);
        viewLogin("", `أرسلنا رابط إعادة تعيين كلمة المرور إلى ${email}.`);
      } catch (e) {
        viewLogin(errText(e));
      }
    });
  } else {
    $("#memberLoginForm").addEventListener("submit", async ev => {
      ev.preventDefault();
      const gymIdInput = $("#mGymCode").value.trim();
      const idVal = $("#mId").value.trim();
      const passVal = $("#mPass").value;
      if (!idVal || !passVal) return viewLogin("اكتب رقم الهاتف أو الاسم وكلمة المرور.");

      const btn = $("#mLoginBtn");
      btn.disabled = true; btn.textContent = "جاري التحقق…";
      try {
        const gymIds = gymIdInput ? [gymIdInput] : (await getDocs(collection(db, "gyms"))).docs.map(d => d.id);
        const inputDigits = normPhone(idVal);
        const inputName = idVal.toLowerCase();

        for (const gid of gymIds) {
          const gSnap = await getDoc(doc(db, "gyms", gid));
          if (!gSnap.exists()) continue;
          const gym = gSnap.data();
          const mSnap = await getDocs(collection(db, "gyms", gid, "members"));
          const matched = mSnap.docs.map(d => ({ id: d.id, ...d.data() })).find(m => {
            const byPhone = inputDigits.length >= 7 && normPhone(m.phone) === inputDigits;
            const byName = (m.name || "").trim().toLowerCase() === inputName;
            return (byPhone || byName) && String(m.password || "") === passVal && passVal.length > 0;
          });
          if (matched) {
            const [plansSnap, prodsSnap] = await Promise.all([
              getDocs(collection(db, "gyms", gid, "plans")),
              getDocs(collection(db, "gyms", gid, "products"))
            ]);
            const plans = plansSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            const products = prodsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            return renderMemberPortal(gym, matched, plans, products);
          }
        }
        viewLogin("بيانات الدخول غير صحيحة أو لم يتم تعيين كلمة مرور للعضو بعد.");
      } catch (e) {
        viewLogin(errText(e));
      }
    });
  }
}

  return `أهلًا ${m.name}، معك ${gname}.`;
}

function stopScanner() {
  if (scanner) {
    const s = scanner; scanner = null;
    s.stop().then(() => s.clear()).catch(() => {});

}

function nav(tab, sub = null) {

function planFieldsHtml(defaultStart) {
  if (!PLANS.length) {
    return `<p class="msg err">${ico("alert", "sm")} لا توجد باقات اشتراك. أضف باقة من تبويب «الإعدادات» أولًا.</p>`;
  }
  return `
  <div class="field">
    <label for="pf-plan">الباقة</label>
    <select id="pf-plan">${PLANS.map(p => `<option value="${esc(p.id)}">${esc(p.name)} — ${p.days} يوم — ${money(p.price)}</option>`).join("")}</select>
  </div>
  <div class="field">
    <label for="pf-start">تاريخ بداية الاشتراك</label>
    <input id="pf-start" type="date" dir="ltr" value="${esc(defaultStart)}">
  </div>
  <div class="two">
    <div class="field">
      <label for="pf-price">السعر</label>
      <input id="pf-price" type="number" inputmode="decimal" min="0" dir="ltr">
    </div>
    <div class="field">
      <label for="pf-paid">المدفوع الآن</label>
      <input id="pf-paid" type="number" inputmode="decimal" min="0" dir="ltr">
    </div>
  </div>
  <p class="hint" id="pf-rem"></p>`;
}
function wirePlanFields(box) {
  const sel = $("#pf-plan", box); if (!sel) return;
  const price = $("#pf-price", box), paid = $("#pf-paid", box), rem = $("#pf-rem", box);
  const upd = () => {
    const r = num(price.value) - num(paid.value);
    rem.textContent = r > 0 ? `المتبقي على العضو: ${money(r)}` : (r < 0 ? "المدفوع أكبر من السعر." : "مدفوع بالكامل.");
  };
  const fill = () => {
    const p = PLANS.find(x => x.id === sel.value);
    price.value = p ? p.price : 0;
    paid.value = p ? p.price : 0;
    upd();
  };
  sel.addEventListener("change", fill);
  price.addEventListener("input", upd);
  paid.addEventListener("input", upd);
  fill();
}
function readPlanFields(box) {
  const plan = PLANS.find(x => x.id === $("#pf-plan", box)?.value);
  const start = $("#pf-start", box)?.value;
  const price = num($("#pf-price", box)?.value);
  const paid = num($("#pf-paid", box)?.value);
  if (!plan) throw new Error("اختر باقة.");
  if (!start) throw new Error("اختر تاريخ البداية.");
  if (paid > price) throw new Error("المدفوع أكبر من السعر.");
  const endStr = plusDays(start, Number(plan.days) || 0);
  return { plan, start, price, paid, end: endOfDay(endStr) };
}

function subNewMember(main) {
  main.innerHTML = `

    <div class="field">

    </div>

    <button class="btn" type="submit" id="msave" ${PLANS.length ? "" : "disabled"}>${ico("check")} حفظ العضو</button>
  </form>`;
  $("#back").addEventListener("click", () => nav("members", null));
  wirePlanFields(main);

  $("#mform").addEventListener("submit", async ev => {
    ev.preventDefault();
    const msg = t => { $("#fmsg").innerHTML = t ? `<p class="msg err" role="alert">${ico("alert", "sm")} ${esc(t)}</p>` : ""; };
    const name = $("#mname").value.trim();
    const phone = $("#mphone").value.trim();
    const password = $("#mpass").value.trim();
    if (!name) return msg("اكتب اسم العضو.");
    if (phone && MEMBERS.some(m => normPhone(m.phone) === normPhone(phone))) {
      if (!confirm("هذا الرقم مسجل لعضو آخر. هل تريد المتابعة؟")) return;
    }
    let f;
    try { f = readPlanFields(main); } catch (e) { return msg(e.message); }
    const btn = $("#msave"); btn.disabled = true; btn.textContent = "جاري الحفظ…";
    msg("");
    try {
      const counterRef = ref("meta", "counters");
      const memberRef = doc(col("members"));
      const subRef = doc(col("subscriptions"));
      const payRef = doc(col("payments"));
      let code = "";
      await runTransaction(db, async tx => {
        const c = await tx.get(counterRef);
        const next = (c.exists() && c.data().member ? c.data().member : 1000) + 1;
        code = String(next);
        tx.set(counterRef, { member: next }, { merge: true });
        tx.set(memberRef, {
          name, phone, password, code, planId: f.plan.id, planName: f.plan.name,
          endDate: Timestamp.fromDate(f.end), balance: f.price - f.paid,
          createdAt: serverTimestamp()
        });
        tx.set(subRef, {
          memberId: memberRef.id, memberName: name, planId: f.plan.id, planName: f.plan.name,
          start: f.start, end: ymd(f.end), price: f.price, paid: f.paid, remaining: f.price - f.paid,
          createdAt: serverTimestamp(), by: G.uid
        });
        if (f.paid > 0) {
          tx.set(payRef, {
            memberId: memberRef.id, memberName: name, amount: f.paid, date: todayStr(),
            type: "subscription", note: f.plan.name, ts: serverTimestamp(), by: G.uid
          });
        }
      });
      MEMBERS.push({
        id: memberRef.id, name, phone, password, code, planId: f.plan.id, planName: f.plan.name,
        endDate: Timestamp.fromDate(f.end), balance: f.price - f.paid
      });
      toast(`تم حفظ ${name} — كود ${code}`);
      nav("members", { type: "member", id: memberRef.id });
    } catch (e) {
      msg(errText(e));
      btn.disabled = false; btn.innerHTML = `${ico("check")} حفظ العضو`;
    }
  });
}

        endDate: Timestamp.fromDate(f.end), balance: increment(f.price - f.paid)
      });
      if (f.paid > 0) {
        batch.set(doc(col("payments")), {
          memberId: m.id, memberName: m.name, amount: f.paid, date: todayStr(),
          type: "subscription", note: f.plan.name, ts: serverTimestamp(), by: G.uid
        });
      }
      await batch.commit();
      m.planId = f.plan.id; m.planName = f.plan.name;
      m.endDate = Timestamp.fromDate(f.end);
      m.balance = Number(m.balance || 0) + (f.price - f.paid);
      toast("تم تجديد الاشتراك");
      nav(null, { type: "member", id: m.id });
    } catch (e) {
      msg(errText(e));
      btn.disabled = false; btn.innerHTML = `${ico("check")} تأكيد التجديد`;
    }
  });
}

/* ---------- Check-in ---------- */
function findMember(raw) {
  const d = String(raw || "").trim().replace(/\D/g, "");
  if (!d) return null;
  if (d.length <= 6) return MEMBERS.find(m => String(m.code) === d) || null;
  const n = d.slice(-10);
  return MEMBERS.find(m => normPhone(m.phone) === n) || null;
}

function screenCheckin(main, tok) {
  main.innerHTML = `
  <h2>${ico("qr")} تسجيل الحضور</h2>
  <form class="panel" id="cform" novalidate>
    <div class="field">
      <label for="ccode">كود العضو أو رقم الموبايل</label>
      <input id="ccode" inputmode="numeric" dir="ltr" autocomplete="off" autofocus>
    </div>
    <div class="two">
      <button class="btn" type="submit">${ico("check")} تسجيل</button>
      <button class="btn ghost" type="button" id="scanBtn" style="width:100%">${ico("camera")} مسح بالكاميرا</button>
    </div>
  </form>
  <div id="reader"></div>
  <div id="result"></div>
  <h2>${ico("users")} حضور اليوم</h2>
  <div class="rows" id="todayList"><div class="empty">جاري التحميل…</div></div>`;

  $("#cform").addEventListener("submit", ev => {
    ev.preventDefault();
    const v = $("#ccode").value;
    $("#ccode").value = "";
    doCheckin(v);
  });
  $("#scanBtn").addEventListener("click", startScan);
  loadToday(tok);
}

async function startScan() {
  if (scanner) return stopScanner();
  const box = $("#result");
  try {
    const mod = await import("https://esm.sh/html5-qrcode@2.3.8");
    const Html5Qrcode = mod.Html5Qrcode || mod.default?.Html5Qrcode;
    const s = new Html5Qrcode("reader");
    scanner = s;
    await s.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      text => { stopScanner(); doCheckin(text); },
      () => {}
    );
  } catch {
    scanner = null;
    box.innerHTML = `<p class="msg err">${ico("alert", "sm")} تعذر تشغيل الكاميرا. اسمح للمتصفح باستخدامها أو اكتب الكود يدويًا.</p>`;
  }
}

async function doCheckin(raw) {
  const box = $("#result");
  if (!box) return;
  const m = findMember(raw);
  if (!m) {
    box.innerHTML = `<div class="result bad"><div class="rt">${ico("xCircle", "sm")} غير موجود</div><div>لا يوجد عضو بهذا الكود أو الرقم.</div></div>`;
    return;
  }
  const st = calcMemberState(m);
  const waBtn = m.phone ? `<a class="btn ghost sm" target="_blank" rel="noopener" href="${esc(waRawLink(m.phone, reminderText(m)))}">${ico("phone", "sm")} واتساب</a>` : "";
  if (st.key === "expired" || st.key === "none") {
    box.innerHTML = `<div class="result bad">
      <div class="rt">${ico("xCircle", "sm")} الدخول ممنوع — ${st.key === "none" ? "لا يوجد اشتراك" : "الاشتراك منتهي"}</div>
      <div class="rn">${esc(m.name)}</div><div>${esc(fmtLeftText(st))}</div>
      <div class="acts"><button class="btn sm" id="goRenew">${ico("refresh", "sm")} تجديد الاشتراك</button>${waBtn}</div></div>`;
    $("#goRenew").addEventListener("click", () => nav("members", { type: "renew", id: m.id }));
    return;
  }
  try {
    const aRef = ref("attendance", `${todayStr()}_${m.id}`);
    const exists = await getDoc(aRef);
    if (exists.exists()) {
      const at = toDate(exists.data().ts);
      box.innerHTML = `<div class="result warn"><div class="rt">${ico("alert", "sm")} سُجّل حضوره اليوم بالفعل${at ? " الساعة " + fmtTime(at) : ""}</div>
        <div class="rn">${esc(m.name)}</div></div>`;
      return;
    }
    await setDoc(aRef, {
      memberId: m.id, memberName: m.name, code: m.code, date: todayStr(),
      ts: serverTimestamp(), by: G.uid
    });
    const dueLine = Number(m.balance) > 0 ? `<div class="due">عليه مبلغ متبقي ${money(m.balance)}</div>` : "";
    box.innerHTML = `<div class="result ok"><div class="rt">${ico("checkCircle", "sm")} تم تسجيل الحضور</div>
      <div class="rn">${esc(m.name)}</div><div>${esc(fmtLeftText(st))}</div>${dueLine}
      ${st.key === "soon" ? `<div class="acts">${waBtn}</div>` : ""}</div>`;
    loadToday(RT);
  } catch (e) {
    box.innerHTML = `<p class="msg err">${esc(errText(e))}</p>`;
  }
}

async function loadToday(tok) {
  const list = $("#todayList");
  if (!list) return;
  try {
    const snap = await getDocs(query(col("attendance"), where("date", "==", todayStr())));
    if (tok !== RT) return;
    const rows = snap.docs.map(d => d.data()).sort((a, b) => (toDate(b.ts)?.getTime() || 0) - (toDate(a.ts)?.getTime() || 0));
    list.innerHTML = rows.length
      ? rows.map(r => `<div class="row"><div class="name">${esc(r.memberName)}</div><div class="meta">كود ${esc(r.code)} · ${fmtTime(toDate(r.ts))}</div></div>`).join("")
      : `<div class="empty">لم يسجل أحد حضوره اليوم.</div>`;
  } catch (e) {
    if (tok === RT) list.innerHTML = `<div class="empty">${esc(errText(e))}</div>`;
  }
}

      if (ex) {

      } else {

    }));

      const p = PRODUCTS.find(x => x.id === b.dataset.inc);
      const item = S.cart.find(c => c.id === b.dataset.inc);
      if (item && p && item.qty < Number(p.stock)) { item.qty++; screenStore(main); }
      else toast("وصلت للحد الأقصى المتاح بالمخزون.");
    }));

    $$("[data-dec]", body).forEach(b => b.addEventListener("click", () => {
      const idx = S.cart.findIndex(c => c.id === b.dataset.dec);
      if (idx > -1) {
        S.cart[idx].qty--;
        if (S.cart[idx].qty <= 0) S.cart.splice(idx, 1);

      modeSel.addEventListener("change", () => {

      try {
        const batch = writeBatch(db);
        for (const item of S.cart) {
          batch.update(ref("products", item.id), { stock: increment(-item.qty) });

        batch.set(doc(col("store_sales")), {
          items: S.cart, total, mode,

        for (const item of S.cart) {
          const p = PRODUCTS.find(x => x.id === item.id);
          if (p) p.stock = Math.max(0, (Number(p.stock) || 0) - item.qty);

        S.cart = [];

        screenStore(main);
      } catch (e) {
        chkBtn.disabled = false; chkBtn.innerHTML = `${ico("check")} إتمام عملية البيع`;
        toast(errText(e));
      }

    <div class="field">
      <label for="prCat">القسم</label>
      <select id="prCat">
        <option value="cafe" ${editing?.category === "cafe" ? "selected" : ""}>الكافتيريا والمشروبات</option>
        <option value="gym" ${editing?.category === "gym" ? "selected" : ""}>منتجات ومكملات الجيم</option>
      </select>

    <div class="two">
      <div class="field">

        <div class="meta">السعر: <b>${money(p.price)}</b> · المتاح بالمخزون: <b>${p.stock ?? 0}</b></div>
        <div class="acts">
          <button class="btn ghost sm" data-editpr="${esc(p.id)}">${ico("edit", "sm")} تعديل</button>
          <button class="btn danger sm" data-delpr="${esc(p.id)}">${ico("trash", "sm")} حذف</button>

  const prCancel = $("#prCancel", body);
  if (prCancel) prCancel.addEventListener("click", () => { S.editProd = null; screenStore(main); });

  $$("[data-editpr]", body).forEach(b => b.addEventListener("click", () => {

    screenStore(main);
    window.scrollTo({ top: 0, behavior: "smooth" });

async function screenMoney(main, tok) {

  let pay, exp;
  try {
    [pay, exp] = await Promise.all([
      getDocs(query(col("payments"), where("date", ">=", monthStart()), where("date", "<=", monthEnd()))),
      getDocs(query(col("expenses"), where("date", ">=", monthStart()), where("date", "<=", monthEnd())))
    ]);
  } catch (e) {
    if (tok !== RT) return;
    main.innerHTML = `<p class="msg err">${ico("alert", "sm")} ${esc(errText(e))}</p>`;
    return;
  }
  if (tok !== RT) return;
  const byNewest = (a, b) => String(b.date).localeCompare(String(a.date)) || ((toDate(b.ts)?.getTime() || 0) - (toDate(a.ts)?.getTime() || 0));
  const payments = pay.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNewest);
  const expenses = exp.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNewest);

  main.innerHTML = `

  </div>
  <div class="panel">
    <div class="stat"><span>${ico("trendingUp", "sm")} إجمالي الإيرادات</span><b>${money(rev)}</b></div>
    <div class="stat"><span>${ico("users", "sm")} إيراد الاشتراكات</span><b>${money(subRev)}</b></div>

    const ctx2 = $("#sourceChart")?.getContext("2d");

        data: {
          labels: ["اشتراكات الجيم", "الستور والكافتيريا"],
          datasets: [{
            data: [subRev || 0, storeRev || 0],
            backgroundColor: ["#EA580C", "#FDBA74"],
            borderWidth: 0
          }]

        options: {
          responsive: true, maintainAspectRatio: false, cutout: "65%",
          plugins: { legend: { position: "bottom", labels: { color: textColor, font: { family: "IBM Plex Sans Arabic" } } } }
        }
      }));
    }
  }

  $("#xform").addEventListener("submit", async ev => {
    ev.preventDefault();
    const title = $("#xt").value.trim(), amount = num($("#xa").value), date = $("#xd").value;
    if (!title || amount <= 0 || !date) return toast("أكمل البند والمبلغ والتاريخ.");
    const btn = $("#xsave"); btn.disabled = true;
    try {
      await addDoc(col("expenses"), { title, amount, date, ts: serverTimestamp(), by: G.uid });

    try { await deleteDoc(ref("expenses", b.dataset.delx)); renderOwner(); }
    catch (e) { toast(errText(e)); }
  }));
}

function setFormMsg(text, kind = "err") {
  const box = $("#formMsg");
  box.innerHTML = text ? `<p class="msg ${kind}" role="${kind === "err" ? "alert" : "status"}">${ico(kind === "err" ? "alert" : "checkCircle", "sm")} ${esc(text)}</p>` : "";

async function onCreateGym(ev) {
  ev.preventDefault();
  const gName = $("#gName").value.trim();
  const oName = $("#oName").value.trim();
  const oEmail = $("#oEmail").value.trim().toLowerCase();
  const oPass = $("#oPass").value;
  const plan = $("#gPlan").value;
  const months = Math.max(1, Math.min(36, parseInt($("#gMonths").value, 10) || 1));

  if (!gName || !oName || !oEmail || !oPass) return setFormMsg("أكمل كل الخانات.");
  if (!isValidEmail(oEmail)) return setFormMsg("اكتب إيميلًا صحيحًا للمدير (مثال: name@domain.com).");
  if (oPass.length < 6) return setFormMsg("كلمة المرور لازم تكون 6 أحرف أو أرقام على الأقل.");

  const btn = $("#gymBtn");
  btn.disabled = true; btn.textContent = "جاري الإنشاء…";
  setFormMsg("");

  let uid = null;
  try {
    const cred = await createUserWithEmailAndPassword(auth2, oEmail, oPass);
    uid = cred.user.uid;
    await signOut(auth2);

    const gymRef = doc(collection(db, "gyms"));
    await setDoc(doc(db, "users", uid), {
      name: oName, email: oEmail, role: "owner", active: true, gymId: gymRef.id,
      createdAt: serverTimestamp()
    });
    await setDoc(gymRef, {
      name: gName, plan, status: "active",
      ownerUid: uid, ownerName: oName, ownerEmail: oEmail,
      subscriptionEnd: Timestamp.fromDate(new Date(Date.now() + months * 30 * DAY)),
      createdAt: serverTimestamp()
    });

    $("#gymForm").reset();
    $("#gMonths").value = 1;
    setFormMsg(`تم إنشاء «${gName}» وتفعيل حساب المدير (${oEmail}).`, "ok");
    loadGyms();
  } catch (e) {
    let t = errText(e);
    if (uid) t += " تم إنشاء حساب المدير لكن لم يكتمل ربطه بالجيم.";
    setFormMsg(t);
  } finally {
    btn.disabled = false; btn.innerHTML = `${ico("check")} إنشاء الجيم`;
  }
}

async function loadGyms() {
  const box = $("#gymList");
  if (!box) return;
  try {
    const [snap, usersSnap] = await Promise.all([
      getDocs(collection(db, "gyms")),
      getDocs(collection(db, "users"))
    ]);
    const usersMap = new Map();
    usersSnap.docs.forEach(d => usersMap.set(d.id, d.data()));

    const gyms = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    gyms.sort((a, b) => (toDate(b.createdAt)?.getTime() || 0) - (toDate(a.createdAt)?.getTime() || 0));

    if (!gyms.length) {
      box.innerHTML = `<div class="rows"><div class="empty">لا توجد جيمات بعد. أضف أول جيم من النموذج أعلاه.</div></div>`;
      return;
    }

    box.innerHTML = `<div class="rows">${gyms.map(g => {
      const end = toDate(g.subscriptionEnd);
      const expired = end && end.getTime() < Date.now();
      const status = g.status === "suspended" ? "suspended" : (expired ? "expired" : "active");
      const label = { active: "الجيم نشط", suspended: "الجيم موقوف", expired: "منتهي" }[status];
      const mgr = g.ownerUid ? usersMap.get(g.ownerUid) : null;
      const mgrActive = mgr ? mgr.active !== false : true;
      const emailValid = isValidEmail(g.ownerEmail || mgr?.email);

      return `
      <div class="row" data-id="${esc(g.id)}" data-uid="${esc(g.ownerUid || "")}">
        <div class="name">
          ${esc(g.name || g.id)}
          <span class="tag ${status}">${label}</span>
          <span class="tag ${mgrActive ? "active" : "suspended"}">${mgrActive ? "المدير نشط" : "المدير موقوف"}</span>
        </div>
        <div class="meta">${esc(PLANS_LABEL[g.plan] || g.plan || "—")} · ينتهي ${fmtDate(end)}</div>
        <div class="meta">المدير: <b>${esc(g.ownerName || mgr?.name || "—")}</b> · الإيميل: <b>${esc(g.ownerEmail || mgr?.email || "—")}</b> <span class="tag ${emailValid ? "active" : "suspended"}">${emailValid ? "إيميل صحيح" : "إيميل غير صحيح"}</span></div>
        <div class="acts">
          <button class="btn ghost sm" data-act="extend">${ico("refresh", "sm")} تمديد 30 يوم</button>
          <button class="btn ghost sm" data-act="toggleGym">${g.status === "suspended" ? "تفعيل الجيم" : "إيقاف الجيم"}</button>
          ${g.ownerUid ? `<button class="btn soft sm" data-act="toggleMgr">${mgrActive ? "إيقاف حساب المدير" : "تنشيط حساب المدير"}</button>` : ""}
        </div>
      </div>`;
    }).join("")}</div>`;

    $$("button[data-act]", box).forEach(b => {
      b.addEventListener("click", async () => {
        const row = b.closest(".row");
        const id = row.dataset.id;
        const uid = row.dataset.uid;
        const g = gyms.find(x => x.id === id);
        b.disabled = true;
        try {
          if (b.dataset.act === "toggleGym") {
            await updateDoc(doc(db, "gyms", id), { status: g.status === "suspended" ? "active" : "suspended" });
          } else if (b.dataset.act === "toggleMgr" && uid) {
            const curMgr = usersMap.get(uid);
            const nextActive = curMgr ? curMgr.active === false : false;
            await updateDoc(doc(db, "users", uid), { active: nextActive });
          } else {
            const cur = toDate(g.subscriptionEnd);
            const base = cur && cur.getTime() > Date.now() ? cur.getTime() : Date.now();
            await updateDoc(doc(db, "gyms", id), { subscriptionEnd: Timestamp.fromDate(new Date(base + 30 * DAY)) });
          }
          loadGyms();
        } catch (e) {
          b.disabled = false;
          setFormMsg(errText(e));
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });
    });
  } catch (e) {
    box.innerHTML = `<div class="rows"><div class="empty">${esc(errText(e))}</div></div>`;
  }
}

/* ---------- Session routing ---------- */
onAuthStateChanged(auth, async user => {
  stopScanner();
  destroyCharts();
  if (!user) {
    G = null;
    if (loginMode === "member") return;
    return viewLogin();
  }
  root.innerHTML = `<div class="loading">جاري التحميل…</div>`;
  try {
    const uSnap = await withTimeout(getDoc(doc(db, "users", user.uid)));
    if (!uSnap.exists()) {
      return viewBlocked("الحساب غير مربوط", "هذا الحساب غير مربوط بأي جيم. تواصل مع إدارة GymPro.");
    }
    const profile = uSnap.data();
    if (profile.active !== true) {
      return viewBlocked("الحساب موقوف", "تم إيقاف هذا الحساب. تواصل مع إدارة GymPro.");
    }
    if (profile.role === "superadmin") return viewAdmin(profile);

    const gSnap = await withTimeout(getDoc(doc(db, "gyms", profile.gymId)));
    if (!gSnap.exists()) {
      return viewBlocked("الجيم غير موجود", "لم نجد بيانات الجيم المرتبط بحسابك.");
    }
    const gym = gSnap.data();
    const end = toDate(gym.subscriptionEnd);
    if (gym.status === "suspended") {
      return viewBlocked("الجيم موقوف", "تم إيقاف اشتراك هذا الجيم. تواصل مع إدارة GymPro.");
    }
    if (end && end.getTime() < Date.now()) {
      return viewBlocked("انتهى اشتراك الجيم", "انتهى اشتراك الجيم في GymPro. جدّد الاشتراك للاستمرار.");
    }
    await startOwner(user.uid, profile, gym, profile.gymId);
  } catch (e) {
    viewBlocked("تعذر تحميل الحساب", errText(e), true);
  }
});
</script>
