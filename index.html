   SUPER ADMIN  (platform owner: sees every gym, can enter any gym in support mode)
   ===================================================================== */
function viewAdmin(profile) {
  root.innerHTML = `
  <div class="wrap wide">
    <div class="top">
      <div class="who"><h1>لوحة الإدارة</h1><div class="sub">${esc(profile.name || "")} · مسؤول النظام</div></div>
      <button class="btn ghost" id="outBtn">${ico("logout", "sm")} خروج</button>
    </div>

    <div id="adminCred"></div>
    <div class="kpi-grid four" id="adminKpis"></div>

    <h2>${ico("building")} الجيمات المشتركة ومديروها</h2>
    <div id="gymList"><div class="rows"><div class="empty">جاري التحميل…</div></div></div>

    <h2>${ico("plus")} إضافة جيم ومدير</h2>
    <div id="formMsg"></div>
    <form class="panel" id="gymForm" novalidate>
      <div class="grid2">
        <div class="field"><label for="gName">اسم الجيم</label><input id="gName" maxlength="100" required autocomplete="off"></div>
        <div class="field"><label for="oName">اسم المدير</label><input id="oName" maxlength="100" required autocomplete="off"></div>
        <div class="field"><label for="oEmail">إيميل المدير</label><input id="oEmail" type="email" dir="ltr" inputmode="email" required autocomplete="off" placeholder="manager@gym.com"></div>
        <div class="field"><label for="oPass">كلمة مرور المدير</label>
          <div class="pwrow"><input id="oPass" type="text" dir="ltr" required autocomplete="off" maxlength="64" value="${esc(genPassword())}"><button type="button" class="btn soft sm" id="oGen">${ico("refresh", "sm")} توليد</button></div></div>
        <div class="field"><label for="gLogo">${ico("image", "sm")} شعار الجيم (رابط https)</label><input id="gLogo" dir="ltr" placeholder="https://..."></div>
        <div class="field"><label for="gPlan">الباقة</label>
          <select id="gPlan"><option value="basic">أساسية</option><option value="pro">متقدمة</option><option value="premium">خاصة</option></select></div>
        <div class="field"><label for="gMonths">مدة الاشتراك بالأشهر</label><input id="gMonths" type="number" min="1" max="36" value="1" inputmode="numeric" dir="ltr"></div>
      </div>
      <button class="btn" type="submit" id="gymBtn">${ico("check")} إنشاء الجيم</button>
    </form>
  </div>`;

  $("#outBtn").addEventListener("click", () => doSignOut());
  wireGen("#oPass", "#oGen");
  $("#gymForm").addEventListener("submit", onCreateGym);
  loadGyms();
}

function setFormMsg(text, kind = "err", extraHtml = "") {
  const box = $("#formMsg");
  box.innerHTML = text ? `<p class="msg ${kind}" role="${kind === "err" ? "alert" : "status"}">${ico(kind === "err" ? "alert" : "checkCircle", "sm")} ${esc(text)}</p>${extraHtml}` : "";
}
function showAdminCred(c) {
  const box = $("#adminCred");
  if (!box) return;
  box.innerHTML = credHtml(c);
  wireCred(box, c);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function onCreateGym(ev) {
  ev.preventDefault();
  const gName = $("#gName").value.trim(), oName = $("#oName").value.trim();
  const oEmail = $("#oEmail").value.trim().toLowerCase(), oPass = $("#oPass").value.trim();
  const logoUrl = safeHttps($("#gLogo").value), plan = $("#gPlan").value;
  const months = Math.max(1, Math.min(36, parseInt($("#gMonths").value, 10) || 1));

  if (!gName || !oName || !oEmail || !oPass) return setFormMsg("أكمل كل الخانات.");
  if (!isValidEmail(oEmail)) return setFormMsg("اكتب إيميلًا صحيحًا للمدير.");
  const pe = pwError(oPass); if (pe) return setFormMsg(pe);

  const btn = $("#gymBtn"); btn.disabled = true; btn.textContent = "جاري الإنشاء…";
  setFormMsg("");
  let uid = null;
  try {
    uid = await createAuthUser(oEmail, oPass);
    const gymRef = doc(collection(db, "gyms"));
    await setDoc(doc(db, "users", uid), {
      name: oName, email: oEmail, role: "owner", active: true, gymId: gymRef.id, gymName: gName,
      createdAt: serverTimestamp()
    });
    await setDoc(gymRef, {
      name: gName, logoUrl, plan, status: "active",
      ownerUid: uid, ownerName: oName, ownerEmail: oEmail,
      subscriptionEnd: Timestamp.fromDate(new Date(Date.now() + months * 30 * DAY)),
      createdAt: serverTimestamp()
    });
    await setDoc(doc(db, "gyms", gymRef.id, "meta", "public"), { name: gName, logoUrl }, { merge: true });

    const c = {
      title: `بيانات دخول مدير «${gName}»`, phone: "",
      rows: [["الرابط", appLink()], ["الإيميل", oEmail], ["كلمة المرور", oPass]],
      text: `أهلًا ${oName}، بيانات دخولك لنظام GymPro:\nالرابط: ${appLink()}\nالإيميل: ${oEmail}\nكلمة المرور: ${oPass}\nنوصيك بتغيير كلمة المرور بعد أول دخول.`
    };
    $("#gymForm").reset();
    $("#gMonths").value = 1; $("#oPass").value = genPassword();
    setFormMsg(`تم إنشاء «${gName}» بنجاح.`, "ok");
    showAdminCred(c);
    loadGyms();
  } catch (e) {
    let t = errText(e);
    if (uid) t += " تم إنشاء حساب المدير لكن لم يكتمل ربطه بالجيم.";
    setFormMsg(t);
  } finally {
    btn.disabled = false; btn.innerHTML = `${ico("check")} إنشاء الجيم`;
  }
}

async function enterGymSupport(gymId) {
  if (!SUPER) return;
  root.innerHTML = `<div class="loading">جاري فتح الجيم…</div>`;
  try {
    const gSnap = await withTimeout(getDoc(doc(db, "gyms", gymId)));
    if (!gSnap.exists()) throw { code: "not-found", message: "الجيم غير موجود." };
    await startStaff(SUPER.uid, { name: SUPER.profile.name || "مسؤول النظام", role: "owner", active: true }, gSnap.data(), gymId, true);
  } catch (e) {
    toast(errText(e));
    viewAdmin(SUPER.profile);
  }
}

async function loadGyms() {
  const box = $("#gymList");
  if (!box) return;
  let gyms = [];
  try {
    const snap = await getDocs(collection(db, "gyms"));
    gyms = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) {
    box.innerHTML = `<div class="rows"><div class="empty">${esc(errText(e))}<br>تأكد من نشر قواعد الأمان الجديدة.</div></div>`;
    return;
  }
  gyms.sort((a, b) => (toDate(b.createdAt)?.getTime() || 0) - (toDate(a.createdAt)?.getTime() || 0));
  if (!gyms.length) {
    $("#adminKpis").innerHTML = "";
    box.innerHTML = `<div class="rows"><div class="empty">لا توجد جيمات بعد. أضف أول جيم من النموذج بالأسفل.</div></div>`;
    return;
  }

  const usersMap = new Map();
  try {
    const us = await getDocs(query(collection(db, "users"), where("role", "==", "owner")));
    us.docs.forEach(d => usersMap.set(d.id, d.data()));
  } catch {}
  const counts = await Promise.all(gyms.map(async g => {
    try { return (await getCountFromServer(collection(db, "gyms", g.id, "members"))).data().count; }
    catch { return null; }
  }));

  const statusOf = g => {
    const end = toDate(g.subscriptionEnd);
    if (g.status === "cancelled") return "cancelled";
    if (g.status === "suspended") return "suspended";
    return end && end.getTime() < Date.now() ? "expired" : "active";
  };
  const activeN = gyms.filter(g => statusOf(g) === "active").length;
  const totalMembers = counts.reduce((a, c) => a + (c || 0), 0);
  $("#adminKpis").innerHTML = `
    <div class="kpi accent"><div class="kl">${ico("building", "sm")} عدد الجيمات</div><div class="kv">${gyms.length}</div></div>
    <div class="kpi"><div class="kl">${ico("checkCircle", "sm")} جيمات نشطة</div><div class="kv">${activeN}</div></div>
    <div class="kpi"><div class="kl">${ico("xCircle", "sm")} موقوفة / منتهية</div><div class="kv">${gyms.length - activeN}</div></div>
    <div class="kpi"><div class="kl">${ico("users", "sm")} إجمالي الأعضاء</div><div class="kv">${totalMembers}</div></div>`;

  box.innerHTML = `<div class="gym-grid">${gyms.map((g, i) => {
    const end = toDate(g.subscriptionEnd);
    const status = statusOf(g);
    const label = { active: "نشط", suspended: "موقوف", cancelled: "ملغي", expired: "منتهي" }[status];
    const tagCls = status === "active" ? "active" : (status === "expired" ? "expired" : "suspended");
    const mgr = g.ownerUid ? usersMap.get(g.ownerUid) : null;
    const mgrActive = mgr ? mgr.active !== false : true;
    const blocked = status !== "active";
    return `
    <div class="panel gym-card" data-id="${esc(g.id)}" data-uid="${esc(g.ownerUid || "")}">
      <div class="name">${gymLogoHtml(g, "mini-logo")}<span>${esc(g.name || g.id)}</span>
        <span class="tag ${tagCls}">${label}</span>
        <span class="tag ${mgrActive ? "active" : "suspended"}">${mgrActive ? "المدير نشط" : "المدير موقوف"}</span></div>
      <div class="stat"><span>مدير الجيم</span><b>${esc(g.ownerName || mgr?.name || "—")}</b></div>
      <div class="stat"><span>إيميل المدير</span><b class="mono">${esc(g.ownerEmail || mgr?.email || "—")}</b></div>
      <div class="stat"><span>عدد الأعضاء</span><b>${counts[i] ?? "—"}</b></div>
      <div class="stat"><span>الباقة</span><b>${esc(PLANS_LABEL[g.plan] || g.plan || "—")}</b></div>
      <div class="stat"><span>ينتهي الاشتراك</span><b>${esc(fmtDate(end))}</b></div>
      <div class="acts">
        <button class="btn sm" data-act="enter">${ico("arrowRight", "sm")} دخول للجيم (وضع الدعم)</button>
        <button class="btn ghost sm" data-act="extend">${ico("refresh", "sm")} تمديد 30 يوم</button>
        ${blocked ? `<button class="btn soft sm" data-act="activate">${ico("checkCircle", "sm")} تفعيل الجيم</button>`
                  : `<button class="btn ghost sm" data-act="suspend">إيقاف مؤقت</button>
                     <button class="btn danger sm" data-act="cancel">إلغاء الاشتراك</button>`}
      </div>
      <div class="acts">
        <button class="btn ghost sm" data-act="edit">${ico("edit", "sm")} تعديل بيانات الجيم والمدير</button>
        ${g.ownerUid ? `<button class="btn ghost sm" data-act="toggleMgr">${mgrActive ? "إيقاف المدير" : "تنشيط المدير"}</button>` : ""}
        ${g.ownerEmail ? `<button class="btn ghost sm" data-act="resetMgr">${ico("lock", "sm")} رابط كلمة المرور للمدير</button>` : ""}
        <button class="btn ghost sm" data-act="copyLink">${ico("copy", "sm")} رابط دخول الأعضاء</button>
      </div>
      <div data-editbox></div>
    </div>`;
  }).join("")}</div>`;

  $$("button[data-act]", box).forEach(b => b.addEventListener("click", async () => {
    const card = b.closest(".gym-card"), id = card.dataset.id, uid = card.dataset.uid;
    const g = gyms.find(x => x.id === id);
    const act = b.dataset.act;
    if (act === "enter") return enterGymSupport(id);
    if (act === "copyLink") return copyText(`${appLink()}?g=${encodeURIComponent(id)}`);
    if (act === "edit") return openGymEditor(card, g, uid);
    if (act === "cancel" && !confirm(`إلغاء اشتراك «${g.name}»؟ سيتوقف دخول كل مستخدميه فورًا. يمكنك تفعيله لاحقًا.`)) return;
    b.disabled = true;
    try {
      if (act === "suspend") await updateDoc(doc(db, "gyms", id), { status: "suspended" });
      else if (act === "activate") await updateDoc(doc(db, "gyms", id), { status: "active" });
      else if (act === "cancel") await updateDoc(doc(db, "gyms", id), { status: "cancelled", subscriptionEnd: Timestamp.now() });
      else if (act === "toggleMgr" && uid) {
        const cur = usersMap.get(uid);
        await updateDoc(doc(db, "users", uid), { active: cur ? cur.active === false : false });
      } else if (act === "resetMgr") {
        await sendPasswordResetEmail(auth, g.ownerEmail);
        toast("تم إرسال رابط تغيير كلمة المرور لإيميل المدير");
        b.disabled = false; return;
      } else if (act === "extend") {
        const cur = toDate(g.subscriptionEnd);
        const base = cur && cur.getTime() > Date.now() ? cur.getTime() : Date.now();
        await updateDoc(doc(db, "gyms", id), { subscriptionEnd: Timestamp.fromDate(new Date(base + 30 * DAY)) });
      }
      loadGyms();
    } catch (e) { b.disabled = false; toast(errText(e)); }
  }));
}

function openGymEditor(card, g, oldUid) {
  const box = $("[data-editbox]", card);
  box.innerHTML = `
  <form class="panel" style="margin-top:12px" novalidate>
    <div style="font-weight:700;margin-bottom:8px">تعديل بيانات الجيم والمدير</div>
    <div class="field"><label>اسم الجيم</label><input data-f="gname" maxlength="100" value="${esc(g.name || "")}"></div>
    <div class="field"><label>اسم المدير</label><input data-f="oname" maxlength="100" value="${esc(g.ownerName || "")}"></div>
    <div class="field"><label>إيميل جديد للمدير (اتركه فارغًا بدون تغيير)</label><input data-f="email" type="email" dir="ltr" autocomplete="off" placeholder="new@email.com"></div>
    <div class="field"><label>كلمة مرور جديدة (مطلوبة مع الإيميل الجديد)</label>
      <div class="pwrow"><input data-f="pass" type="text" dir="ltr" maxlength="64" value="${esc(genPassword())}"><button type="button" class="btn soft sm" data-f="gen">${ico("refresh", "sm")} توليد</button></div></div>
    <div class="hint">تغيير الإيميل ينشئ حساب دخول جديد للمدير ويوقف القديم. أما تغيير كلمة المرور لنفس الإيميل فمن زر «رابط كلمة المرور للمدير».</div>
    <button class="btn" type="submit" style="margin-top:10px">${ico("check")} حفظ</button>
  </form>`;
  const f = n => $(`[data-f="${n}"]`, box);
  f("gen").addEventListener("click", () => { f("pass").value = genPassword(); });
  $("form", box).addEventListener("submit", async ev => {
    ev.preventDefault();
    const gname = f("gname").value.trim(), oname = f("oname").value.trim();
    const email = f("email").value.trim().toLowerCase(), pass = f("pass").value.trim();
    if (!gname || !oname) return toast("اكتب اسم الجيم واسم المدير.");
    if (email) {
      if (!isValidEmail(email)) return toast("صيغة الإيميل غير صحيحة.");
      const pe = pwError(pass); if (pe) return toast(pe);
    }
    const btn = $("button[type=submit], form > button.btn", box); if (btn) btn.disabled = true;
    try {
      const batch = writeBatch(db);
      if (email) {
        const uid2 = await createAuthUser(email, pass);
        batch.set(doc(db, "users", uid2), { name: oname, email, role: "owner", active: true, gymId: g.id, gymName: gname, createdAt: serverTimestamp() });
        batch.update(doc(db, "gyms", g.id), { name: gname, ownerName: oname, ownerUid: uid2, ownerEmail: email });
        if (oldUid) batch.update(doc(db, "users", oldUid), { active: false });
      } else {
        batch.update(doc(db, "gyms", g.id), { name: gname, ownerName: oname });
        if (oldUid) batch.update(doc(db, "users", oldUid), { name: oname, gymName: gname });
      }
      batch.set(doc(db, "gyms", g.id, "meta", "public"), { name: gname }, { merge: true });
      await batch.commit();
      if (email) {
        showAdminCred({
          title: `بيانات دخول مدير «${gname}» الجديدة`, phone: "",
          rows: [["الرابط", appLink()], ["الإيميل", email], ["كلمة المرور", pass]],
          text: `أهلًا ${oname}، بيانات دخولك الجديدة لنظام GymPro:\nالرابط: ${appLink()}\nالإيميل: ${email}\nكلمة المرور: ${pass}\nنوصيك بتغيير كلمة المرور بعد أول دخول.`
        });
      } else toast("تم الحفظ");
      loadGyms();
    } catch (e) { if (btn) btn.disabled = false; toast(errText(e)); }
  });
}

/* ---------- Session routing ---------- */
onAuthStateChanged(auth, async user => {
  stopScanner(); destroyCharts(); stopIdle();
  if (!user) { G = null; SUPER = null; return viewLogin(); }
  root.innerHTML = `<div class="loading">جاري التحميل…</div>`;
  try {
    const uSnap = await withTimeout(getDoc(doc(db, "users", user.uid)));
    if (!uSnap.exists()) return viewBlocked("الحساب غير مضاف", "هذا الإيميل غير مضاف في أي جيم. اطلب من مدير الجيم إضافتك بنفس الإيميل، أو سجّل الخروج.");
    const profile = uSnap.data();
    if (profile.active !== true) return viewBlocked("الحساب موقوف", "تم إيقاف هذا الحساب. تواصل مع إدارة الجيم.");
    startIdle();
    if (profile.role === "superadmin") { SUPER = { uid: user.uid, profile }; return viewAdmin(profile); }
    if (profile.role === "member") return await startMember(user.uid, profile);
    if (!["owner", "accountant", "reception", "captain", "employee"].includes(profile.role)) {
      return viewBlocked("صلاحية غير معروفة", "تواصل مع الإدارة.");
    }

    const gSnap = await withTimeout(getDoc(doc(db, "gyms", profile.gymId)));
    if (!gSnap.exists()) return viewBlocked("الجيم غير موجود", "لم نجد بيانات الجيم المرتبط بحسابك.");
    const gym = gSnap.data();
    const end = toDate(gym.subscriptionEnd);
    if (gym.status === "cancelled") return viewBlocked("تم إلغاء الاشتراك", "تم إلغاء اشتراك هذا الجيم في GymPro. تواصل مع الإدارة لإعادة التفعيل.");
    if (gym.status === "suspended") return viewBlocked("الجيم موقوف", "تم إيقاف اشتراك هذا الجيم مؤقتًا. تواصل مع إدارة GymPro.");
    if (end && end.getTime() < Date.now()) return viewBlocked("انتهى اشتراك الجيم", "انتهى اشتراك الجيم. جدّد الاشتراك للاستمرار.");
    if (profile.role === "captain" || profile.role === "employee") return await startEmployee(user.uid, profile, gym);
    await startStaff(user.uid, profile, gym, profile.gymId);
  } catch (e) {
    viewBlocked("تعذر تحميل الحساب", errText(e), true);
  }
});
</script>
