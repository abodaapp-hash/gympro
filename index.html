<style>
  :root {
    color-scheme: light dark;
    --bg: #F8FAFC;
    --surface: #FFFFFF;
    --ink: #0F172A;
    --muted: #64748B;
    --line: #E2E8F0;
    --brand: #EA580C;
    --brand-hover: #C2410C;
    --brand-soft: #FFF7ED;
    --brand-border: #FDBA74;
    --brand-ink: #FFFFFF;
    --warn: #B45309;
    --danger: #DC2626;
    --ok: #15803D;
    --ok-bg: #F0FDF4;
    --bad-bg: #FEF2F2;
    --warn-bg: #FFFBEB;
    --shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B0F17;
      --surface: #131A26;
      --ink: #F1F5F9;
      --muted: #94A3B8;
      --line: #1E293B;
      --brand: #F97316;
      --brand-hover: #FB923C;
      --brand-soft: #271509;
      --brand-border: #7C2D12;
      --brand-ink: #FFFFFF;
      --warn: #FBBF24;
      --danger: #F87171;
      --ok: #4ADE80;
      --ok-bg: #0B2616;
      --bad-bg: #2C1215;
      --warn-bg: #291E09;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    font-size: 16px;
    line-height: 1.65;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 52px; }
  .wrap.wide { max-width: 840px; }
  .muted { color: var(--muted); }

  .ico { width: 19px; height: 19px; flex: none; vertical-align: middle; }
  .ico.sm { width: 15px; height: 15px; }

  .login { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
  .mark { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .mark .logo-badge {
    width: 54px; height: 54px; border-radius: 16px;
    background: linear-gradient(135deg, #EA580C, #F97316);
    color: #fff; display: grid; place-items: center;
    box-shadow: 0 8px 20px rgba(234, 88, 12, 0.28);
  }
  .mark svg { width: 32px; height: auto; }
  .mark b { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; line-height: 1; }
  .mark b span { color: var(--brand); }
  .login p.lead { margin: 0 0 16px; color: var(--muted); font-size: 14.5px; }

  .panel {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 18px; box-shadow: var(--shadow);
  }

  label { display: block; font-weight: 600; font-size: 14px; margin: 0 0 6px; }
  .field { margin-bottom: 14px; }
  input, select, textarea {
    width: 100%; min-height: 46px; padding: 10px 14px;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px;
    font: inherit; font-size: 15px; transition: border-color .15s;
  }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: var(--brand); }
  input[dir="ltr"] { text-align: left; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible {
    outline: 3px solid var(--brand); outline-offset: 2px;
  }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

  button { font: inherit; cursor: pointer; transition: all .15s; }
  .btn {
    width: 100%; min-height: 48px; border: 0; border-radius: 12px;
    background: var(--brand); color: var(--brand-ink);
    font-weight: 700; font-size: 15px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 12px rgba(234, 88, 12, 0.2);
  }
  .btn:hover:not([disabled]) { background: var(--brand-hover); }
  .btn[disabled] { opacity: .6; cursor: wait; box-shadow: none; }
  .btn.ghost {
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); font-weight: 600; font-size: 13.5px;
    min-height: 40px; width: auto; padding: 0 13px; box-shadow: none;
  }
  .btn.ghost:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
  .btn.soft {
    background: var(--brand-soft); color: var(--brand);
    border: 1px solid var(--brand-border); font-weight: 600; font-size: 13.5px;
    min-height: 40px; width: auto; padding: 0 13px; box-shadow: none;
  }
  .btn.sm { min-height: 35px; font-size: 12.5px; padding: 0 11px; width: auto; border-radius: 10px; }
  .btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; box-shadow: none; }
  .btn.danger:hover { background: var(--bad-bg); }
  .linkbtn { background: none; border: 0; color: var(--brand); font-weight: 600; padding: 8px 0; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }

  .msg { margin: 0 0 14px; padding: 12px 14px; border-radius: 12px; font-size: 14px; border: 1px solid var(--line); background: var(--bg); display: flex; align-items: center; gap: 8px; }
  .msg.err { color: var(--danger); border-color: var(--danger); background: var(--bad-bg); }
  .msg.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .top .who { min-width: 0; }
  .top h1 { margin: 0; font-size: 20.5px; line-height: 1.3; }
  .top .sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }

  h2 { font-size: 16px; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; color: var(--ink); }
  h2 svg { color: var(--brand); }
  h2:first-child { margin-top: 0; }
  .grid2 { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } }
  .two { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }

  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .kpi.accent {
    background: linear-gradient(135deg, #EA580C, #F97316);
    color: #fff; border: 0;
  }
  .kpi.accent .kl { color: rgba(255,255,255,0.9); }
  .kpi .kl { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .kpi .kv { font-size: 20px; font-weight: 700; line-height: 1.2; }

  /* Telecom-style Meter */
  .meter-box { margin-top: 10px; }
  .meter-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 6px; font-weight: 600; }
  .meter-track {
    width: 100%; height: 12px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 999px; overflow: hidden;
  }
  .meter-fill {
    height: 100%; background: linear-gradient(90deg, #EA580C, #F97316);
    border-radius: 999px; transition: width .35s ease;
  }

  .rows { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
  .row { padding: 13px 16px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .name { font-weight: 700; font-size: 15px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .row .meta { color: var(--muted); font-size: 12.5px; margin-top: 3px; overflow-wrap: anywhere; }
  .row .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .tag.active { color: var(--ok); background: var(--ok-bg); }
  .tag.suspended, .tag.expired { color: var(--danger); background: var(--bad-bg); }
  .tag.soon { color: var(--warn); background: var(--warn-bg); }
  .tag.none { color: var(--muted); }
  .tag.cat { color: var(--brand); background: var(--brand-soft); border-color: var(--brand-border); }
  .empty { padding: 22px 16px; color: var(--muted); text-align: center; font-size: 13.5px; }

  .stat { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .stat:last-child { border-bottom: 0; }
  .stat span:first-child { color: var(--muted); display: inline-flex; align-items: center; gap: 7px; font-size: 14px; }
  .stat b { font-weight: 700; }
  .stat.big b { font-size: 20px; color: var(--brand); }

  .loading { min-height: 100vh; display: grid; place-items: center; color: var(--muted); }

  .shell { min-height: 100vh; padding-bottom: calc(86px + env(safe-area-inset-bottom)); }
  .oh {
    background: var(--surface); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 9;
  }
  .oh .in { max-width: 640px; margin: 0 auto; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .oh .brand-box { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .oh .mini-logo {
    width: 38px; height: 38px; border-radius: 11px;
    background: var(--brand); color: #fff; display: grid; place-items: center; flex: none; overflow: hidden;
  }
  .oh .mini-logo img { width: 100%; height: 100%; object-fit: cover; }
  .oh .gname { font-weight: 700; font-size: 16px; line-height: 1.25; }
  .oh .gsub { color: var(--muted); font-size: 12px; }
  .oh .sub-pill {
    background: var(--brand-soft); color: var(--brand); border: 1px solid var(--brand-border);
    padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
  }

  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; overflow-x: auto; background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
    box-shadow: 0 -2px 12px rgba(0,0,0,0.04);
  }
  .tabs button {
    flex: 1; min-width: 64px; background: none; border: 0; padding: 6px 4px; min-height: 60px;
    color: var(--muted); font-size: 10.5px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    position: relative; white-space: nowrap;
  }
  .tabs button svg { width: 18px; height: 18px; }
  .tabs button[aria-current="page"] { color: var(--brand); }
  .tabs button[aria-current="page"]::before {
    content: ""; position: absolute; top: 0; width: 26px; height: 3px;
    background: var(--brand); border-radius: 0 0 4px 4px;
  }

  .seg {
    display: flex; gap: 6px; background: var(--surface); padding: 5px;
    border-radius: 14px; border: 1px solid var(--line); margin-bottom: 14px;
  }
  .seg button {
    flex: 1; border: 0; background: transparent; color: var(--muted);
    padding: 8px 10px; border-radius: 10px; font-weight: 600; font-size: 13px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;

  .seg button.active { background: var(--brand); color: #fff; box-shadow: 0 2px 8px rgba(234, 88, 12, 0.25); }

  .prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .prod-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px; text-align: start; display: flex; flex-direction: column; justify-content: space-between;

  .prod-card:hover:not([disabled]) { border-color: var(--brand); transform: translateY(-1px); }
  .prod-card[disabled] { opacity: 0.55; cursor: not-allowed; }
  .prod-thumb {
    width: 100%; height: 92px; object-fit: cover; border-radius: 10px;
    background: var(--bg); margin-bottom: 8px; border: 1px solid var(--line);

  .prod-card .pname { font-weight: 700; font-size: 14.5px; margin: 4px 0; }
  .prod-card .pprice { font-weight: 700; color: var(--brand); font-size: 15px; }
  .prod-card .pstock { font-size: 11.5px; color: var(--muted); }

  .cart-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .cart-item:last-child { border-bottom: 0; }
  .qty-ctrl { display: inline-flex; align-items: center; gap: 8px; background: var(--bg); padding: 3px 8px; border-radius: 10px; border: 1px solid var(--line); }
  .qty-ctrl button { background: none; border: 0; color: var(--brand); font-weight: 700; width: 24px; height: 24px; display: grid; place-items: center; }

  .chart-wrap { position: relative; height: 215px; width: 100%; margin-top: 8px; }
  .chart-wrap.sm { height: 180px; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar input { flex: 1; min-width: 170px; }
  .toolbar select { width: auto; max-width: 100%; }
  .mrow { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
  .mrow:last-child { border-bottom: 0; }
  .mmain { flex: 1; min-width: 0; text-align: start; background: none; border: 0; color: inherit; padding: 12px 16px; }
  .mmain .name { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .mmain .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .mrow .side { padding-inline-end: 12px; display: flex; gap: 6px; align-items: center; }
  .due { color: var(--danger); font-weight: 600; }

  .result { border-radius: 16px; padding: 16px; margin: 14px 0; border: 1px solid currentColor; }
  .result.ok { background: var(--ok-bg); color: var(--ok); }
  .result.bad { background: var(--bad-bg); color: var(--danger); }
  .result.warn { background: var(--warn-bg); color: var(--warn); }
  .result .rn { font-size: 20px; font-weight: 700; color: var(--ink); margin: 4px 0; }
  .result .rt { font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .result .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

  #reader { width: 100%; max-width: 360px; margin: 12px auto; border-radius: 14px; overflow: hidden; }
  .qrbox { text-align: center; }
  .qrbox img { width: 200px; height: 200px; background: #fff; border-radius: 12px; padding: 8px; border: 1px solid var(--line); }
  .bigcode { font-size: 30px; font-weight: 700; letter-spacing: 3px; direction: ltr; color: var(--brand); }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(82px + env(safe-area-inset-bottom));
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px; z-index: 50;
    font-size: 13.5px; font-weight: 600; max-width: 90vw; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  .back { margin-bottom: 14px; }
</style>
</head>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const monthStart = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-01`; };
const monthEnd = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-31`; };
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const endOfDay = s => { const d = parseYmd(s); d.setHours(23, 59, 59, 0); return d; };
const plusDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const fmtDate = d => d ? d.toLocaleDateString("ar-EG-u-nu-latn", { year: "numeric", month: "long", day: "numeric" }) : "—";
const fmtTime = d => d ? d.toLocaleTimeString("ar-EG-u-nu-latn", { hour: "2-digit", minute: "2-digit" }) : "";
const fmtDateTime = d => d ? `${fmtDate(d)} · ${fmtTime(d)}` : "لم يسجل بعد";
const toDate = t => {
  if (!t) return null;
  if (typeof t.toDate === "function") return t.toDate();
  if (t instanceof Date) return t;
  const d = new Date(t);
  return isNaN(d.getTime()) ? null : d;
};
const money = n => (Number(n) || 0).toLocaleString("en-US") + " ج";
const sum = (arr, k = "amount") => arr.reduce((a, x) => a + (Number(x[k]) || 0), 0);
const num = v => { const n = parseFloat(String(v).replace(/[^\d.]/g, "")); return isNaN(n) ? 0 : n; };
const isValidEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e || "").trim());

const arabicDigitsToEn = s => String(s || "").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
const normPhone = p => {
  let d = arabicDigitsToEn(p).replace(/\D/g, "");
  if (d.startsWith("00")) d = d.slice(2);
  if (d.startsWith("20") && d.length >= 12) d = d.slice(2);
  if (d.startsWith("0") && d.length >= 11) d = d.slice(1);
  return d.slice(-10);
};

function waPhone(p) {
  let d = arabicDigitsToEn(p).replace(/\D/g, "");
  if (d.startsWith("00")) d = d.slice(2);
  if (d.startsWith("0")) d = "20" + d.slice(1);
  return d;
}
function waRawLink(phone, text) {

}

function calcMemberState(m) {
  const end = toDate(m.endDate);
  if (!end) return { key: "none", label: "بدون اشتراك", left: null, end: null, pct: 0 };
  const left = Math.ceil((end.getTime() - Date.now()) / DAY);
  const start = toDate(m.startDate) || new Date(end.getTime() - (Number(m.planDays) || 30) * DAY);
  const totalSpan = Math.max(DAY, end.getTime() - start.getTime());
  const remSpan = Math.max(0, end.getTime() - Date.now());
  const pct = end.getTime() < Date.now() ? 0 : Math.min(100, Math.max(2, Math.round((remSpan / totalSpan) * 100)));
  if (end.getTime() < Date.now()) return { key: "expired", label: "منتهي", left: 0, end, pct: 0 };
  if (left <= 7) return { key: "soon", label: "ينتهي قريبًا", left, end, pct };
  return { key: "active", label: "نشط", left, end, pct };
}
const fmtLeftText = st => st.end
  ? (st.key === "expired" ? `انتهى ${fmtDate(st.end)}` : (st.left <= 1 ? "ينتهي اليوم" : `متبقي ${st.left} يوم`))
  : "لم يشترك بعد";

function sessionsText(m) {
  const left = Number(m.sessionsLeft);
  if (isNaN(left)) return "غير محدد";
  const total = Number(m.sessionsTotal) || left;
  return `${left} من ${total} تمرينة`;
}

function haversineMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function getCurrentGps() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error("المتصفح لا يدعم تحديد الموقع GPS."));
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, acc: Math.round(pos.coords.accuracy || 0) }),
      () => reject(new Error("تعذر الحصول على موقع GPS. اسمح بصلاحية الموقع من المتصفح.")),
      { enableHighAccuracy: true, timeout: 12000 }
    );
  });
}

function exportRevenueExcel(rows, filename) {
  const headers = ["التاريخ", "النوع", "العضو / المصدر", "البيان / الملاحظات", "المبلغ (جنيه)"];
  const lines = [headers.join(",")];
  let total = 0;
  for (const r of rows) {
    const amt = Number(r.amount) || 0;
    total += amt;
    const typeLabel = r.type === "store" ? "ستور وكافتيريا" : (r.type === "balance" ? "سداد متبقي" : "اشتراك");
    const cells = [r.date || "", typeLabel, r.memberName || "", r.note || "", amt]
      .map(v => `"${String(v ?? "").replace(/"/g, '""')}"`);
    lines.push(cells.join(","));
  }
  lines.push(`"","","","الإجمالي","${total}"`);
  const csv = "\uFEFF" + lines.join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ---------- Two-Sided PDF ID Card ---------- */
async function downloadMemberIdPdf(gym, member, gymId) {
  const { jsPDF } = await import("https://esm.sh/jspdf@2.5.1");
  const mod = await import("https://esm.sh/qrcode@1.5.4");
  const QR = mod.default || mod;
  const st = calcMemberState(member);
  const subText = fmtLeftText(st);

  const wMm = 85.6, hMm = 54, scale = 4;
  const makeFace = fn => {
    const c = document.createElement("canvas");
    c.width = Math.round(wMm * scale); c.height = Math.round(hMm * scale);
    const ctx = c.getContext("2d");
    ctx.scale(scale, scale);
    fn(ctx, wMm, hMm);
    return c.toDataURL("image/png", 1.0);
  };

  const frontImg = makeFace((ctx, w, h) => {
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#EA580C";
    ctx.fillRect(0, 0, w, 13);
    ctx.fillStyle = "#FFF7ED";
    ctx.beginPath();
    ctx.arc(14, 38, 17, 0, Math.PI * 2);
    ctx.fill();

    ctx.direction = "rtl";
    ctx.textAlign = "right";
    ctx.fillStyle = "#FFFFFF";
    ctx.font = "bold 4.3px 'IBM Plex Sans Arabic', sans-serif";
    ctx.fillText(gym?.name || "GymPro", w - 5, 8.2);

    ctx.textAlign = "left";
    ctx.fillStyle = "#FFEDD5";
    ctx.font = "bold 3.3px sans-serif";
    ctx.fillText(`#${member.code || ""}`, 5, 8);

    ctx.direction = "rtl";
    ctx.textAlign = "right";
    ctx.fillStyle = "#0F172A";
    ctx.font = "bold 5.8px 'IBM Plex Sans Arabic', sans-serif";
    ctx.fillText(member.name || "عضو", w - 5, 22.5);

    ctx.fillStyle = "#EA580C";
    ctx.font = "bold 3.9px 'IBM Plex Sans Arabic', sans-serif";
    ctx.fillText(`الباقة: ${member.planName || "—"} · متبقي ${sessionsText(member)}`, w - 5, 30.5);

    ctx.fillStyle = "#475569";
    ctx.font = "3.8px 'IBM Plex Sans Arabic', sans-serif";
    ctx.fillText(`الاشتراك: ${subText}`, w - 5, 37.5);

    if (member.phone) {
      ctx.fillStyle = "#64748B";
      ctx.font = "3.5px sans-serif";
      ctx.fillText(`الموبايل: ${member.phone}`, w - 5, 44.5);
    }
    ctx.fillStyle = "#F97316";
    ctx.fillRect(0, h - 2.5, w, 2.5);
  });

  const payload = `GYMPRO|${gymId}|${member.code || member.id}|${member.password || ""}`;
  const qrUrl = await QR.toDataURL(payload, { margin: 1, width: 320, color: { dark: "#0F172A", light: "#FFFFFF" } });
  const qrEl = await new Promise((res, rej) => {
    const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = qrUrl;
  });

  const backImg = makeFace((ctx, w, h) => {
    ctx.fillStyle = "#FFF7ED";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(3.5, 3.5, w - 7, h - 7);

    const sz = 23;
    ctx.drawImage(qrEl, (w - sz) / 2, 5.5, sz, sz);

    ctx.direction = "rtl";
    ctx.textAlign = "center";
    ctx.fillStyle = "#64748B";
    ctx.font = "bold 3.4px 'IBM Plex Sans Arabic', sans-serif";
    ctx.fillText("كلمة المرور الخاصة بالدخول", w / 2, 33.5);

    ctx.fillStyle = "#EA580C";
    ctx.font = "bold 5.4px sans-serif";
    ctx.fillText(String(member.password || "—"), w / 2, 41);

    ctx.fillStyle = "#94A3B8";
    ctx.font = "2.9px 'IBM Plex Sans Arabic', sans-serif";
    ctx.fillText("امسح QR لتسجيل الدخول أو استخدم الكود وكلمة المرور", w / 2, 47.5);
  });

  const pdf = new jsPDF({ orientation: "landscape", unit: "mm", format: [wMm, hMm] });
  pdf.addImage(frontImg, "PNG", 0, 0, wMm, hMm);
  pdf.addPage([wMm, hMm], "landscape");
  pdf.addImage(backImg, "PNG", 0, 0, wMm, hMm);

  const safeName = String(member.name || "member").replace(/[^\w\u0600-\u06FF-]+/g, "_");
  pdf.save(`ID_${safeName}_${member.code || "card"}.pdf`);
}

      const idVal = $("#mId").value.trim();
      const passVal = $("#mPass").value.trim();
      if (!idVal || !passVal) return viewLogin("اكتب الاسم أو رقم الموبايل وكلمة المرور.");

      const btn = $("#mLoginBtn");
      btn.disabled = true; btn.textContent = "جاري البحث…";
      try {
        const gymsSnap = await getDocs(collection(db, "gyms"));
        const inputPhone = normPhone(idVal);
        const inputName = normName(idVal);

        for (const gDoc of gymsSnap.docs) {
          const gid = gDoc.id;
          const gym = gDoc.data();
          const mSnap = await getDocs(collection(db, "gyms", gid, "members"));
          const matched = mSnap.docs.map(d => ({ id: d.id, ...d.data() })).find(m => {
            const mPhone = normPhone(m.phone);
            const mName = normName(m.name);
            const matchByPhone = inputPhone.length >= 8 && mPhone === inputPhone;
            const matchByName = inputName.length >= 2 && mName === inputName;
            const passOk = String(m.password ?? "").trim() === passVal;
            return (matchByPhone || matchByName) && passOk;
          });

          if (matched) {
            const [attSnap, paySnap, prodsSnap] = await Promise.all([
              getDocs(query(collection(db, "gyms", gid, "attendance"), where("memberId", "==", matched.id))),
              getDocs(query(collection(db, "gyms", gid, "payments"), where("memberId", "==", matched.id))),
              getDocs(collection(db, "gyms", gid, "products"))
            ]);
            const logs = attSnap.docs.map(d => d.data()).sort((a, b) => (toDate(b.ts)?.getTime() || 0) - (toDate(a.ts)?.getTime() || 0));
            const paidTotal = sum(paySnap.docs.map(d => d.data()));
            const products = prodsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            return renderMemberPortal(gid, gym, matched, logs, paidTotal, products);
          }
        }
        viewLogin("الاسم أو رقم الموبايل أو كلمة المرور غير صحيحة.");
      } catch (e) {
        viewLogin(errText(e));
      }
    });
  }
}

function destroyCharts() {
  charts.forEach(c => { try { c.destroy(); } catch {} });
  charts = [];

async function loadMembers() {
  const snap = await getDocs(col("members"));
  MEMBERS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function loadPlans() {
  const snap = await getDocs(col("plans"));
  PLANS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  PLANS.sort((a, b) => (a.days || 0) - (b.days || 0));

async function loadProducts() {
  const snap = await getDocs(col("products"));
  PRODUCTS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  PRODUCTS.sort((a, b) => (a.name || "").localeCompare(b.name || "", "ar"));

function reminderText(m) {
  const st = calcMemberState(m);
  const gname = G.gym.name || "الجيم";
  if (st.key === "expired") return `أهلًا ${m.name}، انتهى اشتراكك في ${gname} بتاريخ ${fmtDate(st.end)}. نتشرف بتجديدك.`;
  if (st.end) return `أهلًا ${m.name}، اشتراكك في ${gname} ينتهي بتاريخ ${fmtDate(st.end)}. نتشرف بتجديدك.`;
  return `أهلًا ${m.name}، معك ${gname}.`;
}

function stopScanner() {
  if (scanner) {
    const s = scanner; scanner = null;
    s.stop().then(() => s.clear()).catch(() => {});
  }
}

function nav(tab, sub = null) {
  stopScanner();
  destroyCharts();
  if (tab) S.tab = tab;
  S.sub = sub;
  renderOwner();
  window.scrollTo(0, 0);
}

function renderOwner() {
  RT++;
  const tok = RT;
  const hideMoney = Boolean(G.gym.hideMoneyForStaff) && !isAccountant() && role() !== "owner";
  const hideSettings = Boolean(G.gym.hideSettingsForStaff) && role() !== "owner";

  let tabs = [];
  if (isAccountant()) {
    tabs = [["money", "المالية", "chart"], ["settings", "الحساب", "settings"]];
  } else {
    tabs = [
      ["home", "الرئيسية", "home"],
      ["members", "الأعضاء", "users"],
      ["checkin", "الحضور", "qr"],
      ["captains", "الكباتن", "mapPin"],
      ["store", "الستور", "store"],
      ["broadcast", "التغذية", "send"]
    ];
    if (!hideMoney) tabs.push(["money", "المالية", "chart"]);
    if (!hideSettings) tabs.push(["settings", "الإعدادات", "settings"]);
  }

  if (!tabs.some(t => t[0] === S.tab)) S.tab = tabs[0][0];

  const end = toDate(G.gym.subscriptionEnd);
  const roleLabel = isAccountant() ? "محاسب" : (isReception() ? "استقبال" : "مدير الجيم");

  root.innerHTML = `

          <div class="gname">${esc(G.gym.name || "الجيم")}</div>

    <main id="main" class="wrap"></main>
    <nav class="tabs" aria-label="التنقل">
      ${tabs.map(([k, l, ic]) => `<button data-t="${k}" ${S.tab === k ? 'aria-current="page"' : ""}>${ico(ic)}<span>${l}</span></button>`).join("")}
    </nav>
  </div>`;
  $$(".tabs button").forEach(b => b.addEventListener("click", () => nav(b.dataset.t, null)));
  const main = $("#main");
  if (S.sub) return SUBS[S.sub.type](main, tok);
  return SCREENS[S.tab](main, tok);
}

/* ---------- Members ---------- */
function screenMembers(main) {
  main.innerHTML = `
  <div class="toolbar">
    <input id="q" type="search" placeholder="بحث بالاسم أو الموبايل أو الكود" value="${esc(S.q)}">
    <select id="flt" aria-label="تصفية">
      <option value="all">الكل</option>
      <option value="active">ساري</option>
      <option value="soon">ينتهي قريبًا</option>
      <option value="expired">منتهي</option>
      <option value="owing">عليه مبلغ</option>
    </select>
  </div>
  <button class="btn" id="newMember" style="margin-bottom:14px">${ico("userPlus")} عضو جديد</button>
  <div class="rows" id="mList"></div>`;
  $("#flt").value = S.filter;

  const draw = () => {
    const q = normName(S.q);
    const digits = normPhone(S.q);
    let list = MEMBERS.filter(m => {
      if (!q) return true;
      return normName(m.name).includes(q)
        || (digits && (String(m.code) === digits || normPhone(m.phone).includes(digits)));
    });
    list = list.filter(m => {
      const st = calcMemberState(m);
      if (S.filter === "active") return st.key === "active" || st.key === "soon";
      if (S.filter === "soon") return st.key === "soon";
      if (S.filter === "expired") return st.key === "expired";
      if (S.filter === "owing") return Number(m.balance) > 0;
      return true;
    });
    list.sort((a, b) => (a.name || "").localeCompare(b.name || "", "ar"));
    $("#mList").innerHTML = list.length
      ? list.slice(0, 100).map(m => memberRowHtml(m)).join("") + (list.length > 100 ? `<div class="empty">يظهر أول 100 نتيجة. استخدم البحث.</div>` : "")
      : `<div class="empty">${MEMBERS.length ? "لا توجد نتائج." : "لا يوجد أعضاء بعد. اضغط «عضو جديد» لإضافة أول عضو."}</div>`;
    wireOpen($("#mList"));
  };
  $("#q").addEventListener("input", e => { S.q = e.target.value; draw(); });
  $("#flt").addEventListener("change", e => { S.filter = e.target.value; draw(); });
  $("#newMember").addEventListener("click", () => nav(null, { type: "newMember" }));
  draw();
}

    </div>
  </div>
  <div class="field">
    <label for="pf-sess">عدد التمارين في الباقة</label>
    <input id="pf-sess" type="number" inputmode="numeric" min="1" dir="ltr" value="30">
  </div>
  <p class="hint" id="pf-rem"></p>`;
}
function wirePlanFields(box) {
  const sel = $("#pf-plan", box); if (!sel) return;
  const price = $("#pf-price", box), paid = $("#pf-paid", box), sess = $("#pf-sess", box), rem = $("#pf-rem", box);
  const upd = () => {
    const r = num(price.value) - num(paid.value);
    rem.textContent = r > 0 ? `المتبقي على العضو: ${money(r)}` : (r < 0 ? "المدفوع أكبر من السعر." : "مدفوع بالكامل.");
  };
  const fill = () => {
    const p = PLANS.find(x => x.id === sel.value);
    price.value = p ? p.price : 0;
    paid.value = p ? p.price : 0;
    if (sess && p) sess.value = p.sessions || 30;
    upd();
  };
  sel.addEventListener("change", fill);
  price.addEventListener("input", upd);
  paid.addEventListener("input", upd);
  fill();
}
function readPlanFields(box) {
  const plan = PLANS.find(x => x.id === $("#pf-plan", box)?.value);
  const start = $("#pf-start", box)?.value;
  const price = num($("#pf-price", box)?.value);
  const paid = num($("#pf-paid", box)?.value);
  const sessions = Math.max(1, Math.round(num($("#pf-sess", box)?.value) || plan?.sessions || 30));
  if (!plan) throw new Error("اختر باقة.");
  if (!start) throw new Error("اختر تاريخ البداية.");
  if (paid > price) throw new Error("المدفوع أكبر من السعر.");
  const endStr = plusDays(start, Number(plan.days) || 0);
  return { plan, start, price, paid, sessions, startTs: Timestamp.fromDate(parseYmd(start)), end: endOfDay(endStr) };
}

function findMemberFromScan(raw) {
  const txt = String(raw || "").trim();
  if (!txt) return null;
  if (txt.startsWith("GYMPRO|")) {
    const parts = txt.split("|");
    const codePart = parts[2] || "";
    return MEMBERS.find(m => String(m.code) === codePart || m.id === codePart) || null;
  }
  const d = arabicDigitsToEn(txt).replace(/\D/g, "");
  if (!d) return null;
  if (d.length <= 6) return MEMBERS.find(m => String(m.code) === d) || null;
  const n = normPhone(d);
  return MEMBERS.find(m => normPhone(m.phone) === n) || null;
}

      box.innerHTML = `<div class="result warn"><div class="rt">${ico("alert", "sm")} سُجّل حضوره اليوم بالفعل${at ? " الساعة " + fmtTime(at) : ""}</div>
        <div class="rn">${esc(m.name)}</div>
        <div>باقي تمرينة: <b>${esc(sessionsText(m))}</b> · ${esc(fmtLeftText(st))}</div></div>`;
      return;
    }

    const nowTs = serverTimestamp();
    const curSess = Number(m.sessionsLeft);
    const nextSess = isNaN(curSess) ? null : Math.max(0, curSess - 1);

    await setDoc(aRef, {
      memberId: m.id, memberName: m.name, code: m.code, date: todayStr(),
      ts: nowTs, by: G.uid
    });
    const upd = { lastCheckinAt: nowTs };
    if (nextSess !== null) upd.sessionsLeft = nextSess;
    await updateDoc(ref("members", m.id), upd);

    if (nextSess !== null) m.sessionsLeft = nextSess;
    m.lastCheckinAt = { toDate: () => new Date() };

    const dueLine = Number(m.balance) > 0 ? `<div class="due">عليه مبلغ متبقي ${money(m.balance)}</div>` : "";
    box.innerHTML = `<div class="result ok"><div class="rt">${ico("checkCircle", "sm")} تم تسجيل الحضور (${fmtDateTime(new Date())})</div>
      <div class="rn">${esc(m.name)}</div>
      <div>باقي تمرينة: <b>${esc(sessionsText(m))}</b> · ${esc(fmtLeftText(st))}</div>${dueLine}
      ${st.key === "soon" ? `<div class="acts">${waBtn}</div>` : ""}</div>`;
    loadToday(RT);
  } catch (e) {
    box.innerHTML = `<p class="msg err">${esc(errText(e))}</p>`;
  }
}

async function loadToday(tok) {
  const list = $("#todayList");
  if (!list) return;
  try {
    const snap = await getDocs(query(col("attendance"), where("date", "==", todayStr())));
    if (tok !== RT) return;
    const rows = snap.docs.map(d => d.data()).sort((a, b) => (toDate(b.ts)?.getTime() || 0) - (toDate(a.ts)?.getTime() || 0));
    list.innerHTML = rows.length
      ? rows.map(r => `<div class="row"><div class="name">${esc(r.memberName)}</div><div class="meta">كود ${esc(r.code)} · ${esc(fmtDateTime(toDate(r.ts)))}</div></div>`).join("")
      : `<div class="empty">لم يسجل أحد حضوره اليوم.</div>`;
  } catch (e) {
    if (tok === RT) list.innerHTML = `<div class="empty">${esc(errText(e))}</div>`;
  }
}

/* ---------- Captains GPS Attendance ---------- */
function screenCaptains(main) {
  const gymLat = Number(G.gym.lat);
  const gymLng = Number(G.gym.lng);
  const maxRadius = Number(G.gym.gpsRadius) || 250;
  const hasGymLoc = !isNaN(gymLat) && !isNaN(gymLng) && G.gym.lat !== undefined && G.gym.lng !== undefined && G.gym.lat !== "";

  main.innerHTML = `
  <h2>${ico("mapPin")} حضور وانصراف الكباتن (GPS)</h2>
  <div class="panel" style="margin-bottom:14px">
    <div style="font-weight:700;font-size:14px">إعداد موقع الجيم الجغرافي</div>
    <div class="hint">يُستخدم للتحقق من وجود الكابتن داخل نطاق الجيم عند تسجيل الحضور أو الانصراف.</div>
    <div class="two" style="margin-top:10px">
      <div class="field"><label for="gLat">خط العرض (Latitude)</label><input id="gLat" dir="ltr" value="${esc(G.gym.lat ?? "")}" placeholder="30.0444"></div>
      <div class="field"><label for="gLng">خط الطول (Longitude)</label><input id="gLng" dir="ltr" value="${esc(G.gym.lng ?? "")}" placeholder="31.2357"></div>
    </div>
    <div class="two">
      <div class="field"><label for="gRad">النطاق المسموح (متر)</label><input id="gRad" type="number" dir="ltr" value="${esc(maxRadius)}"></div>
      <div class="field" style="display:flex;align-items:flex-end"><button class="btn soft" type="button" id="useCurLocBtn">${ico("mapPin", "sm")} موقعي الحالي</button></div>
    </div>
    <button class="btn" type="button" id="saveLocBtn">${ico("check")} حفظ موقع الجيم</button>
  </div>

  ${!isReception() ? `
  <h2>${ico("plus")} إضافة كابتن</h2>
  <form class="panel" id="capForm" novalidate>
    <div class="two">
      <div class="field"><label for="cName">اسم الكابتن</label><input id="cName" placeholder="مثال: كابتن كريم"></div>
      <div class="field"><label for="cRole">التخصص</label><input id="cRole" placeholder="حديد / لياقة / تغذية"></div>
    </div>
    <button class="btn" type="submit" id="capSave">${ico("check")} إضافة الكابتن</button>
  </form>` : ""}

  <h2>${ico("users")} سجل الكباتن اليوم (${todayStr()})</h2>
  <div class="rows">
    ${CAPTAINS.length ? CAPTAINS.map(c => {
      const isTodayIn = c.lastDate === todayStr() && c.status === "in";
      const isTodayOut = c.lastDate === todayStr() && c.status === "out";
      return `
      <div class="row" data-cid="${esc(c.id)}">
        <div class="name">
          ${esc(c.name)}
          <span class="tag ${isTodayIn ? "active" : (isTodayOut ? "soon" : "none")}">${isTodayIn ? "حاضر الآن" : (isTodayOut ? "انصرف اليوم" : "لم يسجل اليوم")}</span>
        </div>
        <div class="meta">${esc(c.role || "كابتن")} · آخر تحديث: ${esc(fmtDateTime(toDate(c.lastAt)))}</div>
        <div class="acts">
          <button class="btn sm" data-gps="in">${ico("mapPin", "sm")} بصمة حضور GPS</button>
          <button class="btn ghost sm" data-gps="out">${ico("logout", "sm")} بصمة انصراف GPS</button>
          ${!isReception() ? `<button class="btn danger sm" data-delc="${esc(c.id)}">${ico("trash", "sm")} حذف</button>` : ""}
        </div>
      </div>`;
    }).join("") : `<div class="empty">لا يوجد كباتن مضافون بعد.</div>`}
  </div>`;

  $("#useCurLocBtn").addEventListener("click", async () => {
    try {
      const loc = await getCurrentGps();
      $("#gLat").value = loc.lat.toFixed(6);
      $("#gLng").value = loc.lng.toFixed(6);
      toast(`تم التقاط الإحداثيات (دقة ${loc.acc}م)`);
    } catch (e) { toast(e.message); }
  });

  $("#saveLocBtn").addEventListener("click", async () => {
    const lat = num($("#gLat").value);
    const lng = num($("#gLng").value);
    const gpsRadius = Math.max(20, Math.round(num($("#gRad").value) || 250));
    if (!lat || !lng) return toast("أدخل خط العرض وخط الطول أولًا.");
    try {
      await updateDoc(doc(db, "gyms", G.gymId), { lat, lng, gpsRadius });
      G.gym.lat = lat; G.gym.lng = lng; G.gym.gpsRadius = gpsRadius;
      toast("تم حفظ موقع الجيم");
      screenCaptains(main);
    } catch (e) { toast(errText(e)); }
  });

  const capForm = $("#capForm", main);
  if (capForm) {
    capForm.addEventListener("submit", async ev => {
      ev.preventDefault();
      const name = $("#cName").value.trim(), roleTxt = $("#cRole").value.trim();
      if (!name) return toast("اكتب اسم الكابتن.");
      try {
        const dRef = await addDoc(col("captains"), { name, role: roleTxt || "كابتن", createdAt: serverTimestamp() });
        CAPTAINS.push({ id: dRef.id, name, role: roleTxt || "كابتن" });
        toast("تمت إضافة الكابتن");
        screenCaptains(main);
      } catch (e) { toast(errText(e)); }
    });
  }

  $$("[data-gps]", main).forEach(b => b.addEventListener("click", async () => {
    const cid = b.closest(".row").dataset.cid;
    const cap = CAPTAINS.find(x => x.id === cid);
    const type = b.dataset.gps;
    b.disabled = true;
    try {
      const loc = await getCurrentGps();
      let dist = null;
      if (hasGymLoc) {
        dist = Math.round(haversineMeters(loc.lat, loc.lng, gymLat, gymLng));
        if (dist > maxRadius) {
          b.disabled = false;
          return toast(`أنت خارج نطاق الجيم (${dist} متر من أصل ${maxRadius} متر).`);
        }
      }
      const now = new Date();
      await addDoc(col("captain_attendance"), {
        captainId: cid, captainName: cap?.name || "", type, date: todayStr(),
        lat: loc.lat, lng: loc.lng, distanceMeters: dist, ts: serverTimestamp(), by: G.uid
      });
      await updateDoc(ref("captains", cid), {
        status: type, lastDate: todayStr(), lastAt: serverTimestamp(), lastDist: dist
      });
      if (cap) { cap.status = type; cap.lastDate = todayStr(); cap.lastAt = { toDate: () => now }; }
      toast(type === "in" ? `تم تسجيل حضور ${cap.name} (GPS)` : `تم تسجيل انصراف ${cap.name} (GPS)`);
      screenCaptains(main);
    } catch (e) {
      b.disabled = false;
      toast(e.message || errText(e));
    }
  }));

  $$("[data-delc]", main).forEach(b => b.addEventListener("click", async () => {
    if (!confirm("حذف هذا الكابتن؟")) return;
    try {
      await deleteDoc(ref("captains", b.dataset.delc));
      CAPTAINS = CAPTAINS.filter(x => x.id !== b.dataset.delc);
      screenCaptains(main);
    } catch (e) { toast(errText(e)); }
  }));
}

        S.cart.push({ id: p.id, name: p.name, price: Number(p.price), qty: 1, category: p.category });

    }));

      const item = S.cart.find(c => c.id === b.dataset.inc);

        screenStore(main);

      <select id="prCat">
        <option value="cafe" ${editing?.category === "cafe" ? "selected" : ""}>الكافتيريا والمشروبات</option>
        <option value="gym" ${editing?.category === "gym" ? "selected" : ""}>منتجات ومكملات الجيم</option>
      </select>
    </div>
    <div class="field">
      <label for="prImg">${ico("image", "sm")} رابط صورة المنتج (اختياري)</label>
      <input id="prImg" dir="ltr" value="${esc(editing?.imgUrl || "")}" placeholder="https://...">
    </div>
    <div class="two">
      <div class="field"><label for="prPrice">سعر البيع</label><input id="prPrice" type="number" inputmode="decimal" min="0" dir="ltr" value="${esc(editing?.price ?? "")}"></div>
      <div class="field"><label for="prStock">الكمية بالمخزون</label><input id="prStock" type="number" inputmode="numeric" min="0" dir="ltr" value="${esc(editing?.stock ?? 10)}"></div>
    </div>
    <button class="btn" type="submit" id="prSave">${ico("check")} ${editing ? "حفظ التعديل" : "إضافة المنتج"}</button>
    ${editing ? `<button class="linkbtn" type="button" id="prCancel">إلغاء التعديل</button>` : ""}
  </form>

  <h2>${ico("package")} قائمة المنتجات (${PRODUCTS.length})</h2>
  <div class="rows">
    ${PRODUCTS.length ? PRODUCTS.map(p => `
      <div class="row">
        <div class="name">${esc(p.name)} <span class="tag cat">${esc(CATS[p.category] || "منتج")}</span></div>
        <div class="meta">السعر: <b>${money(p.price)}</b> · المتاح: <b>${p.stock ?? 0}</b></div>
        <div class="acts">
          <button class="btn ghost sm" data-editpr="${esc(p.id)}">${ico("edit", "sm")} تعديل</button>
          <button class="btn danger sm" data-delpr="${esc(p.id)}">${ico("trash", "sm")} حذف</button>
        </div>
      </div>`).join("") : `<div class="empty">لا توجد منتجات مضافة بعد.</div>`}
  </div>`;

  const prCancel = $("#prCancel", body);
  if (prCancel) prCancel.addEventListener("click", () => { S.editProd = null; screenStore(main); });
  $$("[data-editpr]", body).forEach(b => b.addEventListener("click", () => { S.editProd = b.dataset.editpr; screenStore(main); window.scrollTo(0, 0); }));
  $$("[data-delpr]", body).forEach(b => b.addEventListener("click", async () => {
    if (!confirm("حذف هذا المنتج نهائيًا؟")) return;
    try { await deleteDoc(ref("products", b.dataset.delpr)); await loadProducts(); toast("تم حذف المنتج"); screenStore(main); }
    catch (e) { toast(errText(e)); }
  }));

  $("#prodForm", body).addEventListener("submit", async ev => {
    ev.preventDefault();
    const name = $("#prName").value.trim(), category = $("#prCat").value, imgUrl = $("#prImg").value.trim();
    const price = num($("#prPrice").value), stock = Math.max(0, Math.round(num($("#prStock").value)));
    if (!name || price <= 0) return toast("اكتب اسم المنتج وسعرًا صحيحًا.");
    const btn = $("#prSave"); btn.disabled = true;
    try {
      if (editing) await updateDoc(ref("products", editing.id), { name, category, imgUrl, price, stock });

      S.editProd = null; await loadProducts(); toast("تم حفظ المنتج"); screenStore(main);
    } catch (e) { btn.disabled = false; toast(errText(e)); }
  });
}

/* ---------- Money + Charts + Excel ---------- */
async function screenMoney(main, tok) {
  main.innerHTML = `<p class="muted">جاري التحميل…</p>`;
  let pay, exp;
  try {
    [pay, exp] = await Promise.all([
      getDocs(query(col("payments"), where("date", ">=", monthStart()), where("date", "<=", monthEnd()))),
      getDocs(query(col("expenses"), where("date", ">=", monthStart()), where("date", "<=", monthEnd())))
    ]);
  } catch (e) { if (tok !== RT) return; main.innerHTML = `<p class="msg err">${esc(errText(e))}</p>`; return; }
  if (tok !== RT) return;

  const byNewest = (a, b) => String(b.date).localeCompare(String(a.date)) || ((toDate(b.ts)?.getTime() || 0) - (toDate(a.ts)?.getTime() || 0));
  const payments = pay.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNewest);
  const expenses = exp.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNewest);
  const rev = sum(payments), ex = sum(expenses);
  const subRev = sum(payments.filter(p => p.type !== "store"));
  const storeRev = sum(payments.filter(p => p.type === "store"));

  main.innerHTML = `
  <div class="top" style="margin-bottom:12px">
    <h2 style="margin:0">${ico("wallet")} ملخص الشهر</h2>
    <button class="btn soft sm" type="button" id="exportExcelBtn">${ico("download", "sm")} تصدير Excel</button>
  </div>
  <div class="panel">
    <div class="stat"><span>إجمالي الإيرادات</span><b>${money(rev)}</b></div>
    <div class="stat"><span>إيراد الاشتراكات</span><b>${money(subRev)}</b></div>
    <div class="stat"><span>إيراد الستور والكافتيريا</span><b>${money(storeRev)}</b></div>
    <div class="stat"><span>المصروفات</span><b>${money(ex)}</b></div>
    <div class="stat big"><span>الصافي</span><b>${money(rev - ex)}</b></div>
  </div>

  <h2>${ico("chart")} التحليل المالي للشهر</h2>
  <div class="panel" style="margin-bottom:14px">
    <div style="font-weight:700;font-size:14px;margin-bottom:6px">الإيرادات مقابل المصروفات (يومي)</div>
    <div class="chart-wrap"><canvas id="revExpChart"></canvas></div>
  </div>
  <div class="panel">
    <div style="font-weight:700;font-size:14px;margin-bottom:6px">توزيع مصادر الإيرادات</div>
    <div class="chart-wrap sm"><canvas id="sourceChart"></canvas></div>
  </div>

  <h2>${ico("plus")} إضافة مصروف</h2>
  <form class="panel" id="xform" novalidate>
    <div class="field"><label for="xt">البند</label><input id="xt" placeholder="مثال: كهرباء، رواتب، صيانة"></div>
    <div class="two">
      <div class="field"><label for="xa">المبلغ</label><input id="xa" type="number" inputmode="decimal" min="0" dir="ltr"></div>
      <div class="field"><label for="xd">التاريخ</label><input id="xd" type="date" dir="ltr" value="${todayStr()}"></div>
    </div>
    <button class="btn" type="submit" id="xsave">${ico("check")} حفظ المصروف</button>
  </form>

  <h2>${ico("trendingDown")} مصروفات الشهر</h2>
  <div class="rows">${expenses.length ? expenses.slice(0, 40).map(x => `
    <div class="row"><div class="name">${esc(x.title)} — ${money(x.amount)}</div><div class="meta">${esc(x.date)}</div>
    <div class="acts"><button class="btn danger sm" data-delx="${esc(x.id)}">${ico("trash", "sm")} حذف</button></div></div>`).join("") : `<div class="empty">لا توجد مصروفات هذا الشهر.</div>`}</div>

  <h2>${ico("trendingUp")} إيرادات الشهر</h2>
  <div class="rows">${payments.length ? payments.slice(0, 40).map(p => `
    <div class="row"><div class="name">${esc(p.memberName || "")} — ${money(p.amount)}</div><div class="meta">${esc(p.date)} · ${esc(p.note || "")}</div></div>`).join("") : `<div class="empty">لا توجد إيرادات هذا الشهر.</div>`}</div>`;

  $("#exportExcelBtn").addEventListener("click", () => { exportRevenueExcel(payments, `revenues_${monthStart()}.csv`); toast("تم تحميل شيت الإيرادات"); });

  if (typeof Chart !== "undefined") {
    destroyCharts();
    const now = new Date();
    const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const labels = [], revSeries = [], expSeries = [];
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(d)}`;
      labels.push(String(d));
      revSeries.push(sum(payments.filter(p => p.date === ds)));
      expSeries.push(sum(expenses.filter(x => x.date === ds)));
    }
    const isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    const gridColor = isDark ? "rgba(255,255,255,0.08)" : "rgba(15,23,42,0.06)";
    const textColor = isDark ? "#94A3B8" : "#64748B";

    const ctx1 = $("#revExpChart")?.getContext("2d");
    if (ctx1) charts.push(new Chart(ctx1, {
      type: "bar",
      data: { labels, datasets: [
        { label: "الإيرادات", data: revSeries, backgroundColor: "#EA580C", borderRadius: 4 },
        { label: "المصروفات", data: expSeries, backgroundColor: "#94A3B8", borderRadius: 4 }
      ] },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: textColor, font: { family: "IBM Plex Sans Arabic" } } } },
        scales: { x: { grid: { display: false }, ticks: { color: textColor, maxTicksLimit: 10 } }, y: { grid: { color: gridColor }, ticks: { color: textColor } } }
      }
    }));

    const ctx2 = $("#sourceChart")?.getContext("2d");
    if (ctx2) charts.push(new Chart(ctx2, {
      type: "doughnut",
      data: { labels: ["اشتراكات الجيم", "الستور والكافتيريا"], datasets: [{ data: [subRev || 0, storeRev || 0], backgroundColor: ["#EA580C", "#FDBA74"], borderWidth: 0 }] },
      options: { responsive: true, maintainAspectRatio: false, cutout: "65%",
        plugins: { legend: { position: "bottom", labels: { color: textColor, font: { family: "IBM Plex Sans Arabic" } } } }
      }
    }));
  }

  $("#xform").addEventListener("submit", async ev => {
    ev.preventDefault();
    const title = $("#xt").value.trim(), amount = num($("#xa").value), date = $("#xd").value;
    if (!title || amount <= 0 || !date) return toast("أكمل البند والمبلغ والتاريخ.");
    const btn = $("#xsave"); btn.disabled = true;
    try { await addDoc(col("expenses"), { title, amount, date, ts: serverTimestamp(), by: G.uid }); toast("تم حفظ المصروف"); renderOwner(); }
    catch (e) { btn.disabled = false; toast(errText(e)); }
  });
  $$("[data-delx]", main).forEach(b => b.addEventListener("click", async () => {
    if (!confirm("حذف هذا المصروف؟")) return;
    try { await deleteDoc(ref("expenses", b.dataset.delx)); renderOwner(); } catch (e) { toast(errText(e)); }
  }));
}

function setFormMsg(text, kind = "err") {
  const box = $("#formMsg");
  box.innerHTML = text ? `<p class="msg ${kind}" role="${kind === "err" ? "alert" : "status"}">${ico(kind === "err" ? "alert" : "checkCircle", "sm")} ${esc(text)}</p>` : "";
}

async function onCreateGym(ev) {
  ev.preventDefault();
  const gName = $("#gName").value.trim();
  const oName = $("#oName").value.trim();
  const oEmail = $("#oEmail").value.trim().toLowerCase();
  const oPass = $("#oPass").value;
  const logoUrl = $("#gLogo").value.trim();
  const plan = $("#gPlan").value;
  const months = Math.max(1, Math.min(36, parseInt($("#gMonths").value, 10) || 1));

  if (!gName || !oName || !oEmail || !oPass) return setFormMsg("أكمل كل الخانات.");
  if (!isValidEmail(oEmail)) return setFormMsg("اكتب إيميلًا صحيحًا للمدير.");
  if (oPass.length < 6) return setFormMsg("كلمة المرور لازم تكون 6 أحرف أو أرقام على الأقل.");

  const btn = $("#gymBtn"); btn.disabled = true; btn.textContent = "جاري الإنشاء…";
  setFormMsg("");

  try {
    const cred = await createUserWithEmailAndPassword(auth2, oEmail, oPass);
    const uid = cred.user.uid;
    await signOut(auth2);

    const gymRef = doc(collection(db, "gyms"));
    await setDoc(doc(db, "users", uid), {
      name: oName, email: oEmail, role: "owner", active: true, gymId: gymRef.id,
      createdAt: serverTimestamp()
    });
    await setDoc(gymRef, {
      name: gName, logoUrl, plan, status: "active",
      ownerUid: uid, ownerName: oName, ownerEmail: oEmail,
      subscriptionEnd: Timestamp.fromDate(new Date(Date.now() + months * 30 * DAY)),
      createdAt: serverTimestamp()
    });

    $("#gymForm").reset();
    $("#gMonths").value = 1;
    setFormMsg(`تم إنشاء «${gName}» بنجاح.`, "ok");
    loadGyms();
  } catch (e) {
    setFormMsg(errText(e));
  } finally {
    btn.disabled = false; btn.innerHTML = `${ico("check")} إنشاء الجيم`;
  }
}

async function loadGyms() {
  const box = $("#gymList");
  if (!box) return;
  try {
    const [snap, usersSnap] = await Promise.all([
      getDocs(collection(db, "gyms")),
      getDocs(collection(db, "users"))
    ]);
    const usersMap = new Map();
    usersSnap.docs.forEach(d => usersMap.set(d.id, d.data()));

    const gyms = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    gyms.sort((a, b) => (toDate(b.createdAt)?.getTime() || 0) - (toDate(a.createdAt)?.getTime() || 0));

    if (!gyms.length) {
      box.innerHTML = `<div class="rows"><div class="empty">لا توجد جيمات بعد. أضف أول جيم من النموذج أعلاه.</div></div>`;
      return;
    }

    box.innerHTML = `<div class="rows">${gyms.map(g => {
      const end = toDate(g.subscriptionEnd);
      const expired = end && end.getTime() < Date.now();
      const status = g.status === "suspended" ? "suspended" : (expired ? "expired" : "active");
      const label = { active: "الجيم نشط", suspended: "الجيم موقوف", expired: "منتهي" }[status];
      const mgr = g.ownerUid ? usersMap.get(g.ownerUid) : null;
      const mgrActive = mgr ? mgr.active !== false : true;
      const emailValid = isValidEmail(g.ownerEmail || mgr?.email);

      return `
      <div class="row" data-id="${esc(g.id)}" data-uid="${esc(g.ownerUid || "")}">
        <div class="name">
          ${gymLogoHtml(g, "mini-logo")}
          <span>${esc(g.name || g.id)}</span>
          <span class="tag ${status}">${label}</span>
          <span class="tag ${mgrActive ? "active" : "suspended"}">${mgrActive ? "المدير نشط" : "المدير موقوف"}</span>
        </div>
        <div class="meta">${esc(PLANS_LABEL[g.plan] || g.plan || "—")} · ينتهي ${fmtDate(end)}</div>
        <div class="meta">المدير: <b>${esc(g.ownerName || mgr?.name || "—")}</b> · الإيميل: <b>${esc(g.ownerEmail || mgr?.email || "—")}</b> <span class="tag ${emailValid ? "active" : "suspended"}">${emailValid ? "إيميل صحيح" : "إيميل غير صحيح"}</span></div>
        <div class="acts">
          <button class="btn ghost sm" data-act="extend">${ico("refresh", "sm")} تمديد 30 يوم</button>
          <button class="btn ghost sm" data-act="toggleGym">${g.status === "suspended" ? "تفعيل الجيم" : "إيقاف الجيم"}</button>
          ${g.ownerUid ? `<button class="btn soft sm" data-act="toggleMgr">${mgrActive ? "إيقاف المدير" : "تنشيط المدير"}</button>` : ""}
        </div>
      </div>`;
    }).join("")}</div>`;

    $$("button[data-act]", box).forEach(b => {
      b.addEventListener("click", async () => {
        const row = b.closest(".row");
        const id = row.dataset.id, uid = row.dataset.uid;
        const g = gyms.find(x => x.id === id);
        b.disabled = true;
        try {
          if (b.dataset.act === "toggleGym") {
            await updateDoc(doc(db, "gyms", id), { status: g.status === "suspended" ? "active" : "suspended" });
          } else if (b.dataset.act === "toggleMgr" && uid) {
            const curMgr = usersMap.get(uid);
            await updateDoc(doc(db, "users", uid), { active: curMgr ? curMgr.active === false : false });
          } else {
            const cur = toDate(g.subscriptionEnd);
            const base = cur && cur.getTime() > Date.now() ? cur.getTime() : Date.now();
            await updateDoc(doc(db, "gyms", id), { subscriptionEnd: Timestamp.fromDate(new Date(base + 30 * DAY)) });
          }
          loadGyms();
        } catch (e) { b.disabled = false; setFormMsg(errText(e)); }
      });
    });
  } catch (e) {
    box.innerHTML = `<div class="rows"><div class="empty">${esc(errText(e))}</div></div>`;
  }
}

/* ---------- Session Routing ---------- */
onAuthStateChanged(auth, async user => {
  stopScanner();
  destroyCharts();
  if (!user) {
    G = null;
    if (loginMode === "member") return;
    return viewLogin();
  }
  root.innerHTML = `<div class="loading">جاري التحميل…</div>`;
  try {
    const uSnap = await withTimeout(getDoc(doc(db, "users", user.uid)));
    if (!uSnap.exists()) return viewBlocked("الحساب غير مربوط", "هذا الحساب غير مربوط بأي جيم.");
    const profile = uSnap.data();
    if (profile.active !== true) return viewBlocked("الحساب موقوف", "تم إيقاف هذا الحساب.");
    if (profile.role === "superadmin") return viewAdmin(profile);

    const gSnap = await withTimeout(getDoc(doc(db, "gyms", profile.gymId)));
    if (!gSnap.exists()) return viewBlocked("الجيم غير موجود", "لم نجد بيانات الجيم المرتبط بحسابك.");
    const gym = gSnap.data();
    const end = toDate(gym.subscriptionEnd);
    if (gym.status === "suspended") return viewBlocked("الجيم موقوف", "تم إيقاف اشتراك هذا الجيم.");
    if (end && end.getTime() < Date.now()) return viewBlocked("انتهى اشتراك الجيم", "انتهى اشتراك الجيم. جدّد الاشتراك للاستمرار.");
    await startOwner(user.uid, profile, gym, profile.gymId);
  } catch (e) {
    viewBlocked("تعذر تحميل الحساب", errText(e), true);
  }
});
</script>
