<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E7C7B">
<title>GymPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
  :root {
    color-scheme: light dark;
    --bg: #E9EEF1;
    --surface: #FFFFFF;
    --ink: #14202B;
    --muted: #55666F;
    --line: #D3DCE2;
    --brand: #0E7C7B;
    --brand-ink: #FFFFFF;
    --warn: #8A5A00;
    --danger: #B42318;
    --ok: #0B6B3A;
    --ok-bg: #E3F4EA;
    --bad-bg: #FBE7E4;
    --warn-bg: #FBF0D9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10171D;
      --surface: #18222B;
      --ink: #E8EEF2;
      --muted: #9AAAB5;
      --line: #2A3743;
      --brand: #2FB8AB;
      --brand-ink: #06201F;
      --warn: #E5B454;
      --danger: #FF8A7E;
      --ok: #5FD39A;
      --ok-bg: #12301F;
      --bad-bg: #3A1A17;
      --warn-bg: #352A10;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    font-size: 16px;
    line-height: 1.7;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
  .wrap.wide { max-width: 760px; }
  .muted { color: var(--muted); }

  /* Login */
  .login { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
  .mark { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .mark svg { width: 64px; height: auto; color: var(--brand); flex: none; }
  .mark b { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; line-height: 1; }
  .login p.lead { margin: 0 0 24px; color: var(--muted); }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }

  label { display: block; font-weight: 600; font-size: 14px; margin: 0 0 6px; }
  .field { margin-bottom: 14px; }
  input, select, textarea {
    width: 100%; min-height: 48px; padding: 10px 14px;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px;
    font: inherit; font-size: 16px;
  }
  input[dir="ltr"] { text-align: left; }
  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible {
    outline: 3px solid var(--brand); outline-offset: 2px;
  }
  .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }

  button { font: inherit; cursor: pointer; }
  .btn {
    width: 100%; min-height: 50px; border: 0; border-radius: 10px;
    background: var(--brand); color: var(--brand-ink);
    font-weight: 700; font-size: 17px;
  }
  .btn[disabled] { opacity: .6; cursor: wait; }
  .btn.ghost {
    background: transparent; color: var(--ink);
    border: 1px solid var(--line); font-weight: 600; font-size: 15px;
    min-height: 44px; width: auto; padding: 0 16px;
  }
  .btn.sm { min-height: 40px; font-size: 14px; padding: 0 14px; width: auto; }
  .btn.wa-icon { width: 42px; min-width: 42px; height: 40px; padding: 0; display: inline-flex; align-items: center; justify-content: center; color: #25D366; border-color: #25D366; }
  .btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  .linkbtn { background: none; border: 0; color: var(--brand); font-weight: 600; padding: 10px 0; font-size: 15px; }
  a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }

  .msg { margin: 0 0 16px; padding: 12px 14px; border-radius: 10px; font-size: 15px; border: 1px solid var(--line); background: var(--bg); }
  .msg.err { color: var(--danger); border-color: var(--danger); }
  .msg.ok { color: var(--ok); border-color: var(--ok); }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .top .who { min-width: 0; }
  .top h1 { margin: 0; font-size: 22px; line-height: 1.3; }
  .top .sub { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }

  h2 { font-size: 18px; margin: 26px 0 12px; }
  h2:first-child { margin-top: 0; }
  .grid2 { display: grid; gap: 0 14px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } }
  .two { display: grid; gap: 0 12px; grid-template-columns: 1fr 1fr; }

  .rows { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .row { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .name { font-weight: 700; font-size: 17px; }
  .row .meta { color: var(--muted); font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
  .row .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .tag { display: inline-block; font-size: 13px; font-weight: 600; padding: 1px 10px; border-radius: 999px; border: 1px solid currentColor; margin-inline-start: 8px; vertical-align: middle; white-space: nowrap; }
  .tag.active { color: var(--ok); }
  .tag.suspended, .tag.expired { color: var(--danger); }
  .tag.soon { color: var(--warn); }
  .tag.none { color: var(--muted); }
  .empty { padding: 24px 16px; color: var(--muted); text-align: center; }

  .stat { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .stat:last-child { border-bottom: 0; }
  .stat span:first-child { color: var(--muted); }
  .stat b { font-weight: 600; }
  .stat.big b { font-size: 22px; font-weight: 700; }

  .loading { min-height: 100vh; display: grid; place-items: center; color: var(--muted); }

  /* Owner shell */
  .shell { min-height: 100vh; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  .oh { background: var(--surface); border-bottom: 1px solid var(--line); }
  .oh .in { max-width: 560px; margin: 0 auto; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .oh .gname { font-weight: 700; font-size: 18px; line-height: 1.3; }
  .oh .gsub { color: var(--muted); font-size: 13px; }
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabs button {
    flex: 1; background: none; border: 0; padding: 8px 2px; min-height: 56px;
    color: var(--muted); font-size: 13px; font-weight: 600;
  }
  .tabs button[aria-current="page"] { color: var(--brand); box-shadow: inset 0 3px 0 var(--brand); }

  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
  .toolbar input { flex: 1; }
  .toolbar select { width: auto; max-width: 45%; }
  .mrow { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
  .mrow:last-child { border-bottom: 0; }
  .mmain {
    flex: 1; min-width: 0; text-align: start; background: none; border: 0; color: inherit;
    padding: 12px 16px;
  }
  .mmain .name { font-weight: 700; font-size: 16px; }
  .mmain .meta { color: var(--muted); font-size: 13px; }
  .mrow .side { padding-inline-end: 12px; display: flex; gap: 6px; align-items: center; }
  .due { color: var(--danger); font-weight: 600; }

  .result { border-radius: 14px; padding: 18px; margin: 16px 0; border: 1px solid currentColor; }
  .result.ok { background: var(--ok-bg); color: var(--ok); }
  .result.bad { background: var(--bad-bg); color: var(--danger); }
  .result.warn { background: var(--warn-bg); color: var(--warn); }
  .result .rn { font-size: 22px; font-weight: 700; color: var(--ink); }
  .result .rt { font-weight: 700; margin-bottom: 4px; }
  .result .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

  #reader { width: 100%; max-width: 360px; margin: 12px auto; border-radius: 12px; overflow: hidden; }
  .qrbox { text-align: center; }
  .qrbox img { width: 220px; height: 220px; background: #fff; border-radius: 8px; padding: 6px; }
  .bigcode { font-size: 34px; font-weight: 700; letter-spacing: 3px; direction: ltr; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(78px + env(safe-area-inset-bottom));
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; z-index: 50;
    font-size: 15px; max-width: 90vw; text-align: center;
  }
  .back { margin-bottom: 12px; }
</style>
</head>
<body>
<div id="app"><div class="loading" data-boot>جاري التحميل…</div></div>
<script>
setTimeout(function () {
  var b = document.querySelector("[data-boot]");
  if (b) b.innerHTML = "تعذر تحميل النظام. تأكد من الإنترنت ثم <button onclick=\"location.reload()\" style=\"font:inherit;padding:8px 14px;border-radius:8px;border:1px solid currentColor;background:none;color:inherit;margin-inline-start:8px\">أعد التحميل</button>";

</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
  createUserWithEmailAndPassword, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  initializeFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, collection, getDocs,
  query, where, runTransaction, writeBatch, increment, serverTimestamp, Timestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBeqByUoV-b8l0QBH8xvLcV-92sQOKyfPc",
  authDomain: "gympro-86c9a.firebaseapp.com",
  projectId: "gympro-86c9a",
  storageBucket: "gympro-86c9a.firebasestorage.app",
  messagingSenderId: "45214121091",
  appId: "1:45214121091:web:0cc1036e043eecae6cafb6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
// نسخة ثانوية لإنشاء حساب مدير الجيم بدون تسجيل خروج السوبر أدمن
const app2 = initializeApp(firebaseConfig, "secondary");
const auth2 = getAuth(app2);

const root = document.getElementById("app");
const DAY = 86400000;
const PLANS_LABEL = { basic: "أساسية", pro: "متقدمة", premium: "خاصة" };

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const monthStart = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-01`; };
const monthEnd = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-31`; };
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const endOfDay = s => { const d = parseYmd(s); d.setHours(23, 59, 59, 0); return d; };
const plusDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const fmtDate = d => d ? d.toLocaleDateString("ar-EG-u-nu-latn", { year: "numeric", month: "long", day: "numeric" }) : "—";
const fmtTime = d => d ? d.toLocaleTimeString("ar-EG-u-nu-latn", { hour: "2-digit", minute: "2-digit" }) : "";
const toDate = t => (t && typeof t.toDate === "function") ? t.toDate() : null;
const money = n => (Number(n) || 0).toLocaleString("en-US") + " ج";
const sum = (arr, k = "amount") => arr.reduce((a, x) => a + (Number(x[k]) || 0), 0);
const num = v => { const n = parseFloat(String(v).replace(/[^\d.]/g, "")); return isNaN(n) ? 0 : n; };

const withTimeout = (p, ms = 15000) => Promise.race([
  p, new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), ms))
]);

function errText(e) {
  const code = e?.code || "";
  const map = {
    "auth/invalid-credential": "الإيميل أو كلمة المرور غير صحيحة.",
    "auth/invalid-email": "صيغة الإيميل غير صحيحة.",
    "auth/user-not-found": "لا يوجد حساب بهذا الإيميل.",
    "auth/wrong-password": "كلمة المرور غير صحيحة.",
    "auth/too-many-requests": "محاولات كثيرة. انتظر قليلًا ثم حاول مرة أخرى.",
    "auth/network-request-failed": "لا يوجد اتصال بالإنترنت.",
    "auth/email-already-in-use": "هذا الإيميل مستخدم بالفعل. استخدم إيميلًا آخر.",
    "auth/weak-password": "كلمة المرور ضعيفة. استخدم 6 أحرف أو أرقام على الأقل.",
    "auth/unauthorized-domain": "هذا الرابط غير مضاف في Firebase. أضفه من Authentication ← Settings ← Authorized domains.",
    "permission-denied": "ليس لديك صلاحية لهذه العملية. راجع قواعد الأمان.",
    "unavailable": "تعذر الاتصال بقاعدة البيانات. حاول مرة أخرى.",
    "timeout": "الاتصال بطيء أو منقطع. تأكد من الإنترنت ثم أعد المحاولة."
  };
  return map[code] || `تعذر إتمام العملية (${code || e?.message || "خطأ غير معروف"}).`;
}

function toast(text) {
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role", "status"); t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

const logoSvg = `
<svg viewBox="0 0 64 32" fill="currentColor" aria-hidden="true">
  <rect x="2" y="9" width="5" height="14" rx="1.5"/>
  <rect x="9" y="4" width="6" height="24" rx="2"/>
  <rect x="15" y="14" width="34" height="4" rx="2"/>
  <rect x="49" y="4" width="6" height="24" rx="2"/>
  <rect x="57" y="9" width="5" height="14" rx="1.5"/>
</svg>`;

/* ---------- Login / blocked ---------- */
function viewLogin(message = "") {
  root.innerHTML = `
  <div class="wrap login">
    <div class="mark">${logoSvg}<b>GymPro</b></div>
    <p class="lead">سجّل الدخول لإدارة الجيم.</p>
    ${message ? `<p class="msg err" role="alert">${esc(message)}</p>` : ""}
    <form class="panel" id="loginForm" novalidate>
      <div class="field">
        <label for="email">الإيميل</label>
        <input id="email" type="email" dir="ltr" autocomplete="username" inputmode="email" required>
      </div>
      <div class="field">
        <label for="pass">كلمة المرور</label>
        <input id="pass" type="password" dir="ltr" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit" id="loginBtn">دخول</button>
      <button class="linkbtn" type="button" id="resetBtn">نسيت كلمة المرور؟</button>
    </form>
  </div>`;

  $("#loginForm").addEventListener("submit", async ev => {
    ev.preventDefault();
    const email = $("#email").value.trim();
    const pass = $("#pass").value;
    if (!email || !pass) return viewLogin("اكتب الإيميل وكلمة المرور.");
    const btn = $("#loginBtn");
    btn.disabled = true; btn.textContent = "جاري الدخول…";
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (e) {
      viewLogin(errText(e));
      $("#email").value = email;
    }
  });

  $("#resetBtn").addEventListener("click", async () => {
    const email = $("#email").value.trim();
    if (!email) return viewLogin("اكتب إيميلك أولًا ثم اضغط «نسيت كلمة المرور».");
    try {
      await sendPasswordResetEmail(auth, email);
      viewLogin("");
      $(".lead").insertAdjacentHTML("afterend",
        `<p class="msg ok" role="status">أرسلنا رابط إعادة تعيين كلمة المرور إلى ${esc(email)}.</p>`);
    } catch (e) {
      viewLogin(errText(e));
    }
  });
}

function viewBlocked(title, text, retry = false) {
  root.innerHTML = `
  <div class="wrap login">
    <div class="mark">${logoSvg}<b>GymPro</b></div>
    <div class="panel">
      <h1 style="margin:0 0 8px;font-size:20px">${esc(title)}</h1>
      <p style="margin:0 0 20px;color:var(--muted)">${esc(text)}</p>
      ${retry ? `<button class="btn" id="retryBtn" style="margin-bottom:10px">إعادة المحاولة</button>` : ""}
      <button class="btn ghost" id="outBtn">تسجيل الخروج</button>
    </div>
  </div>`;
  $("#outBtn").addEventListener("click", () => signOut(auth));
  const rb = $("#retryBtn"); if (rb) rb.addEventListener("click", () => location.reload());
}

/* =====================================================================
   OWNER APP
   ===================================================================== */
const S = { tab: "home", sub: null, filter: "all", q: "" };
let G = null;           // { uid, profile, gymId, gym }
let MEMBERS = [];
let PLANS = [];
let RT = 0;             // render token لمنع تحديث شاشة قديمة
let scanner = null;

const col = name => collection(db, "gyms", G.gymId, name);
const ref = (name, id) => doc(db, "gyms", G.gymId, name, id);

async function loadMembers() {
  const snap = await getDocs(col("members"));
  MEMBERS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function loadPlans() {
  const snap = await getDocs(col("plans"));
  PLANS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  PLANS.sort((a, b) => (a.days || 0) - (b.days || 0));
}

function memberState(m) {
  const end = toDate(m.endDate);
  if (!end) return { key: "none", label: "بدون اشتراك", left: null, end: null };
  const left = Math.ceil((end.getTime() - Date.now()) / DAY);
  if (end.getTime() < Date.now()) return { key: "expired", label: "منتهي", left: 0, end };
  if (left <= 7) return { key: "soon", label: "ينتهي قريبًا", left, end };
  return { key: "active", label: "نشط", left, end };
}
const leftText = st => st.end
  ? (st.key === "expired" ? `انتهى ${fmtDate(st.end)}` : (st.left <= 1 ? "ينتهي اليوم" : `متبقي ${st.left} يوم`))
  : "لم يشترك بعد";

function waPhone(p) {
  let d = String(p || "").replace(/\D/g, "");
  if (d.startsWith("00")) d = d.slice(2);
  if (d.startsWith("0")) d = "20" + d.slice(1);
  return d;
}
function waLink(m, text) {
  return `https://wa.me/${waPhone(m.phone)}?text=${encodeURIComponent(text)}`;
}
function reminderText(m) {
  const st = memberState(m);
  const gname = G.gym.name || "الجيم";
  if (st.key === "expired") return `أهلًا ${m.name}، انتهى اشتراكك في ${gname} بتاريخ ${fmtDate(st.end)}. نتشرف بتجديدك.`;
  if (st.end) return `أهلًا ${m.name}، اشتراكك في ${gname} ينتهي بتاريخ ${fmtDate(st.end)}. نتشرف بتجديدك.`;
  return `أهلًا ${m.name}، معك ${gname}.`;
}
const normPhone = p => String(p || "").replace(/\D/g, "").slice(-10);

function findMember(raw) {
  const d = String(raw || "").trim().replace(/\D/g, "");
  if (!d) return null;
  if (d.length <= 6) return MEMBERS.find(m => String(m.code) === d) || null;
  const n = d.slice(-10);
  return MEMBERS.find(m => normPhone(m.phone) === n) || null;
}

function stopScanner() {
  if (scanner) {
    const s = scanner; scanner = null;
    s.stop().then(() => s.clear()).catch(() => {});
  }
}

function nav(tab, sub = null) {
  stopScanner();
  if (tab) S.tab = tab;
  S.sub = sub;
  renderOwner();
  window.scrollTo(0, 0);
}

function renderOwner() {
  RT++;
  const tok = RT;
  const tabs = [["home", "الرئيسية"], ["members", "الأعضاء"], ["checkin", "الحضور"], ["money", "المالية"], ["settings", "الإعدادات"]];
  const end = toDate(G.gym.subscriptionEnd);
  root.innerHTML = `
  <div class="shell">
    <header class="oh"><div class="in">
      <div><div class="gname">${esc(G.gym.name || "الجيم")}</div>
      <div class="gsub">${esc(G.profile.name || "")}</div></div>
      <div class="gsub">${end ? "اشتراك الجيم حتى " + fmtDate(end) : ""}</div>
    </div></header>
    <main id="main" class="wrap"></main>
    <nav class="tabs" aria-label="التنقل">

    const q = S.q.trim().toLowerCase();

    let list = MEMBERS.filter(m => {
      if (!q) return true;
      return (m.name || "").toLowerCase().includes(q) || (digits && (String(m.code) === digits || normPhone(m.phone).includes(digits.slice(-10)) || String(m.phone || "").includes(digits)));
    });
    list = list.filter(m => {
      const st = memberState(m);
      if (S.filter === "active") return st.key === "active" || st.key === "soon";
      if (S.filter === "soon") return st.key === "soon";
      if (S.filter === "expired") return st.key === "expired";
      if (S.filter === "owing") return Number(m.balance) > 0;
      return true;
    });
    list.sort((a, b) => (a.name || "").localeCompare(b.name || "", "ar"));
    $("#mList").innerHTML = list.length
      ? list.slice(0, 100).map(m => memberRowHtml(m)).join("") + (list.length > 100 ? `<div class="empty">يظهر أول 100 نتيجة. استخدم البحث.</div>` : "")
      : `<div class="empty">${MEMBERS.length ? "لا توجد نتائج." : "لا يوجد أعضاء بعد. اضغط «عضو جديد» لإضافة أول عضو."}</div>`;

}

/* ---------- Plan fields (shared by new member / renew) ---------- */
function planFieldsHtml(defaultStart) {
  if (!PLANS.length) {
    return `<p class="msg err">لا توجد باقات اشتراك. أضف باقة من تبويب «الإعدادات» أولًا.</p>`;
  }
  return `
  <div class="field">
    <label for="pf-plan">الباقة</label>
    <select id="pf-plan">${PLANS.map(p => `<option value="${esc(p.id)}">${esc(p.name)} — ${p.days} يوم — ${money(p.price)}</option>`).join("")}</select>
  </div>
  <div class="field">
    <label for="pf-start">تاريخ بداية الاشتراك</label>
    <input id="pf-start" type="date" dir="ltr" value="${esc(defaultStart)}">
  </div>
  <div class="two">
    <div class="field">
      <label for="pf-price">السعر</label>
      <input id="pf-price" type="number" inputmode="decimal" min="0" dir="ltr">
    </div>
    <div class="field">
      <label for="pf-paid">المدفوع الآن</label>
      <input id="pf-paid" type="number" inputmode="decimal" min="0" dir="ltr">
    </div>
  </div>
  <p class="hint" id="pf-rem"></p>`;
}
function wirePlanFields(box) {
  const sel = $("#pf-plan", box); if (!sel) return;
  const price = $("#pf-price", box), paid = $("#pf-paid", box), rem = $("#pf-rem", box);
  const upd = () => {
    const r = num(price.value) - num(paid.value);
    rem.textContent = r > 0 ? `المتبقي على العضو: ${money(r)}` : (r < 0 ? "المدفوع أكبر من السعر." : "مدفوع بالكامل.");
  };
  const fill = () => {
    const p = PLANS.find(x => x.id === sel.value);
    price.value = p ? p.price : 0;
    paid.value = p ? p.price : 0;
    upd();
  };
  sel.addEventListener("change", fill);
  price.addEventListener("input", upd);
  paid.addEventListener("input", upd);
  fill();
}
function readPlanFields(box) {
  const plan = PLANS.find(x => x.id === $("#pf-plan", box)?.value);
  const start = $("#pf-start", box)?.value;
  const price = num($("#pf-price", box)?.value);
  const paid = num($("#pf-paid", box)?.value);
  if (!plan) throw new Error("اختر باقة.");
  if (!start) throw new Error("اختر تاريخ البداية.");
  if (paid > price) throw new Error("المدفوع أكبر من السعر.");
  const endStr = plusDays(start, Number(plan.days) || 0);
  return { plan, start, price, paid, end: endOfDay(endStr) };
}

/* ---------- New member ---------- */
function subNewMember(main) {
  main.innerHTML = `
  <button class="btn ghost back" id="back">رجوع</button>
  <h2>عضو جديد</h2>
  <div id="fmsg"></div>
  <form class="panel" id="mform" novalidate>
    <div class="field"><label for="mname">الاسم</label><input id="mname" autocomplete="off" required></div>
    <div class="field"><label for="mphone">رقم الموبايل</label><input id="mphone" type="tel" dir="ltr" inputmode="tel" autocomplete="off"></div>
    ${planFieldsHtml(todayStr())}
    <button class="btn" type="submit" id="msave" ${PLANS.length ? "" : "disabled"}>حفظ العضو</button>
  </form>`;
  $("#back").addEventListener("click", () => nav("members", null));
  wirePlanFields(main);

  $("#mform").addEventListener("submit", async ev => {
    ev.preventDefault();
    const msg = t => { $("#fmsg").innerHTML = t ? `<p class="msg err" role="alert">${esc(t)}</p>` : ""; };
    const name = $("#mname").value.trim();
    const phone = $("#mphone").value.trim();
    if (!name) return msg("اكتب اسم العضو.");
    if (phone && MEMBERS.some(m => normPhone(m.phone) === normPhone(phone))) {
      if (!confirm("هذا الرقم مسجل لعضو آخر. هل تريد المتابعة؟")) return;
    }
    let f;
    try { f = readPlanFields(main); } catch (e) { return msg(e.message); }
    const btn = $("#msave"); btn.disabled = true; btn.textContent = "جاري الحفظ…";
    msg("");
    try {
      const counterRef = ref("meta", "counters");
      const memberRef = doc(col("members"));
      const subRef = doc(col("subscriptions"));
      const payRef = doc(col("payments"));
      let code = "";
      await runTransaction(db, async tx => {
        const c = await tx.get(counterRef);
        const next = (c.exists() && c.data().member ? c.data().member : 1000) + 1;
        code = String(next);
        tx.set(counterRef, { member: next }, { merge: true });
        tx.set(memberRef, {
          name, phone, code, planId: f.plan.id, planName: f.plan.name,
          endDate: Timestamp.fromDate(f.end), balance: f.price - f.paid,
          createdAt: serverTimestamp()
        });
        tx.set(subRef, {
          memberId: memberRef.id, memberName: name, planId: f.plan.id, planName: f.plan.name,
          start: f.start, end: ymd(f.end), price: f.price, paid: f.paid, remaining: f.price - f.paid,
          createdAt: serverTimestamp(), by: G.uid
        });
        if (f.paid > 0) {
          tx.set(payRef, {
            memberId: memberRef.id, memberName: name, amount: f.paid, date: todayStr(),
            type: "subscription", note: f.plan.name, ts: serverTimestamp(), by: G.uid
          });
        }
      });
      MEMBERS.push({
        id: memberRef.id, name, phone, code, planId: f.plan.id, planName: f.plan.name,
        endDate: Timestamp.fromDate(f.end), balance: f.price - f.paid
      });
      toast(`تم حفظ ${name} — كود ${code}`);
      nav("members", { type: "member", id: memberRef.id });
    } catch (e) {
      msg(errText(e));
      btn.disabled = false; btn.textContent = "حفظ العضو";
    }
  });
}

        endDate: Timestamp.fromDate(f.end), balance: increment(f.price - f.paid)
      });
      if (f.paid > 0) {
        batch.set(doc(col("payments")), {
          memberId: m.id, memberName: m.name, amount: f.paid, date: todayStr(),
          type: "subscription", note: f.plan.name, ts: serverTimestamp(), by: G.uid
        });
      }
      await batch.commit();
      m.planId = f.plan.id; m.planName = f.plan.name;
      m.endDate = Timestamp.fromDate(f.end);
      m.balance = Number(m.balance || 0) + (f.price - f.paid);
      toast("تم تجديد الاشتراك");
      nav(null, { type: "member", id: m.id });
    } catch (e) {
      msg(errText(e));
      btn.disabled = false; btn.textContent = "تأكيد التجديد";
    }
  });
}

async function startScan() {
  if (scanner) return stopScanner();
  const box = $("#result");
  try {
    const mod = await import("https://esm.sh/html5-qrcode@2.3.8");
    const Html5Qrcode = mod.Html5Qrcode || mod.default?.Html5Qrcode;
    const s = new Html5Qrcode("reader");
    scanner = s;
    await s.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      text => { stopScanner(); doCheckin(text); },
      () => {}
    );
  } catch (e) {
    scanner = null;
    box.innerHTML = `<p class="msg err">تعذر تشغيل الكاميرا. اسمح للمتصفح باستخدامها أو اكتب الكود يدويًا.</p>`;

async function loadToday(tok) {
  const list = $("#todayList");
  if (!list) return;
  try {
    const snap = await getDocs(query(col("attendance"), where("date", "==", todayStr())));
    if (tok !== RT) return;
    const rows = snap.docs.map(d => d.data()).sort((a, b) => (toDate(b.ts)?.getTime() || 0) - (toDate(a.ts)?.getTime() || 0));
    list.innerHTML = rows.length
      ? rows.map(r => `<div class="row"><div class="name">${esc(r.memberName)}</div><div class="meta">كود ${esc(r.code)} · ${fmtTime(toDate(r.ts))}</div></div>`).join("")
      : `<div class="empty">لم يسجل أحد حضوره اليوم.</div>`;
  } catch (e) {
    if (tok === RT) list.innerHTML = `<div class="empty">${esc(errText(e))}</div>`;
  }
}

    : `<div class="empty">لا توجد مصروفات هذا الشهر.</div>`}</div>
  <h2>دفعات الشهر</h2>

    <div class="row"><div class="name">${esc(p.memberName || "")} — ${money(p.amount)}</div>

    : `<div class="empty">لا توجد دفعات هذا الشهر.</div>`}</div>`;

  $("#xform").addEventListener("submit", async ev => {

function setFormMsg(text, kind = "err") {
  const box = $("#formMsg");
  box.innerHTML = text ? `<p class="msg ${kind}" role="${kind === "err" ? "alert" : "status"}">${esc(text)}</p>` : "";
}

async function onCreateGym(ev) {
  ev.preventDefault();
  const gName = $("#gName").value.trim();
  const oName = $("#oName").value.trim();
  const oEmail = $("#oEmail").value.trim();
  const oPass = $("#oPass").value;
  const plan = $("#gPlan").value;
  const months = Math.max(1, Math.min(36, parseInt($("#gMonths").value, 10) || 1));

  if (!gName || !oName || !oEmail || !oPass) return setFormMsg("أكمل كل الخانات.");
  if (oPass.length < 6) return setFormMsg("كلمة المرور لازم تكون 6 أحرف أو أرقام على الأقل.");

  const btn = $("#gymBtn");
  btn.disabled = true; btn.textContent = "جاري الإنشاء…";
  setFormMsg("");

  let uid = null;
  try {
    const cred = await createUserWithEmailAndPassword(auth2, oEmail, oPass);
    uid = cred.user.uid;
    await signOut(auth2);

    const gymRef = doc(collection(db, "gyms"));
    await setDoc(doc(db, "users", uid), {
      name: oName, email: oEmail, role: "owner", active: true, gymId: gymRef.id,
      createdAt: serverTimestamp()
    });
    await setDoc(gymRef, {
      name: gName, plan, status: "active",
      ownerUid: uid, ownerName: oName, ownerEmail: oEmail,
      subscriptionEnd: Timestamp.fromDate(new Date(Date.now() + months * 30 * DAY)),
      createdAt: serverTimestamp()
    });

    $("#gymForm").reset();
    $("#gMonths").value = 1;
    setFormMsg(`تم إنشاء «${gName}». يدخل المدير بالإيميل ${oEmail}.`, "ok");
    loadGyms();
  } catch (e) {
    let t = errText(e);
    if (uid) t += " تم إنشاء حساب المدير لكن لم يكتمل ربطه بالجيم. أرسل لي الرسالة دي وأصلحها.";
    setFormMsg(t);
  } finally {
    btn.disabled = false; btn.textContent = "إنشاء الجيم";
  }
}

async function loadGyms() {
  const box = $("#gymList");
  if (!box) return;
  try {
    const snap = await getDocs(collection(db, "gyms"));
    const gyms = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    gyms.sort((a, b) => (toDate(b.createdAt)?.getTime() || 0) - (toDate(a.createdAt)?.getTime() || 0));

    if (!gyms.length) {
      box.innerHTML = `<div class="rows"><div class="empty">لا توجد جيمات بعد. أضف أول جيم من النموذج أعلاه.</div></div>`;
      return;
    }

    box.innerHTML = `<div class="rows">${gyms.map(g => {
      const end = toDate(g.subscriptionEnd);
      const expired = end && end.getTime() < Date.now();
      const status = g.status === "suspended" ? "suspended" : (expired ? "expired" : "active");
      const label = { active: "نشط", suspended: "موقوف", expired: "منتهي" }[status];
      return `
      <div class="row" data-id="${esc(g.id)}">
        <div class="name">${esc(g.name || g.id)}<span class="tag ${status}">${label}</span></div>
        <div class="meta">${esc(PLANS_LABEL[g.plan] || g.plan || "—")} · ينتهي ${fmtDate(end)}</div>
        <div class="meta">${esc(g.ownerName || "")} ${g.ownerEmail ? "— " + esc(g.ownerEmail) : ""}</div>
        <div class="acts">
          <button class="btn ghost" data-act="extend">تمديد 30 يوم</button>
          <button class="btn ghost" data-act="toggle">${g.status === "suspended" ? "تفعيل" : "إيقاف"}</button>
        </div>
      </div>`;
    }).join("")}</div>`;

    $$("button[data-act]", box).forEach(b => {
      b.addEventListener("click", async () => {
        const id = b.closest(".row").dataset.id;
        const g = gyms.find(x => x.id === id);
        b.disabled = true;
        try {
          if (b.dataset.act === "toggle") {
            await updateDoc(doc(db, "gyms", id), { status: g.status === "suspended" ? "active" : "suspended" });
          } else {
            const cur = toDate(g.subscriptionEnd);
            const base = cur && cur.getTime() > Date.now() ? cur.getTime() : Date.now();
            await updateDoc(doc(db, "gyms", id), { subscriptionEnd: Timestamp.fromDate(new Date(base + 30 * DAY)) });
          }
          loadGyms();
        } catch (e) {
          b.disabled = false;
          setFormMsg(errText(e));
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });
    });
  } catch (e) {
    box.innerHTML = `<div class="rows"><div class="empty">${esc(errText(e))}</div></div>`;
  }
}

/* ---------- Session routing ---------- */
onAuthStateChanged(auth, async user => {
  stopScanner();
  if (!user) { G = null; return viewLogin(); }
  root.innerHTML = `<div class="loading">جاري التحميل…</div>`;
  try {
    const uSnap = await withTimeout(getDoc(doc(db, "users", user.uid)));
    if (!uSnap.exists()) {
      return viewBlocked("الحساب غير مربوط", "هذا الحساب غير مربوط بأي جيم. تواصل مع إدارة GymPro.");
    }
    const profile = uSnap.data();
    if (profile.active !== true) {
      return viewBlocked("الحساب موقوف", "تم إيقاف هذا الحساب. تواصل مع إدارة الجيم.");
    }
    if (profile.role === "superadmin") return viewAdmin(profile);

    const gSnap = await withTimeout(getDoc(doc(db, "gyms", profile.gymId)));
    if (!gSnap.exists()) {
      return viewBlocked("الجيم غير موجود", "لم نجد بيانات الجيم المرتبط بحسابك.");
    }
    const gym = gSnap.data();
    const end = toDate(gym.subscriptionEnd);
    if (gym.status === "suspended") {
      return viewBlocked("الجيم موقوف", "تم إيقاف اشتراك هذا الجيم. تواصل مع إدارة GymPro.");
    }
    if (end && end.getTime() < Date.now()) {
      return viewBlocked("انتهى اشتراك الجيم", "انتهى اشتراك الجيم في GymPro. جدّد الاشتراك للاستمرار.");
    }
    await startOwner(user.uid, profile, gym, profile.gymId);
  } catch (e) {
    viewBlocked("تعذر تحميل الحساب", errText(e), true);
  }
});
</script>
