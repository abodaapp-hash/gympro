<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GymPro — نظام إدارة الجيم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #273549;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #10b981;
      --primary-dark: #059669;
      --danger: #ef4444;
      --warn: #f59e0b;
      --info: #3b82f6;
      --radius: 14px;
      --nav-h: 68px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: calc(var(--nav-h) + 20px);
      min-height: 100vh;
    }

    /* Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.1rem; }
    .brand-badge {
      background: var(--primary);
      color: #052e16;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 800;
    }
    .gym-title { font-size: 0.85rem; color: var(--muted); }

    /* Container */
    main { max-width: 760px; margin: 0 auto; padding: 16px; }
    h2 {
      font-size: 1.05rem;
      margin: 18px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }
    h2:first-child { margin-top: 4px; }

    /* Panels & Forms */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
    }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
    input, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 12px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--primary); }

    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: var(--primary);
      color: #052e16;
      border: none;
      border-radius: 10px;
      padding: 11px 14px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      width: 100%;
    }
    .btn:active { transform: scale(0.98); }
    .btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .btn.danger { background: rgba(239, 68, 68, 0.16); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); }
    .btn.sm { padding: 7px 11px; font-size: 0.82rem; width: auto; }

    /* Check-in Result Card */
    #reader { border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
    .result {
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
    }
    .result.ok { border-color: var(--primary); background: rgba(16, 185, 129, 0.1); }
    .result.warn { border-color: var(--warn); background: rgba(245, 158, 11, 0.12); }
    .result.bad { border-color: var(--danger); background: rgba(239, 68, 68, 0.12); }
    .res-row { display: flex; align-items: center; gap: 12px; }
    .avatar-lg {
      width: 54px; height: 54px; border-radius: 50%;
      background: var(--surface-2); display: grid; place-items: center;
      font-weight: 800; font-size: 1.2rem; color: var(--primary); overflow: hidden; flex-shrink: 0;
    }
    .avatar-lg img { width: 100%; height: 100%; object-fit: cover; }
    .rt { font-weight: 800; font-size: 0.95rem; display: flex; align-items: center; gap: 6px; }
    .rn { font-weight: 700; font-size: 1.05rem; margin: 2px 0; }
    .res-line { font-size: 0.83rem; color: var(--muted); }
    .status-chip {
      display: inline-block; margin-top: 6px; padding: 2px 10px;
      border-radius: 99px; font-size: 0.75rem; font-weight: 700;
    }
    .chip-ok { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    .chip-bad { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .due { color: #fca5a5; font-size: 0.85rem; font-weight: 700; }
    .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

    /* Rows / Lists */
    .rows { display: flex; flex-direction: column; gap: 8px; }
    .row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .row .name { font-weight: 700; font-size: 0.94rem; }
    .row .meta { font-size: 0.8rem; color: var(--muted); }
    .empty {
      text-align: center; color: var(--muted); padding: 22px;
      background: var(--surface); border-radius: 12px; border: 1px dashed var(--border); font-size: 0.9rem;
    }
    .msg.err { color: #fca5a5; background: rgba(239, 68, 68, 0.12); padding: 10px 12px; border-radius: 10px; font-size: 0.88rem; }

    /* ================= FINANCIAL DASHBOARD ================= */
    .fin-filter {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .fin-tab {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 9px 6px;
      border-radius: 10px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .fin-tab.active {
      background: var(--primary);
      color: #052e16;
      border-color: var(--primary);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      position: relative;
      overflow: hidden;
    }
    .kpi-card.net {
      grid-column: span 2;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.18), rgba(30, 41, 59, 0.95));
      border-color: rgba(16, 185, 129, 0.45);
    }
    .kpi-label { font-size: 0.8rem; color: var(--muted); font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
    .kpi-val { font-size: 1.35rem; font-weight: 800; margin-top: 6px; letter-spacing: 0.2px; }
    .kpi-val.in { color: #34d399; }
    .kpi-val.out { color: #f87171; }
    .kpi-val.due-c { color: #fbbf24; }
    .kpi-sub { font-size: 0.76rem; color: var(--muted); margin-top: 4px; }

    .breakdown-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
    }
    .bd-item { margin-bottom: 11px; }
    .bd-item:last-child { margin-bottom: 0; }
    .bd-head { display: flex; justify-content: space-between; font-size: 0.84rem; margin-bottom: 5px; font-weight: 600; }
    .bar-track { width: 100%; height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; transition: width 0.35s ease; }

    .badge-in { background: rgba(16, 185, 129, 0.18); color: #6ee7b7; padding: 3px 9px; border-radius: 8px; font-weight: 700; font-size: 0.82rem; }
    .badge-out { background: rgba(239, 68, 68, 0.18); color: #fca5a5; padding: 3px 9px; border-radius: 8px; font-weight: 700; font-size: 0.82rem; }

    /* ================= FIXED BOTTOM BAR (NO SCROLL) ================= */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--nav-h);
      background: rgba(15, 23, 42, 0.97);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* 4 أيقونات ثابتة بدون تمرير */
      align-items: center;
      z-index: 50;
      padding: 4px 6px;
    }
    .nav-item {
      background: transparent;
      border: none;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 100%;
      width: 100%;
      padding: 4px 2px;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 10px;
      overflow: hidden;
      white-space: nowrap;
    }
    .nav-item svg { width: 22px; height: 22px; flex-shrink: 0; }
    .nav-item.active {
      color: var(--primary);
      background: rgba(16, 185, 129, 0.12);
    }

    /* Login Screen */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card { width: 100%; max-width: 400px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <div id="loginView" class="login-wrap">
    <div class="panel login-card">
      <div class="brand" style="justify-content:center; margin-bottom:14px; font-size:1.3rem;">
        <span>GymPro</span>
        <span class="brand-badge">إدارة الجيم</span>
      </div>
      <form id="loginForm">
        <div class="field">
          <label>البريد الإلكتروني</label>
          <input type="email" id="loginEmail" dir="ltr" required placeholder="owner@gym.com">
        </div>
        <div class="field">
          <label>كلمة المرور</label>
          <input type="password" id="loginPass" dir="ltr" required placeholder="••••••••">
        </div>
        <button class="btn" type="submit" id="loginBtn">تسجيل الدخول</button>
        <p id="loginErr" class="msg err hidden" style="margin-top:10px;"></p>
      </form>
    </div>
  </div>

  <!-- التطبيق الرئيسي -->
  <div id="appView" class="hidden">
    <header class="topbar">
      <div class="brand">
        <span>GymPro</span>
        <span class="brand-badge" id="roleBadge">مدير</span>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="gym-title" id="gymNameDisplay">جاري التحميل...</span>
        <button class="btn ghost sm" id="logoutBtn">خروج</button>
      </div>
    </header>

    <main id="mainContent"></main>

    <!-- شريط الأيقونات السفلي الثابت (4 أيقونات كاملة بدون تحرك) -->
    <nav class="bottom-nav" aria-label="التنقل الرئيسي">
      <button class="nav-item active" data-tab="checkin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zm4 4h3v3h-3zm0-4h3v3h-3z"/></svg>
        <span>الحضور</span>
      </button>
      <button class="nav-item" data-tab="members">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>الأعضاء</span>
      </button>
      <button class="nav-item" data-tab="finance">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span>المالية</span>
      </button>
      <button class="nav-item" data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>الإعدادات</span>
      </button>
    </nav>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, getDocs, addDoc, setDoc, updateDoc, deleteDoc,
      collection, query, where, orderBy, limit, writeBatch, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ⚠️ ضع هنا بيانات تطبيق الويب من Firebase Console للمشروع gympro-86c9a
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "gympro-86c9a.firebaseapp.com",
      projectId: "gympro-86c9a",
      storageBucket: "gympro-86c9a.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // الحالة العامة للتطبيق
    let G = { uid: "", gymId: "", role: "", name: "", gymName: "" };
    let MEMBERS = [];
    const PHOTOS = new Map();
    let RT = 0;
    let scanner = null;
    let finPeriod = "month"; // today | month | all

    const $ = (s, p = document) => p.querySelector(s);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    const col = name => collection(db, "gyms", G.gymId, name);
    const ref = (name, id) => doc(db, "gyms", G.gymId, name, id);
    const money = n => `${Number(n || 0).toLocaleString("ar-EG")} ج.م`;

    const arabicDigitsToEn = s => String(s || "").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
    const normPhone = p => {
      const d = arabicDigitsToEn(p).replace(/\D/g, "");
      return d.startsWith("20") && d.length === 12 ? "0" + d.slice(2) : d;
    };

    const toDate = v => !v ? null : (typeof v.toDate === "function" ? v.toDate() : (v instanceof Date ? v : new Date(v)));
    const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const todayStr = () => ymd(new Date());
    const fmtTime = d => d ? d.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" }) : "";
    const fmtDateTime = d => d ? d.toLocaleString("ar-EG", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";

    const Sound = {
      ctx: null,
      unlock() { if (!this.ctx && window.AudioContext) this.ctx = new AudioContext(); },
      beep(freq, dur) {
        try {
          this.unlock();
          if (!this.ctx) return;
          const o = this.ctx.createOscillator(), g = this.ctx.createGain();
          o.frequency.value = freq; o.connect(g); g.connect(this.ctx.destination);
          o.start(); g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
          o.stop(this.ctx.currentTime + dur);
        } catch {}
      },
      ok() { this.beep(880, 0.16); },
      warn() { this.beep(520, 0.22); },
      bad() { this.beep(220, 0.35); }
    };

    const ico = (name) => {
      const icons = {
        qr: "📷", check: "✓", camera: "🎥", users: "👥", alert: "⚠️",
        xCircle: "⛔", refresh: "🔄", whatsapp: "💬", checkCircle: "✅"
      };
      return icons[name] || "";
    };

    function errText(e) {
      if (!e) return "حدث خطأ غير متوقع";
      if (e.code === "permission-denied") return "ليس لديك صلاحية تنفيذ هذه العملية أو اشتراك الجيم منتهي.";
      return e.message || String(e);
    }

    function calcMemberState(m) {
      const end = toDate(m.endDate);
      if (!end) return { key: "none", daysLeft: 0 };
      const diff = Math.ceil((end.setHours(23,59,59,999) - Date.now()) / 86400000);
      if (diff < 0) return { key: "expired", daysLeft: 0 };
      if (diff <= 3) return { key: "soon", daysLeft: diff };
      return { key: "active", daysLeft: diff };
    }

    const sessionsText = m => (m.sessionsLeft != null && m.sessionsLeft !== "") ? `متبقي ${m.sessionsLeft} حصة` : "اشتراك مفتوح";
    const fmtLeftText = st => st.key === "expired" ? "منتهي" : st.key === "none" ? "بدون اشتراك" : `باقي ${st.daysLeft} يوم`;
    const avatarHtml = (name, photo) => `<div class="avatar-lg">${photo ? `<img src="${esc(photo)}" alt="">` : esc((name || "؟").slice(0, 1))}</div>`;
    const waRawLink = (phone, text) => `https://wa.me/2${normPhone(phone)}?text=${encodeURIComponent(text)}`;
    const reminderText = m => `مرحباً كابتن ${m.name}، نذكرك بتجديد اشتراكك في الجيم.`;
    async function getMemberPhoto() { return ""; }

    function stopScanner() {
      if (scanner) {
        scanner.stop().catch(() => {});
        scanner = null;
      }
    }

    async function loadMembersCache() {
      const snap = await getDocs(col("members"));
      MEMBERS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }

    // ================= 1. شاشة تسجيل الحضور =================
    function findMemberFromScan(raw) {
      const txt = String(raw || "").trim();
      if (!txt) return null;
      if (txt.startsWith("GYMPRO|")) {
        const codePart = txt.split("|")[2] || "";
        return MEMBERS.find(m => String(m.code) === codePart || m.id === codePart) || null;
      }
      const d = arabicDigitsToEn(txt).replace(/\D/g, "");
      if (!d) return null;
      if (d.length <= 6) return MEMBERS.find(m => String(m.code) === d) || null;
      const n = normPhone(d);
      return MEMBERS.find(m => normPhone(m.phone) === n) || null;
    }

    function screenCheckin(main, tok) {
      main.innerHTML = `
      <h2>${ico("qr")} تسجيل الحضور (كاميرا / كود)</h2>
      <form class="panel" id="cform" novalidate>
        <div class="field">
          <label for="ccode">كود العضو أو رقم الموبايل</label>
          <input id="ccode" dir="ltr" autocomplete="off" inputmode="numeric" placeholder="مثال: 1001 أو 010xxxxxxxx">
        </div>
        <div class="two">
          <button class="btn" type="submit">${ico("check")} تسجيل</button>
          <button class="btn ghost" type="button" id="scanBtn" style="width:100%">${ico("camera")} مسح بالكاميرا</button>
        </div>
      </form>
      <div id="reader"></div>
      <div id="result"></div>
      <h2>${ico("users")} حضور اليوم</h2>
      <div class="rows" id="todayList"><div class="empty">جاري التحميل…</div></div>`;

      $("#cform").addEventListener("submit", ev => {
        ev.preventDefault();
        Sound.unlock();
        const v = $("#ccode").value; $("#ccode").value = "";
        doCheckin(v);
      });
      $("#scanBtn").addEventListener("click", startScan);
      loadToday(tok);
    }

    let scanBusy = false;
    async function startScan() {
      const btn = $("#scanBtn");
      if (scanner) {
        stopScanner();
        if (btn) btn.innerHTML = `${ico("camera")} مسح بالكاميرا`;
        return;
      }
      Sound.unlock();
      const box = $("#result");
      try {
        const mod = await import("https://esm.sh/html5-qrcode@2.3.8");
        const H = mod.Html5Qrcode || (mod.default && mod.default.Html5Qrcode);
        const FMT = mod.Html5QrcodeSupportedFormats || (mod.default && mod.default.Html5QrcodeSupportedFormats);
        const cfg = { verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } };
        if (FMT) cfg.formatsToSupport = [FMT.QR_CODE];
        const s = new H("reader", cfg);
        scanner = s;
        if (btn) btn.innerHTML = `${ico("camera")} إيقاف الكاميرا`;
        await s.start(
          { facingMode: "environment" },
          { fps: 12, qrbox: { width: 240, height: 240 }, aspectRatio: 1 },
          text => {
            if (scanBusy) return;
            scanBusy = true;
            doCheckin(text);
            setTimeout(() => { scanBusy = false; }, 2200);
          },
          () => {}
        );
      } catch {
        scanner = null;
        if (btn) btn.innerHTML = `${ico("camera")} مسح بالكاميرا`;
        box.innerHTML = `<p class="msg err">${ico("alert")} تعذر تشغيل الكاميرا. اسمح للمتصفح باستخدامها أو اكتب الكود يدويًا.</p>`;
      }
    }

    const resultCard = (cls, m, st, title, chip, photo, extra = "") => `
      <div class="result ${cls}" data-mid="${esc(m.id)}">
        <div class="res-row">
          <div id="resAvatar">${avatarHtml(m.name, photo)}</div>
          <div class="res-info">
            <div class="rt">${title}</div>
            <div class="rn">${esc(m.name)}</div>
            <div class="res-line">${esc(sessionsText(m))} · ${esc(fmtLeftText(st))}</div>
            ${chip}
          </div>
        </div>${extra}
      </div>`;

    async function doCheckin(raw) {
      const box = $("#result");
      if (!box) return;
      const m = findMemberFromScan(raw);
      if (!m) {
        Sound.bad();
        box.innerHTML = `<div class="result bad"><div class="rt">${ico("xCircle")} غير موجود</div><div>لا يوجد عضو مطابق لهذا الكود أو الرقم.</div></div>`;
        return;
      }
      const st = calcMemberState(m);
      const photo = PHOTOS.get(m.id) || "";
      const waBtn = m.phone ? `<a class="btn ghost sm" target="_blank" rel="noopener noreferrer" href="${esc(waRawLink(m.phone, reminderText(m)))}">${ico("whatsapp")} واتساب</a>` : "";

      if (st.key === "expired" || st.key === "none") {
        Sound.bad();
        box.innerHTML = resultCard("bad", m, st,
          `${ico("xCircle")} الدخول ممنوع — ${st.key === "none" ? "لا يوجد اشتراك" : "الاشتراك منتهي"}`,
          `<span class="status-chip chip-bad">منتهي</span>`, photo,
          `<div class="acts"><button class="btn sm" id="goRenew">${ico("refresh")} تجديد الاشتراك</button>${waBtn}</div>`);
        $("#goRenew").addEventListener("click", () => nav("members"));
        return;
      }

      const last = toDate(m.lastCheckinAt);
      if (last && ymd(last) === todayStr()) {
        Sound.warn();
        box.innerHTML = resultCard("warn", m, st,
          `${ico("alert")} سُجّل حضوره اليوم بالفعل الساعة ${esc(fmtTime(last))}`,
          `<span class="status-chip chip-ok">ساري</span>`, photo);
        return;
      }

      Sound.ok();
      const curSess = Number(m.sessionsLeft);
      const nextSess = isNaN(curSess) || m.sessionsLeft == null ? null : Math.max(0, curSess - 1);
      const dueLine = Number(m.balance) > 0 ? `<div class="due" style="margin-top:8px">عليه مبلغ متبقي ${money(m.balance)}</div>` : "";
      box.innerHTML = resultCard("ok", m, st,
        `${ico("checkCircle")} مرحبًا — الدخول مسموح <span class="ck-state" id="ckState">جاري التسجيل…</span>`,
        `<span class="status-chip chip-ok">ساري</span>`, photo,
        dueLine + (st.key === "soon" ? `<div class="acts">${waBtn}</div>` : ""));

      try {
        const batch = writeBatch(db);
        batch.set(ref("attendance", `${todayStr()}_${m.id}`), {
          memberId: m.id, memberName: m.name, code: m.code || "", date: todayStr(), ts: serverTimestamp(), by: G.uid
        });
        const upd = { lastCheckinAt: serverTimestamp() };
        if (nextSess !== null) upd.sessionsLeft = nextSess;
        batch.update(ref("members", m.id), upd);
        await batch.commit();
        if (nextSess !== null) m.sessionsLeft = nextSess;
        m.lastCheckinAt = { toDate: () => new Date() };
        const s = $("#ckState"); if (s) s.textContent = "تم التسجيل";
        loadToday(RT);
      } catch (e) {
        if (e && e.code === "permission-denied") {
          m.lastCheckinAt = { toDate: () => new Date() };
          Sound.warn();
          box.innerHTML = resultCard("warn", m, st, `${ico("alert")} سُجّل حضوره اليوم بالفعل (من جهاز آخر)`, `<span class="status-chip chip-ok">ساري</span>`, photo);
        } else {
          box.innerHTML = `<p class="msg err">${esc(errText(e))}</p>`;
        }
      }
    }

    async function loadToday(tok) {
      const list = $("#todayList");
      if (!list) return;
      try {
        const snap = await getDocs(query(col("attendance"), where("date", "==", todayStr())));
        if (tok !== RT) return;
        const rows = snap.docs.map(d => d.data()).sort((a, b) => (toDate(b.ts)?.getTime() || 0) - (toDate(a.ts)?.getTime() || 0));
        list.innerHTML = rows.length
          ? rows.map(r => `<div class="row"><div class="name">${esc(r.memberName)}</div><div class="meta">كود ${esc(r.code)} · ${esc(fmtDateTime(toDate(r.ts)))}</div></div>`).join("")
          : `<div class="empty">لم يسجل أحد حضوره اليوم.</div>`;
      } catch (e) {
        if (tok === RT) list.innerHTML = `<div class="empty">${esc(errText(e))}</div>`;
      }
    }

    // ================= 2. شاشة الأعضاء =================
    function screenMembers(main) {
      main.innerHTML = `
        <h2>👥 إدارة الأعضاء (${MEMBERS.length})</h2>
        <form class="panel" id="addMemberForm">
          <div class="two">
            <div class="field"><label>اسم العضو</label><input id="mName" required placeholder="الاسم بالكامل"></div>
            <div class="field"><label>كود العضو</label><input id="mCode" dir="ltr" inputmode="numeric" placeholder="1001"></div>
          </div>
          <div class="two">
            <div class="field"><label>رقم الموبايل</label><input id="mPhone" dir="ltr" inputmode="tel" placeholder="010xxxxxxxx"></div>
            <div class="field"><label>مدة الاشتراك (يوم)</label><input id="mDays" type="number" value="30" min="1"></div>
          </div>
          <div class="two">
            <div class="field"><label>المبلغ المدفوع (ج.م)</label><input id="mPaid" type="number" value="0" min="0"></div>
            <div class="field"><label>المتبقي عليه (ج.م)</label><input id="mBal" type="number" value="0" min="0"></div>
          </div>
          <button class="btn" type="submit">+ إضافة عضو جديد وتسجيل الدفعة</button>
        </form>
        <div class="rows" id="membersList"></div>
      `;

      const renderList = () => {
        const box = $("#membersList");
        if (!MEMBERS.length) { box.innerHTML = `<div class="empty">لا يوجد أعضاء مسجلون بعد.</div>`; return; }
        box.innerHTML = MEMBERS.map(m => {
          const st = calcMemberState(m);
          return `<div class="row">
            <div>
              <div class="name">${esc(m.name)} <span style="color:var(--muted);font-size:0.8rem;">(#${esc(m.code || "-")})</span></div>
              <div class="meta">${esc(m.phone || "بدون هاتف")} · ${fmtLeftText(st)} ${Number(m.balance) > 0 ? `· متبقي ${money(m.balance)}` : ""}</div>
            </div>
            <span class="status-chip ${st.key === "expired" || st.key === "none" ? "chip-bad" : "chip-ok"}">${st.key === "expired" || st.key === "none" ? "منتهي" : "ساري"}</span>
          </div>`;
        }).join("");
      };
      renderList();

      $("#addMemberForm").addEventListener("submit", async e => {
        e.preventDefault();
        const name = $("#mName").value.trim();
        const code = $("#mCode").value.trim() || String(1000 + MEMBERS.length + 1);
        const phone = $("#mPhone").value.trim();
        const days = Math.max(1, Number($("#mDays").value || 30));
        const paid = Math.max(0, Number($("#mPaid").value || 0));
        const balance = Math.max(0, Number($("#mBal").value || 0));
        if (!name) return;

        const end = new Date();
        end.setDate(end.getDate() + days);

        try {
          const batch = writeBatch(db);
          const mRef = doc(col("members"));
          batch.set(mRef, {
            name, code, phone, balance,
            endDate: end,
            createdAt: serverTimestamp()
          });
          if (paid > 0) {
            const pRef = doc(col("payments"));
            batch.set(pRef, {
              memberId: mRef.id,
              memberName: name,
              amount: paid,
              type: "subscription",
              ts: serverTimestamp(),
              by: G.uid
            });
          }
          await batch.commit();
          await loadMembersCache();
          renderList();
          e.target.reset();
        } catch (err) {
          alert(errText(err));
        }
      });
    }

    // ================= 3. لوحة التحكم المالية (DASHBOARD) =================
    async function screenFinance(main, tok) {
      main.innerHTML = `
        <h2>📊 لوحة التحكم المالية</h2>
        <div class="fin-filter">
          <button class="fin-tab ${finPeriod === "today" ? "active" : ""}" data-p="today">اليوم</button>
          <button class="fin-tab ${finPeriod === "month" ? "active" : ""}" data-p="month">هذا الشهر</button>
          <button class="fin-tab ${finPeriod === "all" ? "active" : ""}" data-p="all">الإجمالي الكلي</button>
        </div>

        <div id="finBody"><div class="empty">جاري تحميل البيانات المالية...</div></div>
      `;

      main.querySelectorAll(".fin-tab").forEach(btn => {
        btn.addEventListener("click", () => {
          finPeriod = btn.dataset.p;
          screenFinance(main, tok);
        });
      });

      try {
        const [paySnap, expSnap] = await Promise.all([
          getDocs(col("payments")),
          getDocs(col("expenses"))
        ]);
        if (tok !== RT) return;

        const now = new Date();
        const isToday = d => d && ymd(d) === ymd(now);
        const isThisMonth = d => d && d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
        const inPeriod = d => finPeriod === "all" ? true : (finPeriod === "today" ? isToday(d) : isThisMonth(d));

        const allPayments = paySnap.docs.map(d => ({ id: d.id, ...d.data(), _d: toDate(d.data().ts || d.data().createdAt) }));
        const allExpenses = expSnap.docs.map(d => ({ id: d.id, ...d.data(), _d: toDate(d.data().ts || d.data().createdAt) }));

        const pays = allPayments.filter(x => inPeriod(x._d));
        const exps = allExpenses.filter(x => inPeriod(x._d));

        const totalIn = pays.reduce((s, x) => s + Number(x.amount || 0), 0);
        const totalOut = exps.reduce((s, x) => s + Number(x.amount || 0), 0);
        const netProfit = totalIn - totalOut;
        const totalDues = MEMBERS.reduce((s, m) => s + Math.max(0, Number(m.balance || 0)), 0);

        const subIn = pays.filter(x => x.type === "subscription").reduce((s, x) => s + Number(x.amount || 0), 0);
        const balIn = pays.filter(x => x.type === "balance").reduce((s, x) => s + Number(x.amount || 0), 0);
        const storeIn = pays.filter(x => x.type === "store").reduce((s, x) => s + Number(x.amount || 0), 0);
        const pct = v => totalIn > 0 ? Math.round((v / totalIn) * 100) : 0;

        // دمج آخر الحركات المالية (إيرادات + مصروفات)
        const ledger = [
          ...pays.map(p => ({ kind: "in", title: p.memberName ? `دفعة: ${p.memberName}` : "إيراد", sub: p.type === "store" ? "مبيعات متجر" : p.type === "balance" ? "سداد متبقي" : "اشتراك", amount: Number(p.amount || 0), d: p._d })),
          ...exps.map(e => ({ kind: "out", title: e.title || "مصروف", sub: "مصروفات", amount: Number(e.amount || 0), d: e._d }))
        ].sort((a, b) => (b.d?.getTime() || 0) - (a.d?.getTime() || 0)).slice(0, 15);

        $("#finBody").innerHTML = `
          <!-- بطاقات المؤشرات الرئيسية KPIs -->
          <div class="kpi-grid">
            <div class="kpi-card net">
              <div class="kpi-label"><span>صافي الربح (${finPeriod === "today" ? "اليوم" : finPeriod === "month" ? "الشهر الحالي" : "الكل"})</span><span>💰</span></div>
              <div class="kpi-val ${netProfit >= 0 ? "in" : "out"}">${money(netProfit)}</div>
              <div class="kpi-sub">الإيرادات مطروحاً منها المصروفات</div>
            </div>

            <div class="kpi-card">
              <div class="kpi-label"><span>إجمالي الإيرادات</span><span>📈</span></div>
              <div class="kpi-val in">${money(totalIn)}</div>
              <div class="kpi-sub">${pays.length} عملية تحصيل</div>
            </div>

            <div class="kpi-card">
              <div class="kpi-label"><span>إجمالي المصروفات</span><span>📉</span></div>
              <div class="kpi-val out">${money(totalOut)}</div>
              <div class="kpi-sub">${exps.length} بند مصروف</div>
            </div>

            <div class="kpi-card" style="grid-column: span 2;">
              <div class="kpi-label"><span>مستحقات متبقية على الأعضاء (ديون)</span><span>⏳</span></div>
              <div class="kpi-val due-c">${money(totalDues)}</div>
              <div class="kpi-sub">إجمالي الأرصدة المتبقية غير المحصلة من الأعضاء</div>
            </div>
          </div>

          <!-- تحليل مصادر الإيرادات -->
          <div class="breakdown-box">
            <div style="font-weight:800; font-size:0.92rem; margin-bottom:12px;">توزيع مصادر الدخل</div>
            <div class="bd-item">
              <div class="bd-head"><span>الاشتراكات (${pct(subIn)}%)</span><span>${money(subIn)}</span></div>
              <div class="bar-track"><div class="bar-fill" style="width:${pct(subIn)}%; background:#10b981;"></div></div>
            </div>
            <div class="bd-item">
              <div class="bd-head"><span>سداد المتبقي (${pct(balIn)}%)</span><span>${money(balIn)}</span></div>
              <div class="bar-track"><div class="bar-fill" style="width:${pct(balIn)}%; background:#3b82f6;"></div></div>
            </div>
            <div class="bd-item">
              <div class="bd-head"><span>مبيعات المتجر (${pct(storeIn)}%)</span><span>${money(storeIn)}</span></div>
              <div class="bar-track"><div class="bar-fill" style="width:${pct(storeIn)}%; background:#f59e0b;"></div></div>
            </div>
          </div>

          <!-- تسجيل مصروف جديد -->
          <h2>➕ تسجيل مصروف جديد</h2>
          <form class="panel" id="expForm">
            <div class="two">
              <div class="field"><label>بيان المصروف</label><input id="expTitle" required maxlength="120" placeholder="مثال: فاتورة كهرباء / صيانة"></div>
              <div class="field"><label>المبلغ (ج.م)</label><input id="expAmt" type="number" required min="1" step="any" placeholder="0"></div>
            </div>
            <button class="btn danger" type="submit">خصم وتسجيل المصروف</button>
          </form>

          <!-- سجل آخر العمليات المالية -->
          <h2>🧾 آخر الحركات المالية</h2>
          <div class="rows">
            ${ledger.length ? ledger.map(item => `
              <div class="row">
                <div>
                  <div class="name">${esc(item.title)}</div>
                  <div class="meta">${esc(item.sub)} · ${esc(fmtDateTime(item.d))}</div>
                </div>
                <span class="${item.kind === "in" ? "badge-in" : "badge-out"}">${item.kind === "in" ? "+" : "-"} ${money(item.amount)}</span>
              </div>
            `).join("") : `<div class="empty">لا توجد حركات مالية في هذه الفترة.</div>`}
          </div>
        `;

        $("#expForm").addEventListener("submit", async e => {
          e.preventDefault();
          const title = $("#expTitle").value.trim();
          const amount = Number($("#expAmt").value || 0);
          if (!title || amount <= 0) return;
          try {
            await addDoc(col("expenses"), {
              title,
              amount,
              ts: serverTimestamp(),
              by: G.uid
            });
            screenFinance(main, tok);
          } catch (err) {
            alert(errText(err));
          }
        });

      } catch (e) {
        if (tok === RT) $("#finBody").innerHTML = `<p class="msg err">${esc(errText(e))}</p>`;
      }
    }

    // ================= 4. شاشة الإعدادات =================
    function screenSettings(main) {
      main.innerHTML = `
        <h2>⚙️ بيانات الحساب والجيم</h2>
        <div class="panel">
          <div class="row" style="margin-bottom:8px;"><span class="meta">الاسم</span><strong>${esc(G.name)}</strong></div>
          <div class="row" style="margin-bottom:8px;"><span class="meta">الجيم</span><strong>${esc(G.gymName || G.gymId)}</strong></div>
          <div class="row" style="margin-bottom:8px;"><span class="meta">الصلاحية</span><strong>${esc(G.role)}</strong></div>
          <div class="row"><span class="meta">معرف المستخدم (UID)</span><strong dir="ltr" style="font-size:0.75rem;">${esc(G.uid)}</strong></div>
        </div>
      `;
    }

    // ================= التنقل والمصادقة =================
    function nav(tab) {
      stopScanner();
      RT++;
      document.querySelectorAll(".nav-item").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
      const main = $("#mainContent");
      if (tab === "checkin") screenCheckin(main, RT);
      else if (tab === "members") screenMembers(main);
      else if (tab === "finance") screenFinance(main, RT);
      else screenSettings(main);
    }

    document.querySelectorAll(".nav-item").forEach(btn => {
      btn.addEventListener("click", () => nav(btn.dataset.tab));
    });

    $("#loginForm").addEventListener("submit", async e => {
      e.preventDefault();
      const errBox = $("#loginErr");
      errBox.classList.add("hidden");
      try {
        await signInWithEmailAndPassword(auth, $("#loginEmail").value.trim(), $("#loginPass").value);
      } catch (err) {
        errBox.textContent = errText(err);
        errBox.classList.remove("hidden");
      }
    });

    $("#logoutBtn").addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, async user => {
      if (!user) {
        $("#appView").classList.add("hidden");
        $("#loginView").classList.remove("hidden");
        return;
      }
      try {
        const uSnap = await getDoc(doc(db, "users", user.uid));
        if (!uSnap.exists()) throw new Error("حسابك غير مربوط بجيم في مجموعة users.");
        const u = uSnap.data();
        G = { uid: user.uid, gymId: u.gymId, role: u.role, name: u.name, gymName: u.gymName || "" };
        $("#gymNameDisplay").textContent = G.gymName || G.gymId;
        $("#roleBadge").textContent = G.role === "owner" ? "المالك" : G.role === "accountant" ? "محاسب" : G.role;

        $("#loginView").classList.add("hidden");
        $("#appView").classList.remove("hidden");
        await loadMembersCache();
        nav("checkin");
      } catch (err) {
        alert(errText(err));
        await signOut(auth);
      }
    });
  </script>
</body>
</html>
