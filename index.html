<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EA580C">
<script>try{if(localStorage.getItem("gp_theme")==="dark"){document.documentElement.setAttribute("data-theme","dark");}}catch(e){}</script>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js">
<title>GymPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #F8FAFC;
    --surface: #FFFFFF;
    --ink: #0F172A;
    --muted: #64748B;
    --line: #E2E8F0;
    --brand: #EA580C;
    --brand-hover: #C2410C;
    --brand-soft: #FFF7ED;
    --brand-border: #FDBA74;
    --brand-ink: #FFFFFF;
    --warn: #B45309;
    --danger: #DC2626;
    --ok: #15803D;
    --ok-bg: #F0FDF4;
    --bad-bg: #FEF2F2;
    --warn-bg: #FFFBEB;
    --shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
  }
  :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0B0F17;
      --surface: #131A26;
      --ink: #F1F5F9;
      --muted: #94A3B8;
      --line: #1E293B;
      --brand: #F97316;
      --brand-hover: #FB923C;
      --brand-soft: #271509;
      --brand-border: #7C2D12;
      --brand-ink: #FFFFFF;
      --warn: #FBBF24;
      --danger: #F87171;
      --ok: #4ADE80;
      --ok-bg: #0B2616;
      --bad-bg: #2C1215;
      --warn-bg: #291E09;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    font-size: 16px;
    line-height: 1.65;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 52px; }
  .wrap.wide { max-width: 840px; }
  .muted { color: var(--muted); }

  .ico { width: 19px; height: 19px; flex: none; vertical-align: middle; }
  .ico.sm { width: 15px; height: 15px; }

  .login { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
  .mark { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .mark .logo-badge {
    width: 54px; height: 54px; border-radius: 16px;
    background: linear-gradient(135deg, #EA580C, #F97316);
    color: #fff; display: grid; place-items: center;
    box-shadow: 0 8px 20px rgba(234, 88, 12, 0.28);
  }
  .mark svg { width: 32px; height: auto; }
  .mark b { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; line-height: 1; }
  .mark b span { color: var(--brand); }
  .login p.lead { margin: 0 0 16px; color: var(--muted); font-size: 14.5px; }

  .panel {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 18px; box-shadow: var(--shadow);
  }

  label { display: block; font-weight: 600; font-size: 14px; margin: 0 0 6px; }
  .field { margin-bottom: 14px; }
  input, select, textarea {
    width: 100%; min-height: 46px; padding: 10px 14px;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px;
    font: inherit; font-size: 15px; transition: border-color .15s;
  }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: var(--brand); }
  input[dir="ltr"] { text-align: left; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible {
    outline: 3px solid var(--brand); outline-offset: 2px;
  }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .pwrow { display: flex; gap: 8px; align-items: center; }
  .pwrow input { flex: 1; min-width: 0; }

  button { font: inherit; cursor: pointer; transition: all .15s; }
  .btn {
    width: 100%; min-height: 48px; border: 0; border-radius: 12px;
    background: var(--brand); color: var(--brand-ink);
    font-weight: 700; font-size: 15px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 12px rgba(234, 88, 12, 0.2);
  }
  .btn:hover:not([disabled]) { background: var(--brand-hover); }
  .btn[disabled] { opacity: .6; cursor: wait; box-shadow: none; }
  .btn.ghost {
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); font-weight: 600; font-size: 13.5px;
    min-height: 40px; width: auto; padding: 0 13px; box-shadow: none;
  }
  .btn.ghost:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
  .btn.soft {
    background: var(--brand-soft); color: var(--brand);
    border: 1px solid var(--brand-border); font-weight: 600; font-size: 13.5px;
    min-height: 40px; width: auto; padding: 0 13px; box-shadow: none;
  }
  .btn.sm { min-height: 35px; font-size: 12.5px; padding: 0 11px; width: auto; border-radius: 10px; }
  .btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; box-shadow: none; }
  .btn.danger:hover { background: var(--bad-bg); }
  .linkbtn { background: none; border: 0; color: var(--brand); font-weight: 600; padding: 8px 0; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }

  .msg { margin: 0 0 14px; padding: 12px 14px; border-radius: 12px; font-size: 14px; border: 1px solid var(--line); background: var(--bg); display: flex; align-items: center; gap: 8px; }
  .msg.err { color: var(--danger); border-color: var(--danger); background: var(--bad-bg); }
  .msg.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }

  .cred { background: var(--brand-soft); border: 1px dashed var(--brand-border); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .mono { direction: ltr; unicode-bidi: plaintext; word-break: break-all; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .top .who { min-width: 0; }
  .top h1 { margin: 0; font-size: 20.5px; line-height: 1.3; }
  .top .sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }

  h2 { font-size: 16px; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; color: var(--ink); }
  h2 svg { color: var(--brand); }
  h2:first-child { margin-top: 0; }
  .grid2 { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } }
  .two { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }

  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .kpi.accent { background: linear-gradient(135deg, #EA580C, #F97316); color: #fff; border: 0; }
  .kpi.accent .kl { color: rgba(255,255,255,0.9); }
  .kpi .kl { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .kpi .kv { font-size: 20px; font-weight: 700; line-height: 1.2; }

  .meter-box { margin-top: 10px; }
  .meter-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 6px; font-weight: 600; }
  .meter-track { width: 100%; height: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .meter-fill { height: 100%; background: linear-gradient(90deg, #EA580C, #F97316); border-radius: 999px; transition: width .35s ease; }

  .rows { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
  .row { padding: 13px 16px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .name { font-weight: 700; font-size: 15px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .row .meta { color: var(--muted); font-size: 12.5px; margin-top: 3px; overflow-wrap: anywhere; }
  .row .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .tag.active { color: var(--ok); background: var(--ok-bg); }
  .tag.suspended, .tag.expired { color: var(--danger); background: var(--bad-bg); }
  .tag.soon { color: var(--warn); background: var(--warn-bg); }
  .tag.none { color: var(--muted); }
  .tag.cat { color: var(--brand); background: var(--brand-soft); border-color: var(--brand-border); }
  .empty { padding: 22px 16px; color: var(--muted); text-align: center; font-size: 13.5px; }

  .stat { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .stat:last-child { border-bottom: 0; }
  .stat span:first-child { color: var(--muted); display: inline-flex; align-items: center; gap: 7px; font-size: 14px; }
  .stat b { font-weight: 700; }
  .stat.big b { font-size: 20px; color: var(--brand); }

  .loading { min-height: 100vh; display: grid; place-items: center; color: var(--muted); }

  .shell { min-height: 100vh; padding-bottom: calc(86px + env(safe-area-inset-bottom)); }
  .shell.notabs { padding-bottom: 24px; }
  .oh { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 9; }
  .oh .in { max-width: 640px; margin: 0 auto; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .oh .brand-box { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .mini-logo {
    width: 38px; height: 38px; border-radius: 11px;
    background: var(--brand); color: #fff; display: grid; place-items: center; flex: none; overflow: hidden;
  }
  .mini-logo svg { width: 22px; height: auto; }
  .mini-logo img { width: 100%; height: 100%; object-fit: cover; }
  .oh .gname { font-weight: 700; font-size: 16px; line-height: 1.25; }
  .oh .gsub { color: var(--muted); font-size: 12px; }
  .oh .sub-pill {
    background: var(--brand-soft); color: var(--brand); border: 1px solid var(--brand-border);
    padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
  }

  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; overflow-x: auto; background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
    box-shadow: 0 -2px 12px rgba(0,0,0,0.04);
  }
  .tabs button {
    flex: 1; min-width: 64px; background: none; border: 0; padding: 6px 4px; min-height: 60px;
    color: var(--muted); font-size: 10.5px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    position: relative; white-space: nowrap;
  }
  .tabs button svg { width: 18px; height: 18px; }
  .tabs button[aria-current="page"] { color: var(--brand); }
  .tabs button[aria-current="page"]::before {
    content: ""; position: absolute; top: 0; width: 26px; height: 3px;
    background: var(--brand); border-radius: 0 0 4px 4px;
  }

  .seg { display: flex; gap: 6px; background: var(--surface); padding: 5px; border-radius: 14px; border: 1px solid var(--line); margin-bottom: 14px; }
  .seg button {
    flex: 1; border: 0; background: transparent; color: var(--muted);
    padding: 8px 10px; border-radius: 10px; font-weight: 600; font-size: 13px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .seg button.active { background: var(--brand); color: #fff; box-shadow: 0 2px 8px rgba(234, 88, 12, 0.25); }

  .prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .prod-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px; text-align: start; display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: var(--shadow); color: inherit;
  }
  .prod-card:hover:not([disabled]) { border-color: var(--brand); transform: translateY(-1px); }
  .prod-card[disabled] { opacity: 0.55; cursor: not-allowed; }
  .prod-thumb { width: 100%; height: 92px; object-fit: cover; border-radius: 10px; background: var(--bg); margin-bottom: 8px; border: 1px solid var(--line); }
  .prod-card .pname { font-weight: 700; font-size: 14.5px; margin: 4px 0; }
  .prod-card .pprice { font-weight: 700; color: var(--brand); font-size: 15px; }
  .prod-card .pstock { font-size: 11.5px; color: var(--muted); }

  .cart-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .cart-item:last-child { border-bottom: 0; }
  .qty-ctrl { display: inline-flex; align-items: center; gap: 8px; background: var(--bg); padding: 3px 8px; border-radius: 10px; border: 1px solid var(--line); }
  .qty-ctrl button { background: none; border: 0; color: var(--brand); font-weight: 700; width: 24px; height: 24px; display: grid; place-items: center; }

  .chart-wrap { position: relative; height: 215px; width: 100%; margin-top: 8px; }
  .chart-wrap.sm { height: 180px; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar input { flex: 1; min-width: 170px; }
  .toolbar select { width: auto; max-width: 100%; }
  .mrow { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
  .mrow:last-child { border-bottom: 0; }
  .mmain { flex: 1; min-width: 0; text-align: start; background: none; border: 0; color: inherit; padding: 12px 16px; }
  .mmain .name { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .mmain .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .mrow .side { padding-inline-end: 12px; display: flex; gap: 6px; align-items: center; }
  .due { color: var(--danger); font-weight: 600; }

  .result { border-radius: 16px; padding: 16px; margin: 14px 0; border: 1px solid currentColor; }
  .result.ok { background: var(--ok-bg); color: var(--ok); }
  .result.bad { background: var(--bad-bg); color: var(--danger); }
  .result.warn { background: var(--warn-bg); color: var(--warn); }
  .result .rn { font-size: 20px; font-weight: 700; color: var(--ink); margin: 4px 0; }
  .result .rt { font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .result .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

  #reader { width: 100%; max-width: 360px; margin: 12px auto; border-radius: 14px; overflow: hidden; }
  .qrbox { text-align: center; }
  .qrbox img { width: 200px; height: 200px; background: #fff; border-radius: 12px; padding: 8px; border: 1px solid var(--line); }
  .bigcode { font-size: 30px; font-weight: 700; letter-spacing: 3px; direction: ltr; color: var(--brand); }

  .punch-btn { min-height: 64px; font-size: 18px; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(82px + env(safe-area-inset-bottom));
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px; z-index: 50;
    font-size: 13.5px; font-weight: 600; max-width: 90vw; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  .back { margin-bottom: 14px; }

  /* ---- Responsive layout + support mode ---- */
  .body { display: block; }
  .support-bar { background: #7C2D12; color: #fff; padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; flex-wrap: wrap; }
  .support-bar span { display: inline-flex; align-items: center; gap: 6px; }
  .support-bar button { background: #fff; color: #7C2D12; border: 0; border-radius: 8px; padding: 5px 12px; font-weight: 700; font-size: 12.5px; }
  .cols2 { display: grid; gap: 14px; grid-template-columns: 1fr; margin-top: 4px; }
  .kpi-grid.four { grid-template-columns: 1fr 1fr; }
  .gym-grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
  .gym-card .name { font-weight: 700; font-size: 16px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
  .gym-card .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .stat b.mono { font-size: 13px; text-align: left; }

  @media (min-width: 640px) {
    .wrap { max-width: 760px; }
    .prod-grid { grid-template-columns: repeat(3, 1fr); }
    .kpi-grid.four { grid-template-columns: repeat(4, 1fr); }
  }
  @media (min-width: 1024px) {
    .shell { padding-bottom: 0; }
    .oh .in { max-width: 1280px; padding: 12px 24px; }
    .body { display: flex; align-items: flex-start; max-width: 1280px; margin: 0 auto; }
    .tabs {
      position: sticky; top: 64px; left: auto; right: auto; bottom: auto;
      flex-direction: column; width: 232px; flex: none; height: calc(100vh - 64px);
      border-top: 0; border-inline-end: 1px solid var(--line); box-shadow: none;
      padding: 14px 10px; overflow-y: auto; overflow-x: hidden; background: transparent; gap: 2px;
    }
    .tabs button {
      flex: none; width: 100%; flex-direction: row; justify-content: flex-start; gap: 12px;
      min-height: 46px; padding: 0 14px; font-size: 14.5px; border-radius: 12px;
    }
    .tabs button svg { width: 20px; height: 20px; }
    .tabs button[aria-current="page"] { background: var(--brand-soft); }
    .tabs button[aria-current="page"]::before { display: none; }
    .body .wrap { flex: 1; min-width: 0; max-width: 1000px; margin: 0; padding: 24px 28px 48px; }
    .cols2 { grid-template-columns: 1fr 1fr; align-items: start; gap: 18px; }
    .prod-grid { grid-template-columns: repeat(4, 1fr); }
    .wrap.wide { max-width: 1100px; }
    .gym-grid { grid-template-columns: 1fr 1fr; }
    .toast { bottom: 28px; }
  }

  /* ---- v4: utilities, modal, pickers, switches, check-in, tabs ---- */
  [hidden] { display: none !important; }
  .vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); }
  .hdr-actions { display: flex; align-items: center; gap: 8px; flex: none; }
  .sup-mini { display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; min-height: 36px; border-radius: 10px; background: #25D366; color: #fff; font-weight: 700; font-size: 12.5px; text-decoration: none; white-space: nowrap; }
  .sup-mini .ico { width: 18px; height: 18px; }
  .sup-mini span { display: none; }
  @media (min-width: 480px) { .sup-mini span { display: inline; } }
  .btn.support-btn { background: #25D366; color: #fff; box-shadow: none; }
  .btn.support-btn:hover:not([disabled]) { background: #1EBE5A; }
  .oh .sub-pill { display: none; }
  @media (min-width: 560px) { .oh .sub-pill { display: inline-block; } }

  .modal-ov { position: fixed; inset: 0; background: rgba(15, 23, 42, .55); z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
  .modal { background: var(--surface); color: var(--ink); width: 100%; max-width: 520px; max-height: 92vh; overflow: auto; border-radius: 20px 20px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 40px rgba(0, 0, 0, .3); }
  .modal-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 17px; }
  @media (min-width: 640px) { .modal-ov { align-items: center; } .modal { border-radius: 20px; } }
  details.more { margin: 4px 0 8px; }
  details.more summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--brand); padding: 6px 0; }

  .imgpick-box { display: grid; place-items: center; width: 150px; height: 150px; margin: 0 auto; border: 2px dashed var(--brand-border); border-radius: 18px; background: var(--brand-soft); color: var(--brand); cursor: pointer; overflow: hidden; position: relative; font-weight: 600; }
  .imgpick-box.round { border-radius: 50%; }
  .imgpick-box.drag { border-color: var(--brand); background: var(--surface); }
  .imgpick-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .imgpick-plus { display: grid; justify-items: center; gap: 4px; font-size: 12.5px; }
  .imgpick-plus svg { width: 32px; height: 32px; }

  .avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 700; border: 1px solid var(--brand-border); flex: none; }
  .avatar.lg { width: 76px; height: 76px; font-size: 30px; }

/* ---------- Sound (POS-style confirmation beeps) ---------- */
const Sound = (() => {
  let ctx = null;
  let enabled = true;
  try { enabled = localStorage.getItem("gp_sound") !== "0"; } catch {}
  const ensure = () => {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
    } catch {}
    return ctx;
  };
  const tone = (freq, start, dur, type = "sine", vol = 0.28) => {
    if (!enabled) return;
    const c = ensure(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    const t0 = c.currentTime + start;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  };
  const vib = p => { try { if (enabled) navigator.vibrate && navigator.vibrate(p); } catch {} };
  return {
    get enabled() { return enabled; },
    set enabled(v) { enabled = !!v; try { localStorage.setItem("gp_sound", enabled ? "1" : "0"); } catch {} },
    unlock: ensure,
    ok() { tone(1046, 0, 0.1); tone(1568, 0.11, 0.22); vib(60); },
    warn() { tone(660, 0, 0.1, "triangle"); tone(660, 0.17, 0.1, "triangle"); vib([40, 40, 40]); },
    bad() { tone(220, 0, 0.3, "square", 0.22); tone(165, 0.32, 0.45, "square", 0.22); vib([140, 60, 140]); }
  };
})();

/* ---------- Images: validate, compress, upload ---------- */
const safeImg = u => {
  const s = String(u || "").trim();
  return (/^https:\/\//i.test(s) || /^data:image\/(png|jpe?g|webp);base64,[A-Za-z0-9+/=]+$/.test(s)) ? s : "";
};
function blobToDataUrl(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error("تعذر قراءة الصورة.")); r.readAsDataURL(blob); });
}
function compressImage(file, { max = 640, q = 0.8, alpha = false } = {}) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.imageSmoothingQuality = "high";
      if (!alpha) { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); }
      ctx.drawImage(img, 0, 0, w, h);
      const jpeg = () => {
        const c2 = document.createElement("canvas"); c2.width = w; c2.height = h;
        const x2 = c2.getContext("2d"); x2.fillStyle = "#fff"; x2.fillRect(0, 0, w, h); x2.drawImage(c, 0, 0);
        c2.toBlob(b => b ? resolve(b) : reject(new Error("تعذر ضغط الصورة.")), "image/jpeg", q);
      };
      if (alpha) c.toBlob(b => (b && b.size <= 140 * 1024) ? resolve(b) : jpeg(), "image/png");
      else c.toBlob(b => b ? resolve(b) : reject(new Error("تعذر ضغط الصورة.")), "image/jpeg", q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("تعذر قراءة الصورة. جرّب صورة أخرى.")); };
    img.src = url;
  });
}
// Tries Firebase Storage first; if Storage is not enabled / not allowed, falls back to a small inline image.
async function uploadImage(file, path, opts = {}) {
  const { max = 640, q = 0.8, inlineMax = 320, inlineQ = 0.7, alpha = false } = opts;
  const blob = await compressImage(file, { max, q, alpha });
  try {
    const url = await withTimeout((async () => {
      const st = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js");
      const r = st.ref(st.getStorage(app), path);
      await st.uploadBytes(r, blob, { contentType: blob.type || "image/jpeg", cacheControl: "public,max-age=31536000" });
      return await st.getDownloadURL(r);
    })(), 25000);
    return { url, stored: "storage" };
  } catch (e) {
    const small = await compressImage(file, { max: inlineMax, q: inlineQ, alpha });
    const data = await blobToDataUrl(small);
    if (data.length > 140000) throw new Error("الصورة كبيرة. اختر صورة أصغر.");
    return { url: data, stored: "inline" };
  }
}

function pwError(p) {
  if (!p || p.length < 8) return "كلمة المرور لازم تكون 8 أحرف أو أرقام على الأقل.";
  if (!/[A-Za-z]/.test(p) || !/\d/.test(p)) return "كلمة المرور لازم تحتوي على حروف إنجليزية وأرقام.";
  return "";
}
function genPassword(len = 10) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
  for (let t = 0; t < 30; t++) {
    const arr = new Uint32Array(len);
    crypto.getRandomValues(arr);
    let out = "";
    for (let i = 0; i < len; i++) out += chars[arr[i] % chars.length];
    if (!pwError(out)) return out;
  }
  return "Gp" + Date.now().toString(36).slice(-8) + "7";
}

/* ---------- Member / session math ---------- */
function calcMemberState(m) {
  const end = toDate(m.endDate);
  if (!end) return { key: "none", label: "بدون اشتراك", left: null, end: null, pct: 0 };
  const left = Math.ceil((end.getTime() - Date.now()) / DAY);
  const start = toDate(m.startDate) || new Date(end.getTime() - (Number(m.planDays) || 30) * DAY);
  const totalSpan = Math.max(DAY, end.getTime() - start.getTime());
  const remSpan = Math.max(0, end.getTime() - Date.now());
  const pct = end.getTime() < Date.now() ? 0 : Math.min(100, Math.max(2, Math.round((remSpan / totalSpan) * 100)));
  if (end.getTime() < Date.now()) return { key: "expired", label: "منتهي", left: 0, end, pct: 0 };
  if (left <= 7) return { key: "soon", label: "ينتهي قريبًا", left, end, pct };
  return { key: "active", label: "نشط", left, end, pct };
}

function haversineMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000, toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function getCurrentGps() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error("المتصفح لا يدعم تحديد الموقع GPS."));
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, acc: Math.round(pos.coords.accuracy || 0) }),
      () => reject(new Error("تعذر الحصول على موقع GPS. اسمح بصلاحية الموقع من المتصفح.")),
      { enableHighAccuracy: true, timeout: 12000 }
    );
  });
}

  const blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ---------- High-quality two-sided PDF ID card (login name + password) ---------- */
function loadImg(url, ms = 5000) {
  return new Promise(res => {
    const im = new Image();
    im.crossOrigin = "anonymous";
    const t = setTimeout(() => res(null), ms);
    im.onload = () => { clearTimeout(t); res(im); };
    im.onerror = () => { clearTimeout(t); res(null); };
    im.src = url;
  });
}
function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function fitSize(ctx, text, maxW, startSize, weight, family) {
  let size = startSize;
  for (; size > 2.2; size -= 0.2) {
    ctx.font = `${weight} ${size}px ${family}`;
    if (ctx.measureText(text).width <= maxW) break;
  }
  return size;
}

async function downloadMemberIdPdf(gym, member, gymId, password = "") {
  const [pdfMod, qrMod] = await Promise.all([
    import("https://esm.sh/jspdf@2.5.1"),
    import("https://esm.sh/qrcode@1.5.4")
  ]);
  const jsPDF = pdfMod.jsPDF || pdfMod.default?.jsPDF || pdfMod.default;
  const QR = qrMod.default || qrMod;
  const FAM = "'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif";
  try { await Promise.all([document.fonts.load(`700 20px ${FAM}`), document.fonts.load(`400 20px ${FAM}`)]); } catch {}

  const st = calcMemberState(member);
  const W = 85.6, H = 54, PX = 14;                       // 14 px per mm ≈ 355 dpi
  const logoUrl = safeImg(gym?.logoUrl);
  const logo = logoUrl ? await loadImg(logoUrl) : null;
  const loginLink = `${appLink()}?g=${encodeURIComponent(gymId)}`;
  const qrOpts = { margin: 0, width: 720, errorCorrectionLevel: "M", color: { dark: "#0F172A", light: "#FFFFFF" } };
  const qrEntry = await loadImg(await QR.toDataURL(`GYMPRO|${gymId}|${member.code || member.id}`, qrOpts));
  const qrLogin = await loadImg(await QR.toDataURL(loginLink, qrOpts));

  const face = draw => {
    const c = document.createElement("canvas");
    c.width = Math.round(W * PX); c.height = Math.round(H * PX);
    const ctx = c.getContext("2d");
    ctx.scale(PX, PX);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    draw(ctx);
    return c.toDataURL("image/png");
  };
  const T = (ctx, text, x, y, o = {}) => {
    const { size = 3.6, color = "#0F172A", weight = 400, align = "right", maxW = 0, dir = "rtl" } = o;
    const txt = String(text ?? "");
    ctx.direction = dir; ctx.textAlign = align; ctx.fillStyle = color; ctx.textBaseline = "alphabetic";
    const s = maxW ? fitSize(ctx, txt, maxW, size, weight, FAM) : size;
    ctx.font = `${weight} ${s}px ${FAM}`;
    ctx.fillText(txt, x, y);
  };
  const crisp = (ctx, img, x, y, w, h) => {
    if (!img) return;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, x, y, w, h);
    ctx.imageSmoothingEnabled = true;
  };

  const front = face(ctx => {
    ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, W, H);
    const g = ctx.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, "#F97316"); g.addColorStop(1, "#EA580C");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, 16);
    ctx.fillStyle = "rgba(255,255,255,0.13)";
    ctx.beginPath(); ctx.arc(W - 3, 1, 15, 0, Math.PI * 2); ctx.fill();

    if (logo) {
      ctx.fillStyle = "#FFFFFF"; rrect(ctx, 4, 2.5, 11, 11, 2.2); ctx.fill();
      ctx.save(); rrect(ctx, 4.6, 3.1, 9.8, 9.8, 1.8); ctx.clip();
      const k = Math.min(9.8 / logo.width, 9.8 / logo.height);
      ctx.drawImage(logo, 4.6 + (9.8 - logo.width * k) / 2, 3.1 + (9.8 - logo.height * k) / 2, logo.width * k, logo.height * k);
      ctx.restore();
    }
    T(ctx, gym?.name || "GymPro", W - 5, 9, { size: 5.2, color: "#FFFFFF", weight: 700, maxW: logo ? 62 : 72 });
    T(ctx, "بطاقة عضوية", W - 5, 13.6, { size: 2.9, color: "#FFEDD5" });

    ctx.fillStyle = "#FFFFFF"; rrect(ctx, 4.5, 19.5, 25, 25, 2); ctx.fill();
    ctx.strokeStyle = "#FED7AA"; ctx.lineWidth = 0.3; ctx.stroke();
    crisp(ctx, qrEntry, 6.5, 21.5, 21, 21);
    T(ctx, `كود ${member.code || ""}`, 17, 48.8, { size: 3.4, color: "#EA580C", weight: 700, align: "center" });

    const xr = W - 5, mw = 48;
    T(ctx, member.name || "عضو", xr, 26.5, { size: 6.4, weight: 700, maxW: mw });
    T(ctx, `الباقة: ${member.planName || "—"}`, xr, 33, { size: 3.8, color: "#EA580C", weight: 700, maxW: mw });
    T(ctx, `التمارين: ${sessionsText(member)}`, xr, 38.6, { size: 3.5, color: "#334155", maxW: mw });
    T(ctx, `الاشتراك: ${fmtLeftText(st)}`, xr, 43.8, { size: 3.5, color: "#475569", maxW: mw });
    if (member.phone) T(ctx, `الموبايل: ${member.phone}`, xr, 49, { size: 3.3, color: "#64748B", maxW: mw });
    ctx.fillStyle = "#EA580C"; ctx.fillRect(0, H - 2, W, 2);
  });

  const back = face(ctx => {
    ctx.fillStyle = "#FFF7ED"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#FFFFFF"; rrect(ctx, 2.5, 2.5, W - 5, H - 5, 3); ctx.fill();
    ctx.strokeStyle = "#FDBA74"; ctx.lineWidth = 0.25; ctx.stroke();

    const xr = W - 6;
    T(ctx, "بيانات الدخول إلى حسابك", xr, 10.5, { size: 4.4, color: "#EA580C", weight: 700 });
    T(ctx, "اسم الدخول (رقم الموبايل)", xr, 17.5, { size: 2.9, color: "#64748B" });
    T(ctx, member.phone || "—", xr, 23.4, { size: 5, weight: 700, maxW: 47, dir: "ltr", align: "right" });
    T(ctx, "كلمة المرور", xr, 30.2, { size: 2.9, color: "#64748B" });
    if (password) {
      ctx.fillStyle = "#FFEDD5"; rrect(ctx, 31, 31.6, xr - 31, 8.6, 1.6); ctx.fill();
      ctx.strokeStyle = "#FDBA74"; ctx.lineWidth = 0.2; ctx.stroke();
      T(ctx, password, (31 + xr) / 2, 37.6, { size: 5.4, weight: 700, maxW: 44, dir: "ltr", align: "center" });
    } else {
      T(ctx, "تُسلَّم لك من الاستقبال", xr, 37, { size: 3.6, color: "#B45309", weight: 700 });
    }

    ctx.fillStyle = "#FFFFFF"; rrect(ctx, 5.5, 12.5, 21, 21, 1.8); ctx.fill();
    ctx.strokeStyle = "#FED7AA"; ctx.lineWidth = 0.25; ctx.stroke();
    crisp(ctx, qrLogin, 6.8, 13.8, 18.4, 18.4);
    T(ctx, "امسح للدخول", 16, 37, { size: 2.7, color: "#64748B", align: "center" });

    T(ctx, "غيّر كلمة المرور بعد أول دخول ولا تشاركها مع أحد.", W / 2, 46.2, { size: 2.7, color: "#94A3B8", align: "center" });
    let host = "";
    try { host = new URL(appLink()).host; } catch {}
    T(ctx, host, W / 2, 50.2, { size: 2.5, color: "#94A3B8", align: "center", dir: "ltr" });
  });

  const pdf = new jsPDF({ orientation: "landscape", unit: "mm", format: [W, H], compress: true });
  pdf.addImage(front, "PNG", 0, 0, W, H, undefined, "FAST");
  pdf.addPage([W, H], "landscape");
  pdf.addImage(back, "PNG", 0, 0, W, H, undefined, "FAST");
  const safeName = String(member.name || "member").replace(/[^\w\u0600-\u06FF-]+/g, "_");
  pdf.save(`ID_${safeName}_${member.code || "card"}.pdf`);
}

  let last = null;
  for (let ver = 0; ver <= 2; ver++) {

      getDoc(doc(db, "gyms", gid, "meta", "public")),

async function renderMemberPortal(ctx) {
  const { gymId, pub, member, logs, paidTotal, products, tab, photo } = ctx;

function reminderText(m) {
  const st = calcMemberState(m);
  const gname = G.gym.name || "الجيم";

  return `أهلًا ${m.name}، معك ${gname}.`;
}

function stopScanner() {
  if (scanner) { const s = scanner; scanner = null; s.stop().then(() => s.clear()).catch(() => {}); }
}

function nav(tab, sub = null) {
  closeModal(); stopScanner(); destroyCharts();

}

function tabsForRole() {
  const r = role();

  if (r === "reception") return [["members", "الأعضاء", "users"], ["checkin", "الحضور", "qr"], ["store", "الستور", "store"], ["punch", "بصمتي", "mapPin"], ["settings", "حسابي", "settings"]];

}

function planFieldsHtml(defaultStart) {
  if (!PLANS.length) return `<p class="msg err">${ico("alert", "sm")} لا توجد باقات اشتراك. اطلب من المدير إضافة باقة من «الإعدادات».</p>`;
  return `
  <div class="field">
    <label for="pf-plan">الباقة</label>
    <select id="pf-plan">${PLANS.map(p => `<option value="${esc(p.id)}">${esc(p.name)} — ${esc(p.days)} يوم — ${esc(p.sessions || 30)} تمرينة — ${money(p.price)}</option>`).join("")}</select>
  </div>
  <div class="field"><label for="pf-start">تاريخ بداية الاشتراك</label><input id="pf-start" type="date" dir="ltr" value="${esc(defaultStart)}"></div>
  <div class="two">
    <div class="field"><label for="pf-price">السعر</label><input id="pf-price" type="number" inputmode="decimal" min="0" dir="ltr"></div>
    <div class="field"><label for="pf-paid">المدفوع الآن</label><input id="pf-paid" type="number" inputmode="decimal" min="0" dir="ltr"></div>
  </div>
  <div class="field"><label for="pf-sess">عدد التمارين في الباقة</label><input id="pf-sess" type="number" inputmode="numeric" min="1" dir="ltr" value="30"></div>
  <p class="hint" id="pf-rem"></p>`;
}
function wirePlanFields(box) {
  const sel = $("#pf-plan", box); if (!sel) return;
  const price = $("#pf-price", box), paid = $("#pf-paid", box), sess = $("#pf-sess", box), rem = $("#pf-rem", box);
  const upd = () => {
    const r = num(price.value) - num(paid.value);
    rem.textContent = r > 0 ? `المتبقي على العضو: ${money(r)}` : (r < 0 ? "المدفوع أكبر من السعر." : "مدفوع بالكامل.");
  };
  const fill = () => {
    const p = PLANS.find(x => x.id === sel.value);
    price.value = p ? p.price : 0; paid.value = p ? p.price : 0;
    if (sess && p) sess.value = p.sessions || 30;
    upd();
  };
  sel.addEventListener("change", fill); price.addEventListener("input", upd); paid.addEventListener("input", upd);
  fill();
}
function readPlanFields(box) {
  const plan = PLANS.find(x => x.id === $("#pf-plan", box)?.value);
  const start = $("#pf-start", box)?.value;
  const price = num($("#pf-price", box)?.value), paid = num($("#pf-paid", box)?.value);
  const sessions = Math.max(1, Math.round(num($("#pf-sess", box)?.value) || plan?.sessions || 30));
  if (!plan) throw new Error("اختر باقة.");
  if (!start) throw new Error("اختر تاريخ البداية.");
  if (paid > price) throw new Error("المدفوع أكبر من السعر.");
  const endStr = plusDays(start, Number(plan.days) || 0);
  return { plan, start, price, paid, sessions, startTs: Timestamp.fromDate(parseYmd(start)), end: endOfDay(endStr) };
}

/* ---------- Member login provisioning (phone + generated password) ---------- */
async function provisionMemberLogin(m, password) {
  const phone10 = normPhone(m.phone);
  if (phone10.length < 9) throw { code: "phone-invalid" };
  const pe = pwError(password);
  if (pe) throw { code: "weak-pass", message: pe };
  let uid = null, ver = 0, email = "";
  for (ver = 0; ver <= 2; ver++) {
    email = memberEmail(G.gymId, phone10, ver);
    try { uid = await createAuthUser(email, password); break; }
    catch (e) { if (e.code === "auth/email-already-in-use") continue; throw e; }
  }
  if (!uid) throw { code: "login-limit" };
  const batch = writeBatch(db);
  batch.set(doc(db, "users", uid), {
    name: m.name, role: "member", active: true, gymId: G.gymId, gymName: G.gym.name || "",
    memberId: m.id, loginVer: ver, email, createdAt: serverTimestamp(), createdBy: G.uid
  });
  batch.update(ref("members", m.id), { loginUid: uid, loginVer: ver, loginPhone: phone10 });
  if (m.loginUid) batch.update(doc(db, "users", m.loginUid), { active: false });
  await batch.commit();
  m.loginUid = uid; m.loginVer = ver; m.loginPhone = phone10;
}
function memberCredDescriptor(m, pass) {
  const link = `${appLink()}?g=${encodeURIComponent(G.gymId)}`;
  const phone10 = normPhone(m.phone);
  const text = `أهلًا ${m.name}، بيانات دخولك لبوابة ${G.gym.name || "الجيم"}:\nالرابط: ${link}\nرقم الموبايل: ${phone10}\nكلمة المرور: ${pass}\nنوصيك بتغيير كلمة المرور بعد أول دخول.`;
  return {
    scope: `member:${m.id}`, title: `بيانات دخول ${m.name}`, phone: m.phone, text,
    rows: [["الرابط", link], ["رقم الموبايل", phone10], ["كلمة المرور", pass]], card: { member: m, pass }
  };
}

    const name = $("#mname").value.trim();

      const pe = pwError(password); if (pe) return msg(pe);

      if (!confirm("هذا الرقم مسجل لعضو آخر. هل تريد المتابعة؟")) return;
    }

      const subRef = doc(col("subscriptions"));

      await runTransaction(db, async tx => {
        const c = await tx.get(counterRef);
        const next = (c.exists() && c.data().member ? c.data().member : 1000) + 1;
        code = String(next);
        tx.set(counterRef, { member: next }, { merge: true });
        tx.set(memberRef, {
          name, phone, code,
          planId: f.plan.id, planName: f.plan.name, planDays: Number(f.plan.days) || 30,
          startDate: f.startTs, endDate: Timestamp.fromDate(f.end),
          sessionsTotal: f.sessions, sessionsLeft: f.sessions,
          balance: f.price - f.paid, createdAt: serverTimestamp()
        });
        tx.set(subRef, {
          memberId: memberRef.id, memberName: name, planId: f.plan.id, planName: f.plan.name,
          start: f.start, end: ymd(f.end), price: f.price, paid: f.paid, remaining: f.price - f.paid,
          sessions: f.sessions, createdAt: serverTimestamp(), by: G.uid
        });
        if (f.paid > 0) {
          tx.set(payRef, {
            memberId: memberRef.id, memberName: name, amount: f.paid, date: todayStr(),
            type: "subscription", note: f.plan.name, ts: serverTimestamp(), by: G.uid
          });
        }
      });
      const newM = {
        id: memberRef.id, name, phone, code,
        planId: f.plan.id, planName: f.plan.name, planDays: Number(f.plan.days) || 30,
        startDate: f.startTs, endDate: Timestamp.fromDate(f.end),
        sessionsTotal: f.sessions, sessionsLeft: f.sessions, balance: f.price - f.paid
      };

        try { await saveMemberPhoto(memberRef.id, photoPick.file); }
        catch (e) { toast("تم حفظ العضو لكن تعذر حفظ الصورة: " + (e.message || errText(e))); }
      }
      if (password) {
        try {
          await provisionMemberLogin(newM, password);
          S.cred = memberCredDescriptor(newM, password);
        } catch (e) {
          toast("تم حفظ العضو لكن تعذر إنشاء الدخول: " + errText(e));
        }
      }
      toast(`تم حفظ ${name} — كود ${code}`);
      nav("members", { type: "member", id: memberRef.id });
    } catch (e) {
      msg(errText(e));
      btn.disabled = false; btn.innerHTML = `${ico("check")} حفظ العضو`;
    }
  });
}

function findMemberFromScan(raw) {
  const txt = String(raw || "").trim();
  if (!txt) return null;
  if (txt.startsWith("GYMPRO|")) {
    const codePart = txt.split("|")[2] || "";
    return MEMBERS.find(m => String(m.code) === codePart || m.id === codePart) || null;
  }
  const d = arabicDigitsToEn(txt).replace(/\D/g, "");
  if (!d) return null;
  if (d.length <= 6) return MEMBERS.find(m => String(m.code) === d) || null;
  const n = normPhone(d);
  return MEMBERS.find(m => normPhone(m.phone) === n) || null;
}

let scanBusy = false;
async function startScan() {
  const btn = $("#scanBtn");
  if (scanner) {
    stopScanner();
    if (btn) btn.innerHTML = `${ico("camera")} مسح بالكاميرا`;
    return;
  }
  Sound.unlock();
  const box = $("#result");
  try {
    const mod = await import("https://esm.sh/html5-qrcode@2.3.8");
    const H = mod.Html5Qrcode || (mod.default && mod.default.Html5Qrcode);
    const FMT = mod.Html5QrcodeSupportedFormats || (mod.default && mod.default.Html5QrcodeSupportedFormats);
    const cfg = { verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } };
    if (FMT) cfg.formatsToSupport = [FMT.QR_CODE];
    const s = new H("reader", cfg);
    scanner = s;
    if (btn) btn.innerHTML = `${ico("camera")} إيقاف الكاميرا`;
    await s.start(
      { facingMode: "environment" },
      { fps: 12, qrbox: { width: 240, height: 240 }, aspectRatio: 1 },
      text => {
        if (scanBusy) return;
        scanBusy = true;
        doCheckin(text);
        setTimeout(() => { scanBusy = false; }, 2200);
      },
      () => {}
    );
  } catch {
    scanner = null;
    if (btn) btn.innerHTML = `${ico("camera")} مسح بالكاميرا`;
    box.innerHTML = `<p class="msg err">${ico("alert", "sm")} تعذر تشغيل الكاميرا. اسمح للمتصفح باستخدامها أو اكتب الكود يدويًا.</p>`;
  }
}

async function doCheckin(raw) {
  const box = $("#result");
  if (!box) return;
  const m = findMemberFromScan(raw);
  if (!m) {
    Sound.bad();
    box.innerHTML = `<div class="result bad"><div class="rt">${ico("xCircle", "sm")} غير موجود</div><div>لا يوجد عضو مطابق لهذا الكود أو الرقم.</div></div>`;
    return;
  }
  const st = calcMemberState(m);
  const photo = PHOTOS.get(m.id) || "";
  const waBtn = m.phone ? `<a class="btn ghost sm" target="_blank" rel="noopener noreferrer" href="${esc(waRawLink(m.phone, reminderText(m)))}">${ico("whatsapp", "sm")} واتساب</a>` : "";
  const loadPhoto = () => {
    if (photo) return;
    getMemberPhoto(m.id).then(d => {
      const a = $(`.result[data-mid="${m.id}"] #resAvatar`);
      if (d && a) a.innerHTML = avatarHtml(m.name, d, "lg");
    });
  };

  if (st.key === "expired" || st.key === "none") {
    Sound.bad();
    box.innerHTML = resultCard("bad", m, st,
      `${ico("xCircle", "sm")} الدخول ممنوع — ${st.key === "none" ? "لا يوجد اشتراك" : "الاشتراك منتهي"}`,
      `<span class="status-chip chip-bad">منتهي</span>`, photo,
      `<div class="acts"><button class="btn sm" id="goRenew">${ico("refresh", "sm")} تجديد الاشتراك</button>${waBtn}</div>`);
    $("#goRenew").addEventListener("click", () => nav("members", { type: "renew", id: m.id }));
    loadPhoto();
    return;
  }

  const last = toDate(m.lastCheckinAt);
  if (last && ymd(last) === todayStr()) {
    Sound.warn();
    box.innerHTML = resultCard("warn", m, st,
      `${ico("alert", "sm")} سُجّل حضوره اليوم بالفعل الساعة ${esc(fmtTime(last))}`,
      `<span class="status-chip chip-ok">ساري</span>`, photo);
    loadPhoto();
    return;
  }

  // Valid subscription: show the result immediately, save in the background
  Sound.ok();
  const curSess = Number(m.sessionsLeft);
  const nextSess = isNaN(curSess) ? null : Math.max(0, curSess - 1);
  const dueLine = Number(m.balance) > 0 ? `<div class="due" style="margin-top:8px">عليه مبلغ متبقي ${money(m.balance)}</div>` : "";
  box.innerHTML = resultCard("ok", m, st,
    `${ico("checkCircle", "sm")} مرحبًا — الدخول مسموح <span class="ck-state" id="ckState">جاري التسجيل…</span>`,
    `<span class="status-chip chip-ok">ساري</span>`, photo,
    dueLine + (st.key === "soon" ? `<div class="acts">${waBtn}</div>` : ""));
  loadPhoto();

  try {
    const batch = writeBatch(db);
    batch.set(ref("attendance", `${todayStr()}_${m.id}`), {
      memberId: m.id, memberName: m.name, code: m.code, date: todayStr(), ts: serverTimestamp(), by: G.uid
    });
    const upd = { lastCheckinAt: serverTimestamp() };
    if (nextSess !== null) upd.sessionsLeft = nextSess;
    batch.update(ref("members", m.id), upd);
    await batch.commit();
    if (nextSess !== null) m.sessionsLeft = nextSess;
    m.lastCheckinAt = { toDate: () => new Date() };
    const s = $("#ckState"); if (s) s.textContent = "تم التسجيل";
    const line = $(`.result[data-mid="${m.id}"] .res-line`);
    if (line) line.textContent = `${sessionsText(m)} · ${fmtLeftText(st)}`;
    loadToday(RT);
  } catch (e) {
    if (e && e.code === "permission-denied") {
      m.lastCheckinAt = { toDate: () => new Date() };
      Sound.warn();
      box.innerHTML = resultCard("warn", m, st, `${ico("alert", "sm")} سُجّل حضوره اليوم بالفعل (من جهاز آخر)`, `<span class="status-chip chip-ok">ساري</span>`, photo);
    } else {
      box.innerHTML = `<p class="msg err">${esc(errText(e))}</p>`;
    }
  }
}

  const uid = await createAuthUser(email, password);

    const lat = num($("#gLat").value), lng = num($("#gLng").value);
    const gpsRadius = Math.max(20, Math.round(num($("#gRad").value) || 250));
    if (!lat || !lng) return toast("أدخل خط العرض وخط الطول أولًا.");
    try {
      await setDoc(ref("meta", "public"), { lat, lng, gpsRadius }, { merge: true });
      Object.assign(G.gym, { lat, lng, gpsRadius });
      toast("تم حفظ موقع الجيم");
      renderOwner();
    } catch (e) { toast(errText(e)); }
  });

  $("#empForm").addEventListener("submit", async ev => {
    ev.preventDefault();
    const name = $("#eName").value.trim(), jobKey = $("#eJob").value, jobCustom = $("#eJobCustom").value.trim();
    const email = $("#eEmail").value.trim().toLowerCase(), pass = $("#ePass").value.trim();
    if (!name) return toast("اكتب اسم الموظف.");
    if (jobKey === "other" && !jobCustom) return toast("اكتب اسم الوظيفة.");
    if (!isValidEmail(email)) return toast("صيغة الإيميل غير صحيحة.");
    const pe = pwError(pass); if (pe) return toast(pe);
    const btn = $("#eSave"); btn.disabled = true;
    try {
      const r = await createEmployee({ name, jobKey, jobCustom, email, password: pass });
      S.cred = loginCredDescriptor("staff", `بيانات دخول ${name} (${r.jobLabel})`, name, email, pass);
      await loadEmployees();
      renderOwner();
    } catch (e) { btn.disabled = false; toast(errText(e)); }
  });

  $$("[data-etog]", main).forEach(b => b.addEventListener("click", async () => {
    const id = b.dataset.etog, e = EMPLOYEES.find(x => x.id === id);
    const next = e.active === false;
    b.disabled = true;
    try {
      const batch = writeBatch(db);
      batch.update(ref("employees", id), { active: next });
      batch.update(doc(db, "users", id), { active: next });
      await batch.commit();
      e.active = next;
      toast(next ? "تم تفعيل الحساب" : "تم إيقاف الحساب");
      renderOwner();
    } catch (err) { b.disabled = false; toast(errText(err)); }
  }));
  $$("[data-ereset]", main).forEach(b => b.addEventListener("click", async () => {
    const e = EMPLOYEES.find(x => x.id === b.dataset.ereset);
    try { await sendPasswordResetEmail(auth, e.email); toast("تم إرسال رابط تغيير كلمة المرور للإيميل"); }
    catch (err) { toast(errText(err)); }
  }));
  $$("[data-edel]", main).forEach(b => b.addEventListener("click", async () => {
    if (!confirm("حذف الموظف من القائمة؟ سيتوقف دخوله. سجل بصماته القديم يبقى محفوظًا.")) return;
    const id = b.dataset.edel;
    try {
      const batch = writeBatch(db);
      batch.delete(ref("employees", id));
      batch.update(doc(db, "users", id), { active: false });
      await batch.commit();
      EMPLOYEES = EMPLOYEES.filter(x => x.id !== id);
      renderOwner();
    } catch (err) { toast(errText(err)); }
  }));
}

/* ---------- Shared GPS punch panel (every employee, incl. owner / reception / accountant) ---------- */
async function renderPunchPanel(box, tok) {
  if (!box) return;
  box.innerHTML = `<div class="panel"><p class="muted">جاري التحميل…</p></div>`;
  const uid = G.uid;
  let emp = null, punches = [];
  try {
    const eSnap = await getDoc(ref("employees", uid));
    if (eSnap.exists()) emp = { id: eSnap.id, ...eSnap.data() };
    else if (role() === "owner" && !G.support) {
      const data = {
        name: G.profile.name || "المدير", jobTitle: "manager", jobLabel: "مدير الجيم", role: "owner",
        email: auth.currentUser?.email || "", active: true, createdAt: serverTimestamp()
      };
      await setDoc(ref("employees", uid), data);
      emp = { id: uid, ...data };
    }
    if (emp) {
      const hSnap = await getDocs(query(col("staff_attendance"), where("employeeId", "==", uid)));
      punches = hSnap.docs.map(d => d.data()).sort((a, b) => (toDate(b.ts)?.getTime() || 0) - (toDate(a.ts)?.getTime() || 0));
    }
  } catch (e) {
    if (tok !== RT) return;
    box.innerHTML = `<div class="panel"><p class="msg err">${ico("alert", "sm")} ${esc(errText(e))}</p></div>`;
    return;
  }
  if (tok !== RT) return;
  if (!emp) {
    box.innerHTML = `<div class="panel"><p class="msg err">${ico("alert", "sm")} لم تُضَف كموظف في قائمة الجيم بعد. اطلب من المدير إضافتك لتظهر لك البصمة.</p></div>`;
    return;
  }

  const todayIn = emp.lastDate === todayStr() && emp.status === "in";
  const gymLat = Number(G.gym.lat), gymLng = Number(G.gym.lng);
  const hasLoc = G.gym.lat !== undefined && G.gym.lat !== "" && G.gym.lng !== undefined && G.gym.lng !== "" && !isNaN(gymLat) && !isNaN(gymLng);
  const maxRadius = Number(G.gym.gpsRadius) || 250;

  box.innerHTML = `
  <div class="panel">
    <div class="top" style="margin-bottom:8px">
      <div class="who"><h1 style="font-size:18px">${esc(emp.name)}</h1><div class="sub">${esc(emp.jobLabel || "")}</div></div>
      <span class="tag ${todayIn ? "active" : "none"}">${todayIn ? "حاضر الآن" : "غير مسجل حضور"}</span>
    </div>
    <div class="stat"><span>آخر بصمة</span><b>${esc(fmtDateTime(toDate(emp.lastAt)))}</b></div>
    ${hasLoc ? "" : `<p class="msg err" style="margin-top:10px">${ico("alert", "sm")} لم يحدد المدير موقع الجيم بعد، لذلك لن يتم التحقق من النطاق.</p>`}
    <button class="btn punch-btn" id="punchBtn" style="margin-top:12px">${ico("mapPin")} ${todayIn ? "بصمة انصراف" : "بصمة حضور"}</button>
    <div class="hint" style="margin-top:8px">يتم تحديد موقعك عبر GPS. اسمح للمتصفح باستخدام الموقع.</div>
  </div>
  <h2>${ico("clock")} آخر بصماتي</h2>
  <div class="rows">${punches.length ? punches.slice(0, 15).map(p => `
    <div class="row"><div class="name"><span class="tag ${p.type === "in" ? "active" : "soon"}">${p.type === "in" ? "حضور" : "انصراف"}</span> ${esc(fmtDateTime(toDate(p.ts)))}</div>
    <div class="meta">${p.distanceMeters != null ? esc(p.distanceMeters) + " متر من الجيم" : ""}</div></div>`).join("")
    : `<div class="empty">لا توجد بصمات بعد.</div>`}</div>`;

  $("#punchBtn", box).addEventListener("click", async ev => {
    const btn = ev.currentTarget; btn.disabled = true;
    const type = todayIn ? "out" : "in";
    try {
      const loc = await getCurrentGps();
      let dist = null;
      if (hasLoc) {
        dist = Math.round(haversineMeters(loc.lat, loc.lng, gymLat, gymLng));
        if (dist > maxRadius) { btn.disabled = false; return toast(`أنت خارج نطاق الجيم (${dist} متر من أصل ${maxRadius} متر).`); }
      }
      await addDoc(col("staff_attendance"), {
        employeeId: uid, employeeName: emp.name, jobTitle: emp.jobTitle || "", jobLabel: emp.jobLabel || "",
        type, date: todayStr(), lat: loc.lat, lng: loc.lng, distanceMeters: dist, acc: loc.acc,
        ts: serverTimestamp(), by: uid
      });
      await updateDoc(ref("employees", uid), { status: type, lastDate: todayStr(), lastAt: serverTimestamp(), lastDist: dist });
      toast(type === "in" ? "تم تسجيل حضورك" : "تم تسجيل انصرافك");
      renderPunchPanel(box, RT);
    } catch (e) { btn.disabled = false; toast(e.message || errText(e)); }
  });
}

function screenPunch(main, tok) {
  main.innerHTML = `<h2>${ico("mapPin")} بصمة الحضور والانصراف</h2><div id="myPunch"></div>`;
  renderPunchPanel($("#myPunch", main), tok);
}

/* ---------- Store & Cafeteria ---------- */
function screenStore(main) {
  const CATS = { gym: "منتجات الجيم", cafe: "الكافتيريا" };
  if (!isOwner()) S.storeTab = "pos";
  main.innerHTML = `
  ${isOwner() ? `<div class="seg">
    <button class="${S.storeTab === "pos" ? "active" : ""}" data-st="pos">${ico("cart", "sm")} نقطة البيع</button>
    <button class="${S.storeTab === "manage" ? "active" : ""}" data-st="manage">${ico("package", "sm")} إدارة المنتجات</button>
  </div>` : ""}
  <div id="storeBody"></div>`;

  $$(".seg button", main).forEach(b => b.addEventListener("click", () => { S.storeTab = b.dataset.st; S.editProd = null; screenStore(main); }));
  if (isOwner()) {
    const fab = document.createElement("button");
    fab.type = "button"; fab.className = "fab"; fab.setAttribute("aria-label", "إضافة منتج جديد"); fab.innerHTML = ico("plus");
    fab.addEventListener("click", () => openProductModal(null, main));
    main.appendChild(fab);
  }
  const body = $("#storeBody", main);

  if (S.storeTab === "pos") {
    const filtered = PRODUCTS.filter(p => S.storeCat === "all" || p.category === S.storeCat);
    const total = S.cart.reduce((a, c) => a + c.price * c.qty, 0);

    body.innerHTML = `
    <div class="toolbar">
      <select id="scFilter" style="max-width:100%">
        <option value="all">كل الأقسام (الجيم + الكافتيريا)</option>
        <option value="cafe">الكافتيريا والمشروبات</option>
        <option value="gym">منتجات ومكملات الجيم</option>
      </select>
    </div>
    ${filtered.length ? `
    <div class="prod-grid">
      ${filtered.map(p => {
        const out = (Number(p.stock) || 0) <= 0;
        return `
        <button class="prod-card" data-addc="${esc(p.id)}" ${out ? "disabled" : ""}>
          <div>
            ${imgTag(p.imgUrl, "prod-thumb", p.name)}
            <span class="tag cat">${ico(p.category === "cafe" ? "coffee" : "dumbbell", "sm")} ${esc(CATS[p.category] || "منتج")}</span>
            <div class="pname">${esc(p.name)}</div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
            <span class="pprice">${money(p.price)}</span>
            <span class="pstock">${out ? "نفد المخزون" : `متاح ${esc(p.stock)}`}</span>
          </div>
        </button>`;
      }).join("")}
    </div>` : `<div class="panel empty" style="margin-bottom:16px">لا توجد منتجات في هذا القسم.</div>`}

    <h2>${ico("cart")} سلة المشتريات</h2>
    <div class="panel">
      ${S.cart.length ? `
        ${S.cart.map(item => `
          <div class="cart-item">
            <div><div style="font-weight:700">${esc(item.name)}</div>
            <div class="muted" style="font-size:13px">${money(item.price)} × ${item.qty} = <b>${money(item.price * item.qty)}</b></div></div>
            <div class="qty-ctrl">
              <button type="button" data-dec="${esc(item.id)}" aria-label="إنقاص">${ico("minus", "sm")}</button>
              <b>${item.qty}</b>
              <button type="button" data-inc="${esc(item.id)}" aria-label="زيادة">${ico("plus", "sm")}</button>
            </div>
          </div>`).join("")}
        <div class="stat big" style="margin-top:8px"><span>الإجمالي</span><b>${money(total)}</b></div>
        <div class="field" style="margin-top:12px">
          <label for="payMode">طريقة الدفع</label>
          <select id="payMode"><option value="cash">دفع نقدي الآن (كاش)</option><option value="credit">إضافة على حساب عضو (آجل)</option></select>
        </div>
        <div class="field" id="creditMemberBox" style="display:none">
          <label for="creditMember">اختر العضو</label>
          <select id="creditMember"><option value="">-- اختر العضو --</option>
            ${MEMBERS.slice().sort((a, b) => (a.name || "").localeCompare(b.name || "", "ar")).map(m => `<option value="${esc(m.id)}">${esc(m.name)} (كود ${esc(m.code)})</option>`).join("")}
          </select>
        </div>
        <button class="btn" id="checkoutBtn" style="margin-top:8px">${ico("check")} إتمام عملية البيع</button>
      ` : `<div class="empty" style="padding:14px">اضغط على أي منتج بالأعلى لإضافته للسلة.</div>`}
    </div>`;

    $("#scFilter").value = S.storeCat;
    $("#scFilter").addEventListener("change", e => { S.storeCat = e.target.value; screenStore(main); });

    $$("[data-addc]", body).forEach(b => b.addEventListener("click", () => {
      const p = PRODUCTS.find(x => x.id === b.dataset.addc);
      if (!p) return;
      const ex = S.cart.find(c => c.id === p.id);
      if (ex) { if (ex.qty >= Number(p.stock)) return toast("لا توجد كمية إضافية في المخزون."); ex.qty++; }
      else S.cart.push({ id: p.id, name: p.name, price: Number(p.price), qty: 1, category: p.category });
      screenStore(main);
    }));
    $$("[data-inc]", body).forEach(b => b.addEventListener("click", () => {
      const p = PRODUCTS.find(x => x.id === b.dataset.inc);
      const item = S.cart.find(c => c.id === b.dataset.inc);
      if (item && p && item.qty < Number(p.stock)) { item.qty++; screenStore(main); }
      else toast("وصلت للحد الأقصى المتاح بالمخزون.");
    }));
    $$("[data-dec]", body).forEach(b => b.addEventListener("click", () => {
      const idx = S.cart.findIndex(c => c.id === b.dataset.dec);
      if (idx > -1) { S.cart[idx].qty--; if (S.cart[idx].qty <= 0) S.cart.splice(idx, 1); screenStore(main); }
    }));
    const modeSel = $("#payMode", body);
    if (modeSel) modeSel.addEventListener("change", () => { $("#creditMemberBox").style.display = modeSel.value === "credit" ? "block" : "none"; });

    const chk = $("#checkoutBtn", body);
    if (chk) chk.addEventListener("click", async () => {
      const mode = $("#payMode").value;
      const memberId = mode === "credit" ? $("#creditMember").value : "";
      const member = memberId ? MEMBERS.find(m => m.id === memberId) : null;
      if (mode === "credit" && !member) return toast("اختر العضو لإضافة المبلغ على حسابه.");
      chk.disabled = true; chk.textContent = "جاري التسجيل…";
      const summary = S.cart.map(c => `${c.name} ×${c.qty}`).join("، ");
      try {
        const batch = writeBatch(db);
        for (const item of S.cart) batch.update(ref("products", item.id), { stock: increment(-item.qty) });
        batch.set(doc(col("store_sales")), {
          items: S.cart, total, mode, memberId: member ? member.id : null,
          memberName: member ? member.name : "عميل نقدي", date: todayStr(), ts: serverTimestamp(), by: G.uid
        });
        if (mode === "cash") {
          batch.set(doc(col("payments")), {
            memberId: null, memberName: "مبيعات الستور", amount: total, date: todayStr(),
            type: "store", note: `ستور: ${summary}`, ts: serverTimestamp(), by: G.uid
          });
        } else {
          batch.update(ref("members", member.id), { balance: increment(total) });
        }
        await batch.commit();
        for (const item of S.cart) {
          const p = PRODUCTS.find(x => x.id === item.id);
          if (p) p.stock = Math.max(0, (Number(p.stock) || 0) - item.qty);
        }
        if (member) member.balance = Number(member.balance || 0) + total;
        S.cart = [];
        toast(mode === "cash" ? `تم بيع بقيمة ${money(total)}` : `تمت إضافة ${money(total)} على حساب ${member.name}`);
        screenStore(main);
      } catch (e) { chk.disabled = false; chk.innerHTML = `${ico("check")} إتمام عملية البيع`; toast(errText(e)); }
    });
    return;
  }

  // ---- manage tab: product cards + "+" button ----
  const CAT_LABEL = { gym: "منتجات الجيم", cafe: "الكافتيريا" };
  body.innerHTML = `
  <div class="top" style="margin-bottom:12px">
    <h2 style="margin:0">${ico("package")} المنتجات (${PRODUCTS.length})</h2>
    <button class="btn sm" type="button" id="addProdBtn">${ico("plus", "sm")} منتج جديد</button>
  </div>
  ${PRODUCTS.length ? `<div class="prod-grid manage">${PRODUCTS.map(p => `
    <div class="prod-card static">
      ${imgTag(p.imgUrl, "prod-thumb", p.name) || `<div class="prod-thumb ph">${ico("package")}</div>`}
      <div class="pname">${esc(p.name)}</div>
      <div class="pprice">${money(p.price)}</div>
      <div class="pstock">${esc(CAT_LABEL[p.category] || "")} · المتاح ${esc(p.stock ?? 0)}</div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn ghost sm" data-editpr="${esc(p.id)}">${ico("edit", "sm")} تعديل</button>
        <button class="btn danger sm" data-delpr="${esc(p.id)}">${ico("trash", "sm")} حذف</button>
      </div>
    </div>`).join("")}</div>`
    : `<div class="panel empty">لا توجد منتجات بعد. اضغط «منتج جديد» لإضافة أول منتج.</div>`}`;

  $("#addProdBtn", body).addEventListener("click", () => openProductModal(null, main));
  $$("[data-editpr]", body).forEach(b => b.addEventListener("click", () => openProductModal(PRODUCTS.find(p => p.id === b.dataset.editpr), main)));
  $$("[data-delpr]", body).forEach(b => b.addEventListener("click", async () => {
    if (!confirm("حذف هذا المنتج نهائيًا؟")) return;
    try { await deleteDoc(ref("products", b.dataset.delpr)); await loadProducts(); toast("تم حذف المنتج"); screenStore(main); }
    catch (e) { toast(errText(e)); }
  }));
}

/* ---------- Product modal: image (+), name, price + currency, save ---------- */
function openProductModal(editing, main) {
  const gymCur = G.gym.currency || "EGP";
  const ov = openModal(`
    <div class="modal-h"><b>${editing ? "تعديل منتج" : "منتج جديد"}</b>
      <button class="btn ghost sm" type="button" id="mClose" aria-label="إغلاق">${ico("x", "sm")}</button></div>
    <form id="prodForm" novalidate>
      <div class="field">${imgPickerHtml("pImg", { label: "صورة المنتج", current: editing?.imgUrl || "" })}</div>
      <div class="field"><label for="pName">اسم المنتج</label>
        <input id="pName" maxlength="100" value="${esc(editing?.name || "")}" placeholder="مثال: بروتين واي، مياه"></div>
      <div class="field"><label for="pPrice">السعر</label>
        <div class="pwrow">
          <input id="pPrice" type="number" inputmode="decimal" min="0" step="any" dir="ltr" value="${esc(editing?.price ?? "")}" placeholder="0">
          <select id="pCur" style="width:auto;min-width:150px" aria-label="العملة">${currencyOptions(gymCur)}</select>
        </div>
        <div class="hint">الافتراضي بالجنيه. اختر عملة أخرى للبيع في دول أخرى، وتنطبق على كل أسعار الجيم.</div></div>
      <details class="more"><summary>خيارات إضافية (القسم والكمية)</summary>
        <div class="two" style="margin-top:10px">
          <div class="field"><label for="pCat">القسم</label>
            <select id="pCat"><option value="gym" ${editing?.category === "gym" ? "selected" : ""}>منتجات الجيم</option><option value="cafe" ${editing?.category === "cafe" ? "selected" : ""}>الكافتيريا</option></select></div>
          <div class="field"><label for="pStock">الكمية بالمخزون</label>
            <input id="pStock" type="number" inputmode="numeric" min="0" dir="ltr" value="${esc(editing?.stock ?? 100)}"></div>
        </div>
      </details>
      <button class="btn" type="submit" id="pSave" style="margin-top:12px">${ico("check")} حفظ المنتج</button>
    </form>`);
  $("#mClose", ov).addEventListener("click", closeModal);
  const pick = wireImgPicker(ov, "pImg");

  $("#prodForm", ov).addEventListener("submit", async ev => {
    ev.preventDefault();
    const name = $("#pName").value.trim(), price = num($("#pPrice").value);
    const category = $("#pCat").value, stock = Math.max(0, Math.round(num($("#pStock").value)));
    const cur = $("#pCur").value;
    if (!name) return toast("اكتب اسم المنتج.");
    if (price <= 0) return toast("اكتب سعرًا صحيحًا.");
    const btn = $("#pSave"); btn.disabled = true;
    const label = btn.innerHTML;
    try {
      let imgUrl = editing?.imgUrl || "";
      if (pick.file) {
        btn.textContent = "جاري رفع الصورة…";
        const up = await uploadImage(pick.file, `gyms/${G.gymId}/products/${Date.now()}`, { max: 640, q: 0.8, inlineMax: 320, inlineQ: 0.7 });
        imgUrl = up.url;
        if (up.stored === "inline") toast("تم حفظ الصورة داخل قاعدة البيانات (Firebase Storage غير مفعّل).");
      }
      btn.textContent = "جاري الحفظ…";
      if (cur !== gymCur) {
        await setDoc(ref("meta", "public"), { currency: cur }, { merge: true });
        G.gym.currency = cur; CUR = cur;
      }
      if (editing) await updateDoc(ref("products", editing.id), { name, category, imgUrl, price, stock });
      else await addDoc(col("products"), { name, category, imgUrl, price, stock, createdAt: serverTimestamp() });
      await loadProducts();
      closeModal();
      toast("تم حفظ المنتج");
      screenStore(main);
    } catch (e) { btn.disabled = false; btn.innerHTML = label; toast(e.message || errText(e)); }
  });
}

const NUTRITION_TEMPLATES = [
  { title: "إرشادات التغذية والترطيب اليومية", text: "أهلًا كابتن، تذكير بنظام التغذية اليومي: احرص على شرب 2.5 - 3 لتر ماء، وتناول مصدر بروتين واضح في كل وجبة، والالتزام بالنوم الكافي." },
  { title: "تنبيه قبل وبعد التمرين", text: "أهلًا كابتن، تناول وجبة خفيفة غنية بالكربوهيدرات قبل التمرين بـ 60-90 دقيقة، ووجبة بروتين بعد التمرين خلال ساعتين." }
];
function screenBroadcast(main) {
  const targets = MEMBERS.filter(m => m.phone && waPhone(m.phone) && (S.broadcastTarget === "all" || ["active", "soon"].includes(calcMemberState(m).key)))

/* ---------- Money (owner + accountant) ---------- */
async function screenMoney(main, tok) {
  main.innerHTML = `<p class="muted">جاري التحميل…</p>`;
  let pay, exp;
  try {
    [pay, exp] = await Promise.all([
      getDocs(query(col("payments"), where("date", ">=", monthStart()), where("date", "<=", monthEnd()))),
      getDocs(query(col("expenses"), where("date", ">=", monthStart()), where("date", "<=", monthEnd())))
    ]);
  } catch (e) { if (tok !== RT) return; main.innerHTML = `<p class="msg err">${esc(errText(e))}</p>`; return; }
  if (tok !== RT) return;

  const byNewest = (a, b) => String(b.date).localeCompare(String(a.date)) || ((toDate(b.ts)?.getTime() || 0) - (toDate(a.ts)?.getTime() || 0));
  const payments = pay.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNewest);
  const expenses = exp.docs.map(d => ({ id: d.id, ...d.data() })).sort(byNewest);
  const rev = sum(payments), ex = sum(expenses);
  const subRev = sum(payments.filter(p => p.type !== "store"));
  const storeRev = sum(payments.filter(p => p.type === "store"));

  main.innerHTML = `
  <div class="top" style="margin-bottom:12px">
    <h2 style="margin:0">${ico("wallet")} ملخص الشهر</h2>
    <button class="btn soft sm" type="button" id="exportExcelBtn">${ico("download", "sm")} تصدير Excel</button>
  </div>
  <div class="panel">
    <div class="stat"><span>إجمالي الإيرادات</span><b>${money(rev)}</b></div>
    <div class="stat"><span>إيراد الاشتراكات</span><b>${money(subRev)}</b></div>
    <div class="stat"><span>إيراد الستور والكافتيريا</span><b>${money(storeRev)}</b></div>
    <div class="stat"><span>المصروفات</span><b>${money(ex)}</b></div>
    <div class="stat big"><span>الصافي</span><b>${money(rev - ex)}</b></div>
  </div>

  <h2>${ico("chart")} التحليل المالي للشهر</h2>
  <div class="panel" style="margin-bottom:14px">
    <div style="font-weight:700;font-size:14px;margin-bottom:6px">الإيرادات مقابل المصروفات (يومي)</div>
    <div class="chart-wrap"><canvas id="revExpChart"></canvas></div>
  </div>
  <div class="panel">
    <div style="font-weight:700;font-size:14px;margin-bottom:6px">توزيع مصادر الإيرادات</div>
    <div class="chart-wrap sm"><canvas id="sourceChart"></canvas></div>
  </div>

  <h2>${ico("plus")} إضافة مصروف</h2>
  <form class="panel" id="xform" novalidate>
    <div class="field"><label for="xt">البند</label><input id="xt" maxlength="120" placeholder="مثال: كهرباء، رواتب، صيانة"></div>
    <div class="two">
      <div class="field"><label for="xa">المبلغ</label><input id="xa" type="number" inputmode="decimal" min="0" dir="ltr"></div>
      <div class="field"><label for="xd">التاريخ</label><input id="xd" type="date" dir="ltr" value="${todayStr()}"></div>
    </div>
    <button class="btn" type="submit" id="xsave">${ico("check")} حفظ المصروف</button>
  </form>

  <h2>${ico("trendingDown")} مصروفات الشهر</h2>
  <div class="rows">${expenses.length ? expenses.slice(0, 40).map(x => `
    <div class="row"><div class="name">${esc(x.title)} — ${money(x.amount)}</div><div class="meta">${esc(x.date)}</div>
    ${isOwner() ? `<div class="acts"><button class="btn danger sm" data-delx="${esc(x.id)}">${ico("trash", "sm")} حذف</button></div>` : ""}</div>`).join("")
    : `<div class="empty">لا توجد مصروفات هذا الشهر.</div>`}</div>

  <h2>${ico("trendingUp")} إيرادات الشهر</h2>
  <div class="rows">${payments.length ? payments.slice(0, 40).map(p => `
    <div class="row"><div class="name">${esc(p.memberName || "")} — ${money(p.amount)}</div><div class="meta">${esc(p.date)} · ${esc(p.note || "")}</div></div>`).join("")
    : `<div class="empty">لا توجد إيرادات هذا الشهر.</div>`}</div>`;

  $("#exportExcelBtn").addEventListener("click", () => { exportRevenueExcel(payments, `revenues_${monthStart()}.csv`); toast("تم تحميل شيت الإيرادات"); });

  if (typeof Chart !== "undefined") {
    destroyCharts();
    const now = new Date();
    const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const labels = [], revSeries = [], expSeries = [];
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(d)}`;
      labels.push(String(d));
      revSeries.push(sum(payments.filter(p => p.date === ds)));
      expSeries.push(sum(expenses.filter(x => x.date === ds)));
    }
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    const gridColor = isDark ? "rgba(255,255,255,0.08)" : "rgba(15,23,42,0.06)";
    const textColor = isDark ? "#94A3B8" : "#64748B";
    const ctx1 = $("#revExpChart")?.getContext("2d");
    if (ctx1) charts.push(new Chart(ctx1, {
      type: "bar",
      data: { labels, datasets: [
        { label: "الإيرادات", data: revSeries, backgroundColor: "#EA580C", borderRadius: 4 },
        { label: "المصروفات", data: expSeries, backgroundColor: "#94A3B8", borderRadius: 4 }
      ] },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: textColor, font: { family: "IBM Plex Sans Arabic" } } } },
        scales: { x: { grid: { display: false }, ticks: { color: textColor, maxTicksLimit: 10 } }, y: { grid: { color: gridColor }, ticks: { color: textColor } } } }
    }));
    const ctx2 = $("#sourceChart")?.getContext("2d");
    if (ctx2) charts.push(new Chart(ctx2, {
      type: "doughnut",
      data: { labels: ["اشتراكات الجيم", "الستور والكافتيريا"], datasets: [{ data: [subRev || 0, storeRev || 0], backgroundColor: ["#EA580C", "#FDBA74"], borderWidth: 0 }] },
      options: { responsive: true, maintainAspectRatio: false, cutout: "65%",
        plugins: { legend: { position: "bottom", labels: { color: textColor, font: { family: "IBM Plex Sans Arabic" } } } } }
    }));
  }

  $("#xform").addEventListener("submit", async ev => {
    ev.preventDefault();
    const title = $("#xt").value.trim(), amount = num($("#xa").value), date = $("#xd").value;
    if (!title || amount <= 0 || !date) return toast("أكمل البند والمبلغ والتاريخ.");
    const btn = $("#xsave"); btn.disabled = true;
    try { await addDoc(col("expenses"), { title, amount, date, ts: serverTimestamp(), by: G.uid }); toast("تم حفظ المصروف"); renderOwner(); }
    catch (e) { btn.disabled = false; toast(errText(e)); }
  });
  $$("[data-delx]", main).forEach(b => b.addEventListener("click", async () => {
    if (!confirm("حذف هذا المصروف؟")) return;
    try { await deleteDoc(ref("expenses", b.dataset.delx)); renderOwner(); } catch (e) { toast(errText(e)); }
  }));
}

    ev.preventDefault();

    const sessions = Math.max(1, Math.round(num($("#psess").value) || 30));
    if (!name || days < 1) return toast("اكتب اسم الباقة ومدتها بالأيام.");
    const btn = $("#psave"); btn.disabled = true;
    try {
      if (editing) await updateDoc(ref("plans", editing.id), { name, days, price, sessions });
      else await addDoc(col("plans"), { name, days, price, sessions, createdAt: serverTimestamp() });
      S.editPlan = null; await loadPlans(); toast("تم الحفظ"); renderOwner();
    } catch (e) { btn.disabled = false; toast(errText(e)); }
  });

  const purge = $("#purgeBtn");
  if (purge) purge.addEventListener("click", async () => {
    if (!confirm("حذف كلمات المرور القديمة المخزنة لجميع الأعضاء؟ لن يعمل الدخول القديم بها.")) return;
    purge.disabled = true;
    try {
      for (let i = 0; i < legacy.length; i += 400) {
        const batch = writeBatch(db);
        legacy.slice(i, i + 400).forEach(m => batch.update(ref("members", m.id), { password: deleteField() }));
        await batch.commit();
      }
      legacy.forEach(m => { delete m.password; });
      toast("تم حذف كلمات المرور القديمة");
      renderOwner();
    } catch (e) { purge.disabled = false; toast(errText(e)); }
  });
}

async function startStaff(uid, profile, gym, gymId, support = false) {
  let pub = {};
  try {
    const s = await withTimeout(getDoc(doc(db, "gyms", gymId, "meta", "public")));
    if (s.exists()) pub = s.data();
  } catch {}
  G = { uid, profile, gym: { ...gym, ...pub }, gymId, support };
  CUR = G.gym.currency || "EGP";
  const r = profile.role;
  S.tab = r === "accountant" ? "money" : (r === "reception" ? "members" : "home");
  S.sub = null; S.filter = "all"; S.q = ""; S.editPlan = null; S.cred = null;
  S.storeTab = "pos"; S.storeCat = "all"; S.cart = []; S.editProd = null;
  root.innerHTML = `<div class="loading">جاري تحميل بيانات الجيم…</div>`;
  try {
    const jobs = [];
    if (r === "owner" || r === "reception") jobs.push(loadMembers(), loadPlans(), loadProducts());
    if (r === "owner") jobs.push(loadEmployees());
    await withTimeout(Promise.all(jobs), 30000);
  } catch (e) {
    return viewBlocked("تعذر تحميل بيانات الجيم", errText(e), true);
  }
  renderOwner();
}
